name: Public checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Public tooling regressions
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Compile and launch
        run: python tools/run.py --setup
      - name: All template languages launch
        if: github.repository == 'RZhaniya/daa-assignment-3-festival'
        run: python -c "import subprocess; [subprocess.run(['python','tools/run.py','--language',lang,'--setup'],check=True) for lang in ['Java','Python','Cpp','CSharp']]"
      - name: Algorithm examples (TODOs intentionally fail until implemented)
        run: python tools/run.py --check
      - name: Submission preparation
        if: always() && github.repository != 'RZhaniya/daa-assignment-3-festival'
        run: python tools/check_submission.py
