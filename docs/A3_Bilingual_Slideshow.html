function render(){
 locationState();const i=chapters.findIndex(c=>c.id===current), c=chapters[i];document.documentElement.lang=language==='RU'?'ru':'en';document.title=c[language].title+' | DAA';
 $('title').textContent=c[language].title;$('eyebrow').textContent=text('Раздел ','Chapter ')+(i+1)+' / '+chapters.length;$('body').innerHTML=c[language].html;
 $('ru').setAttribute('aria-pressed',String(language==='RU'));$('en').setAttribute('aria-pressed',String(language==='EN'));$('navTitle').textContent=text('Содержание','Contents');$('searchLabel').textContent=text('Найти тему','Find a topic');$('search').placeholder=text('Алгоритм, код или термин','Algorithm, code or term');$('contents').setAttribute('aria-label',text('Содержание урока','Lesson contents'));$('navHint').textContent=text('Сначала разберите пример и инвариант, затем сопоставьте их с кодом.','Trace the example and invariant, then connect them to the code.');
 $('templateLink').textContent=text('Шаблон задания','Assignment template');$('footerNote').textContent=text('Алгоритмы и интерфейсы проверяйте по полному условию своей версии задания. Учебный код и примеры доступны для самостоятельного запуска.','Check algorithms and interfaces against the full specification of your assignment version. Download and run the teaching examples independently.');
 $('implementation').replaceChildren();if(c.code){$('implementation').innerHTML='<div class="codebar"><h2>'+text('Реализация Java 17','Java 17 implementation')+'</h2><button id="copyCode">'+text('Копировать код','Copy code')+'</button></div><p class="small">'+text('Фрагмент полного GraphLesson.java. Зависимые классы определены в разделах представления графа, DSU и DFS.','Extract from the complete GraphLesson.java. Supporting classes appear in the graph, DSU and DFS sections.')+' <a href="code/GraphLesson.java" download>'+text('Полный исходник','Complete source')+'</a></p><pre><code id="source"></code></pre><p id="copyStatus" class="status" role="status"></p>';$('source').textContent=c.code;$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(c.code);$('copyStatus').textContent=text('Код скопирован.','Code copied.');}catch(e){const r=document.createRange();r.selectNodeContents($('source'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copyStatus').textContent=text('Код выделен. Нажмите Ctrl+C / ⌘C.','Code selected. Press Ctrl+C / ⌘C.');}};}
 $('reading').replaceChildren();if(c.book){const [section,page,pdf,online]=c.book;$('reading').className='reading';$('reading').innerHTML='<h3>'+text('Прочитайте в учебнике','Textbook reading')+'</h3><p>CLRS 4e, §'+esc(section)+', '+text('печатная страница ','printed page ')+page+'.</p><p><a class="openBook" data-page="'+page+'" href="#topic=reading&lang='+language+'">'+text('Открыть страницу в своей PDF-копии','Open this page in your PDF copy')+'</a> · <a href="https://algs4.cs.princeton.edu/'+online+'/" target="_blank" rel="noopener">Sedgewick &amp; Wayne: '+esc(online)+'</a></p>';}
 else $('reading').className='';
 document.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tablewrap';t.replaceWith(w);w.append(t);});
 document.querySelectorAll('.bookPicker').forEach(paintBookPicker);document.querySelectorAll('.openBook').forEach(updateBookLink);document.querySelectorAll('.trace').forEach(paintTrace);document.querySelectorAll('.lessonVideo').forEach(paintVideo);
 $('prev').disabled=i===0;$('next').disabled=i===chapters.length-1;$('prev').textContent=i?text('← ','← ')+chapters[i-1][language].title:text('Начало','Start');$('next').textContent=i<chapters.length-1?chapters[i+1][language].title+' →':text('Конец урока','End');$('prev').onclick=()=>{if(i)go(chapters[i-1].id);};$('next').onclick=()=>{if(i<chapters.length-1)go(chapters[i+1].id);};paintNav();
}
function updateBookLink(a){if(bookURL){a.href=bookURL+'#page='+(Number(a.dataset.page)+offset);a.target='_blank';a.rel='noopener';}else{a.href='#'+new URLSearchParams({topic:'reading',lang:language});a.removeAttribute('target');}}
function paintBookPicker(box){
 box.innerHTML='<label>'+text('Выберите CLRS 4e в формате PDF:','Choose your CLRS 4e PDF:')+' <input type="file" accept="application/pdf,.pdf" aria-label="CLRS PDF"></label><label>'+text('Смещение PDF-страницы относительно печатной:','PDF-page offset from the printed page:')+' <input type="number" min="-1000" max="1000" value="'+offset+'" aria-label="PDF page offset"></label><p class="bookStatus" role="status">'+(bookName?esc(bookName):text('Книга ещё не выбрана.','No book selected.'))+'</p><p>'+text('Выберите раздел:','Choose a section:')+'</p><div class="bookLinks"></div>';
 const links=box.querySelector('.bookLinks');for(const [title,page] of [['DSU',527],['DFS',563],['Topo',573],['SCC',576],['MST',591],['DAG',616]]){const a=document.createElement('a');a.textContent=title+' ('+page+')';a.dataset.page=page;a.className='openBook';a.style.marginRight='15px';updateBookLink(a);links.append(a);}
 box.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.pdf')){box.querySelector('.bookStatus').textContent=text('Выберите файл PDF.','Choose a PDF file.');return;}if(bookURL)URL.revokeObjectURL(bookURL);bookURL=URL.createObjectURL(f);bookName=f.name;box.querySelector('.bookStatus').textContent=f.name+' · '+text('готово к чтению; файл остаётся в браузере','ready; the file remains in your browser');document.querySelectorAll('.openBook').forEach(updateBookLink);};
 box.querySelector('input[type=number]').onchange=e=>{const n=Number(e.target.value);if(Number.isInteger(n)){offset=n;document.querySelectorAll('.openBook').forEach(updateBookLink);}};
}
const cables=[[0,1,6],[0,2,2],[1,2,3],[1,3,5],[2,3,4],[3,4,-1],[0,1,6],[2,2,-8]], roads=[[0,1,5],[0,2,2],[1,3,-4],[2,3,2],[3,4,3],[2,4,8]];

function graphSVG(rows,selected,directed){
 const p=[[55,110],[210,45],[210,185],[385,110],[545,110],[545,230]], sel=new Set(selected||[]);
 let s='<svg viewBox="0 0 620 285" role="img" aria-label="'+text('Учебный граф: выделенные рёбра показывают текущее состояние','Worked graph: highlighted edges show the current state')+'"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#64758a"/></marker></defs>';
 rows.forEach(([u,v,w],i)=>{let[x,y]=p[u],[a,b]=p[v];const color=sel.has(i)?'#993d64':'#9aa8b7', width=sel.has(i)?4:1.5;
 if(u===v){s+='<path d="M'+(x-10)+','+(y+14)+' C'+(x-65)+','+(y+85)+' '+(x+65)+','+(y+85)+' '+(x+10)+','+(y+14)+'" fill="none" stroke="'+color+'" stroke-width="'+width+'"/><text x="'+x+'" y="'+(y+72)+'" text-anchor="middle" font-size="12">#'+i+': '+w+'</text>';return;}
 const dx=a-x,dy=b-y,len=Math.hypot(dx,dy),start=[x+dx/len*19,y+dy/len*19],end=[a-dx/len*24,b-dy/len*24],shift=i===6?-35:0,mx=(x+a)/2-dy/len*shift,my=(y+b)/2+dx/len*shift;
 s+='<path d="M'+start+' Q'+mx+','+my+' '+end+'" fill="none" stroke="'+color+'" stroke-width="'+width+'"'+(directed?' marker-end="url(#arrow)"':'')+'/>';
 const tx=(x+a)/2-dy/len*(shift/2+10),ty=(y+b)/2+dx/len*(shift/2+10);s+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" font-size="12" fill="#243b50" stroke="#f7f9fb" stroke-width="4" paint-order="stroke">#'+i+': '+w+'</text>';
 });p.forEach(([x,y],v)=>{s+='<circle cx="'+x+'" cy="'+y+'" r="18" fill="white" stroke="#314e67" stroke-width="2"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15">'+v+'</text>';});return s+'</svg>';
}
function paintTrace(box){
 const kind=box.dataset.trace,steps=traceData[kind];let step=0;
 function draw(){const item=steps[step];box.innerHTML='<h3>'+text('Разбор по шагам','Worked trace')+'</h3>'+(kind==='dsu'?'':graphSVG(kind==='dag'?roads:cables,item.ids,kind==='dag'))+'<div class="controls"><button class="tracePrev" aria-label="'+text('Предыдущее состояние','Previous state')+'">←</button><span class="stepcount">'+(step+1)+' / '+steps.length+'</span><button class="traceNext" aria-label="'+text('Следующее состояние','Next state')+'">→</button><button class="reset">'+text('Сначала','Reset')+'</button></div><p>'+esc(language==='RU'?item.ru:item.en)+'</p><div class="state">'+esc(item.state||('edge_ids=['+item.ids.join(',')+']; cost='+item.cost))+'</div>'+(kind==='dsu'?'':'<p class="small">'+text('Подпись #ID: вес. Выделены рёбра текущего леса или текущие родительские рёбра.','Labels are #ID: weight. Highlighting shows selected forest edges or current parent edges.')+'</p>');box.querySelector('.tracePrev').disabled=step===0;box.querySelector('.traceNext').disabled=step===steps.length-1;box.querySelector('.tracePrev').onclick=()=>{if(step){step--;draw();}};box.querySelector('.traceNext').onclick=()=>{if(step<steps.length-1){step++;draw();}};box.querySelector('.reset').onclick=()=>{step=0;draw();};}draw();
}
