<script id="lesson-data" type="application/json">[{"id": "overview", "RU": {"title": "От задачи к алгоритму", "html": "\n<p class=\"lead\">На фестивале нужно соединить площадки, согласовать подготовительные работы и рассчитать маршруты. Все три задачи описываются графами, но требуют разных алгоритмов.<\/p>\n<p>После урока вы должны уметь выбрать модель графа, объяснить шаги алгоритма, реализовать его и проверить результат. Начните с различий между задачами: минимальный остов соединяет вершины с минимальной общей стоимостью; кратчайший путь минимизирует стоимость маршрута из заданного источника; топологическая сортировка упорядочивает зависимости.<\/p>\n<h2>Где это используется<\/h2><table><tr><th>Задача<\/th><th>Практическое применение<\/th><th>Что нужно получить<\/th><\/tr><tr><td>DSU<\/td><td>Объединение сетевых сегментов, проверка связности при добавлении связей<\/td><td>Группы связных объектов<\/td><\/tr><tr><td>Краскал и Прим<\/td><td>Прокладка кабелей и труб в модели с заданными возможными соединениями<\/td><td>Минимальную суммарную стоимость остова<\/td><\/tr><tr><td>SCC<\/td><td>Анализ циклических зависимостей модулей и взаимной достижимости<\/td><td>Максимальные взаимно достижимые группы<\/td><\/tr><tr><td>Топологическая сортировка<\/td><td>Порядок сборки модулей, выполнения работ и вычислений<\/td><td>Порядок без нарушения зависимостей либо наличие цикла<\/td><\/tr><tr><td>Кратчайшие пути в DAG<\/td><td>Оптимизация последовательностей переходов без возврата к предыдущим состояниям<\/td><td>Расстояния и маршруты из источника<\/td><\/tr><\/table>\n<p>Модель определяет применимость решения. Реальная дорожная сеть обычно содержит циклы: алгоритм для DAG можно применять только после проверки ацикличности. Минимальная кабельная сеть не обеспечивает кратчайшие маршруты между всеми площадками. В реальном строительстве дополнительно учитывают ограничения, которых в модели задания нет.<\/p>\n<h2>Как работать с уроком<\/h2><p>Прочитайте постановку, проследите изменение состояния на примере, затем разберите реализацию. Код в этом уроке компилируется на Java 17 и использует обычные массивы, списки, стек и очередь с приоритетом. Раздел «Код в задании» показывает, как связать алгоритм с готовым вводом и выводом. Для другого языка сохраняйте инварианты и структуру данных, а не синтаксис Java.<\/p>\n"}, "EN": {"title": "From the problem to the algorithm", "html": "\n<p class=\"lead\">A festival needs cable connections, a preparation schedule and delivery routes. Each problem can be modelled as a graph, but the required algorithms solve different objectives.<\/p>\n<p>By the end of this lesson, you should be able to select the graph model, explain the algorithm, implement it and check its result. Distinguish the objectives first: a minimum spanning forest minimises the total cost of connections; a shortest-path algorithm minimises the cost from a specified source; a topological ordering respects directed dependencies.<\/p>\n<h2>Applications<\/h2><table><tr><th>Problem<\/th><th>Application<\/th><th>Required result<\/th><\/tr><tr><td>DSU<\/td><td>Merging network segments and answering connectivity queries as links are added<\/td><td>Connected groups<\/td><\/tr><tr><td>Kruskal and Prim<\/td><td>Cable or pipe layout with a specified set of candidate links<\/td><td>Minimum total spanning cost<\/td><\/tr><tr><td>SCC<\/td><td>Analysing cyclic module dependencies and mutual reachability<\/td><td>Maximal mutually reachable groups<\/td><\/tr><tr><td>Topological ordering<\/td><td>Build systems, work schedules and dependency-driven calculations<\/td><td>A valid order, or detection of a cycle<\/td><\/tr><tr><td>DAG shortest paths<\/td><td>Optimising transitions through stages that cannot return to earlier states<\/td><td>Source distances and routes<\/td><\/tr><\/table>\n<p>The model determines where an algorithm applies. A real road network usually contains cycles; the DAG algorithm requires an acyclicity check. A minimum cable network does not guarantee shortest routes between every pair of venues. Actual construction also has constraints outside this assignment's model.<\/p>\n<h2>How to study the lesson<\/h2><p>Read the objective, trace the changing state, then examine the implementation. The Java 17 code compiles and uses arrays, lists, an explicit stack and a priority queue. The assignment-integration section connects the algorithm to the supplied input/output adapters. When working in another language, preserve the invariants and data structures rather than the Java syntax.<\/p>\n"}, "code": "", "book": null}, {"id": "model", "RU": {"title": "Представление графа и ID рёбер", "html": "\n<p class=\"lead\">Сначала определите направление рёбер, смысл веса и состав ответа. Эти решения должны быть видны в структурах данных.<\/p>\n<p>Вершины задания имеют номера от 0 до n−1. Строка <code>edges[i]<\/code> задаёт ребро с исходным ID i. Этот ID не меняется при сортировке, помещении в очередь или построении обратного графа. Для взвешенного ребра храните <code>from<\/code>, <code>to<\/code>, <code>weight<\/code> и <code>id<\/code>.<\/p>\n<h2>Список смежности<\/h2><p>Для каждого v храните исходящие рёбра. В ориентированном графе добавляется одна запись. В неориентированном графе добавляются две ориентированные записи с одним ID: u→v и v→u. Это две записи одного ребра, а не два выбранных ребра леса. Петля не может попасть в остов. Параллельные рёбра сохраняйте отдельно.<\/p>\n<p>Список смежности занимает O(n+m) памяти. Матрица смежности занимает O(n²): для 100000 вершин она не подходит. Обход соседей в списках даёт O(n+m), если каждое ребро просматривается ограниченное число раз.<\/p>\n<h2>Типы и сравнения<\/h2><p>Номер вершины и отдельный вес в пределах задания помещаются в int, а сумма весов может выйти за его пределы. Например, три ребра по 1000000000 дают 3000000000. В Java используйте long для стоимости и Long[] для расстояний с null. Сравнивайте веса через Long.compare, а не вычитанием. В приведённом классе правило сравнения при равных весах использует ID только для воспроизводимости: задание допускает другие корректные оптимумы.<\/p>\n<p>Метод <code>edges(rows)<\/code> создаёт новые объекты с исходными ID. Краскал сортирует копию списка: исходный порядок остаётся доступен для восстановления пути. Метод <code>digraph<\/code> использует первые два столбца и подходит также для проверки ацикличности взвешенного графа.<\/p>\n"}, "EN": {"title": "Graph representation and edge IDs", "html": "\n<p class=\"lead\">Decide the edge direction, the meaning of the weight and the required output before choosing data structures.<\/p>\n<p>Assignment vertices are 0..n−1. The row <code>edges[i]<\/code> has original edge ID i. Sorting, queue insertion and transposition must not change it. A weighted edge stores <code>from<\/code>, <code>to<\/code>, <code>weight<\/code> and <code>id<\/code>.<\/p>\n<h2>Adjacency lists<\/h2><p>Store outgoing edges for each vertex. A directed edge contributes one entry. An undirected edge contributes entries u→v and v→u with the same original ID. These are two representations of one edge, not two selected forest edges. A self-loop cannot belong to a forest. Keep parallel edges as separate candidates.<\/p>\n<p>Adjacency lists use O(n+m) memory. An adjacency matrix uses O(n²), which is unsuitable for 100000 vertices. Traversal is O(n+m) when each stored edge is examined a bounded number of times.<\/p>\n<h2>Numeric types and comparisons<\/h2><p>A vertex index and a single permitted weight fit int; a total may not. Three edges of weight 1000000000 sum to 3000000000. Use long for Java totals and Long[] for nullable distances. Compare weights using Long.compare rather than subtraction. Our tie-break by ID makes examples reproducible; it is not an assignment requirement.<\/p>\n<p>The <code>edges(rows)<\/code> method creates edge objects with original IDs. Kruskal sorts a copy of the list, leaving original order available for route reconstruction. The <code>digraph<\/code> helper reads the first two columns and can therefore also check a weighted graph for cycles.<\/p>\n"}, "code": "static final class Edge implements Comparable<Edge> {\n        final int from, to, id;\n        final long weight;\n        Edge(int from, int to, long weight, int id) {\n            this.from = from; this.to = to; this.weight = weight; this.id = id;\n        }\n        public int compareTo(Edge other) {\n            int byWeight = Long.compare(weight, other.weight);\n            return byWeight != 0 ? byWeight : Integer.compare(id, other.id);\n        }\n    }\n\n    static List<Edge> edges(int[][] rows) {\n        List<Edge> result = new ArrayList<>();\n        for (int i = 0; i < rows.length; i++) {\n            result.add(new Edge(rows[i][0], rows[i][1], rows[i][2], i));\n        }\n        return result;\n    }\n\n    static List<List<Edge>> weightedGraph(int n, List<Edge> edges, boolean undirected) {\n        List<List<Edge>> graph = new ArrayList<>();\n        for (int v = 0; v < n; v++) graph.add(new ArrayList<>());\n        for (Edge e : edges) {\n            graph.get(e.from).add(e);\n            if (undirected) {\n                graph.get(e.to).add(new Edge(e.to, e.from, e.weight, e.id));\n            }\n        }\n        return graph;\n    }\n\n    static List<List<Integer>> digraph(int n, int[][] edges, boolean transpose) {\n        List<List<Integer>> graph = new ArrayList<>();\n        for (int v = 0; v < n; v++) graph.add(new ArrayList<>());\n        for (int[] e : edges) {\n            int from = transpose ? e[1] : e[0];\n            int to = transpose ? e[0] : e[1];\n            graph.get(from).add(to);\n        }\n        return graph;\n    }\n\n    static final class Forest {\n        long cost;\n        int components;\n        final List<Integer> edgeIds = new ArrayList<>();\n    }", "book": ["20.1", 549, 571, "40graphs"]}, {"id": "dsu", "RU": {"title": "DSU: связность при добавлении рёбер", "html": "\n<p class=\"lead\">DSU поддерживает разбиение вершин на непересекающиеся множества. find(v) возвращает представителя множества; union(a,b) объединяет два множества.<\/p>\n<p>В начале каждая вершина является своим корнем: parent[v]=v, size[v]=1. Количество компонент равно n; наибольшая имеет размер 1, а при n=0 - 0. Размер имеет смысл у корня. Вызов union сначала находит оба корня. Если они совпадают, ничего менять не нужно: это относится и к повторной связи, и к объединению вершины с собой.<\/p>\n<h2>Сжатие пути и объединение по размеру<\/h2><p>find сначала доходит до корня, затем повторно проходит тот же путь и перенаправляет посещённые вершины прямо к корню. Переменная next сохраняет старого родителя до изменения parent[v]. При объединении подвесьте меньший корень к большему, прибавьте размер меньшей компоненты и уменьшите счётчик ровно на один. Не считайте rank размером, если выберете объединение по рангу.<\/p>\n<div class=\"trace\" data-trace=\"dsu\"><\/div>\n<h2>Почему это корректно<\/h2><p>Инвариант: деревья parent задают текущее разбиение на компоненты; size[root] равен числу вершин компоненты. Сжатие меняет форму дерева, но не его корень и не состав множества. Объединение разных корней соединяет ровно две компоненты и не затрагивает остальные. Поэтому после каждой операции сохранённые components и largest описывают текущий граф.<\/p>\n<p><strong>Сложность:<\/strong> O(n+q α(n)) амортизированного времени со сжатием пути и балансировкой. Память DSU O(n), а вместе с массивом всех q ответов - O(n+q). Это не обещание константного времени для каждого отдельного find. Обычный DSU не поддерживает удаление произвольного ребра: для такой задачи нужна другая организация вычислений.<\/p>\n<p>В задании верните массив состояний после операций, без начального состояния. Сохраняйте два числа в каждой строке ответа, а не ссылку на один постоянно изменяемый массив.<\/p>\n"}, "EN": {"title": "DSU: connectivity as edges are added", "html": "\n<p class=\"lead\">DSU maintains a partition of vertices into disjoint sets. find(v) returns the representative of a set; union(a,b) merges two sets.<\/p>\n<p>Initially each vertex is its own root: parent[v]=v and size[v]=1. There are n components; largest is 1, or 0 when n=0. Component size is meaningful at a root. Union first finds both roots. If they coincide, nothing changes; this covers repeated links and self-unions.<\/p>\n<h2>Path compression and union by size<\/h2><p>Find walks to the root, then walks back through the same path and points each visited vertex directly at the root. The variable next saves the old parent before overwriting parent[v]. Union attaches the smaller root to the larger one, adds the smaller size and reduces the component count exactly once. If you use rank instead, maintain sizes separately.<\/p>\n<div class=\"trace\" data-trace=\"dsu\"><\/div>\n<h2>Correctness<\/h2><p>Invariant: parent trees represent the current components and size[root] counts their vertices. Compression changes the tree shape without changing its root or membership. Merging different roots joins exactly two components and leaves every other component unchanged. Thus components and largest describe the graph after each operation.<\/p>\n<p><strong>Complexity:<\/strong> O(n+q α(n)) amortised time with compression and balancing. DSU storage is O(n); including q returned states it is O(n+q). This does not claim constant worst-case time for every individual find. Ordinary DSU does not support arbitrary edge deletion.<\/p>\n<p>For the assignment, return a state after each operation, without an initial state. Store a new pair of numbers for each answer, rather than repeatedly storing a reference to one mutable array.<\/p>\n"}, "code": "static final class DSU {\n        final int[] parent, size;\n        int components, largest;\n\n        DSU(int n) {\n            parent = new int[n];\n            size = new int[n];\n            components = n;\n            largest = n == 0 ? 0 : 1;\n            for (int v = 0; v < n; v++) {\n                parent[v] = v;\n                size[v] = 1;\n            }\n        }\n\n        int find(int v) {\n            int root = v;\n            while (parent[root] != root) root = parent[root];\n            while (parent[v] != v) {\n                int next = parent[v];\n                parent[v] = root;\n                v = next;\n            }\n            return root;\n        }\n\n        boolean union(int a, int b) {\n            a = find(a);\n            b = find(b);\n            if (a == b) return false;\n            if (size[a] < size[b]) {\n                int temp = a; a = b; b = temp;\n            }\n            parent[b] = a;\n            size[a] += size[b];\n            largest = Math.max(largest, size[a]);\n            components--;\n            return true;\n        }\n    }\n\n    static int[][] connectivity(int n, int[][] operations) {\n        DSU dsu = new DSU(n);\n        int[][] states = new int[operations.length][2];\n        for (int i = 0; i < operations.length; i++) {\n            dsu.union(operations[i][0], operations[i][1]);\n            states[i][0] = dsu.components;\n            states[i][1] = dsu.largest;\n        }\n        return states;\n    }", "book": ["19.3–19.4", 527, 549, "15uf"]}, {"id": "mst", "RU": {"title": "Минимальный остовный лес: цель и корректность", "html": "\n<p class=\"lead\">Выберите рёбра минимальной суммарной стоимости так, чтобы внутри каждой компоненты исходного неориентированного графа все вершины были соединены без циклов.<\/p>\n<p>Для связного графа результат является деревом. Для несвязного - лесом, включая изолированные вершины. При c компонентах лес содержит n−c рёбер. Для n=0 стоимость и число компонент равны нулю. Отрицательный вес допустим: он означает снижение общей стоимости. Даже петлю с отрицательным весом нельзя включать в остов, поскольку она не соединяет разные вершины и образует цикл.<\/p>\n<h2>Свойство разреза<\/h2><p>Разрез делит вершины на две части. Если он не пересекает уже выбранные рёбра, одно из самых лёгких рёбер через этот разрез можно безопасно добавить к некоторому оптимальному остову, содержащему текущие выбранные рёбра. При равных весах безопасное ребро не обязано входить во все оптимальные остовы.<\/p>\n<p>Обоснование заменой: возьмите оптимальный остов без выбранного лёгкого ребра e. Добавление e создаёт цикл. В этом цикле есть другое ребро f через тот же разрез; его вес не меньше веса e. Замените f на e: связность сохранится, стоимость не вырастет. Для леса рассуждение применяется отдельно к каждой исходной компоненте.<\/p>\n<h2>Почему нужны два алгоритма<\/h2><p>Краскал выбирает рёбра глобально по весу и отсеивает циклы через DSU. Прим расширяет одно построенное дерево через минимальное ребро его границы. Они могут выбрать разные ID, но должны вернуть одинаковую оптимальную стоимость и одинаковое количество компонент.<\/p>\n<p>Не путайте стоимость сети со стоимостью пути. Остов может вынуждать длинный обход между двумя вершинами, хотя в исходном графе есть более короткая прямая связь. В задаче маршрутов нужен алгоритм кратчайшего пути.<\/p>\n"}, "EN": {"title": "Minimum spanning forests: objective and correctness", "html": "\n<p class=\"lead\">Select edges of minimum total cost so that every original connected component remains connected without cycles.<\/p>\n<p>A connected graph produces a tree; a disconnected graph produces a forest, including isolated vertices. With c components the forest has n−c edges. For n=0, both cost and component count are zero. Negative weights are valid discounts. Even a negative self-loop cannot be selected: it connects no distinct vertices and forms a cycle.<\/p>\n<h2>The cut property<\/h2><p>A cut partitions the vertices into two sets. If the cut respects the selected edges, a lightest edge crossing it is safe for some optimum containing those selected edges. When weights tie, a safe edge need not belong to every optimum.<\/p>\n<p>Exchange argument: take an optimum without the light edge e. Adding e creates a cycle. That cycle contains another edge f crossing the same cut, with weight at least that of e. Replace f by e; connectivity remains and cost does not increase. For a forest, apply the argument within each original connected component.<\/p>\n<h2>Why implement both methods?<\/h2><p>Kruskal examines globally sorted edges and uses DSU to reject cycles. Prim grows one tree using its cheapest boundary edge. Selected IDs may differ, but optimum costs and component counts must agree.<\/p>\n<p>Network cost is not path cost. A spanning tree may force a long detour between two vertices even when the original graph has a shorter direct connection. Routing requires a shortest-path objective.<\/p>\n"}, "code": "", "book": ["21.1", 586, 608, "43mst"]}, {"id": "kruskal", "RU": {"title": "Краскал: сортировка и безопасное объединение", "html": "\n<p class=\"lead\">Рассматривайте рёбра в неубывающем порядке веса. Принимайте ребро только тогда, когда его концы принадлежат разным деревьям текущего леса.<\/p>\n<p>Создайте отдельный DSU для этого вызова и пустой список выбранных ID. После сортировки исходные ID должны остаться у рёбер. Успешный union означает, что ребро соединяет разные компоненты и не создаёт цикл. При неуспешном union ребро пропускается. Не останавливайтесь после n−1 попыток: часть рёбер будет отвергнута, а исходный граф может быть несвязным.<\/p>\n<div class=\"trace\" data-trace=\"kruskal\"><\/div>\n<h2>Разбор примера<\/h2><p>В графе шесть вершин; вершина 5 изолирована. Петля ID 7 с весом −8 рассматривается первой, но отвергается. Далее принимаются ID 5, 1, 2, 4: стоимость −1+2+3+4=8. Оставшиеся рёбра соединяют уже связанные вершины. Ответ содержит четыре ребра и две компоненты: 6−2=4.<\/p>\n<h2>Инвариант и сложность<\/h2><p>Выбранные рёбра образуют лес, расширяемый до оптимального остовного леса. Перед добавлением ребра компонента DSU задаёт допустимый разрез, а рассматриваемое ребро имеет минимальный доступный вес через него. Свойство разреза сохраняет оптимальность. После обработки всех рёбер вершины каждой исходной компоненты соединены.<\/p>\n<p>Сортировка O(m log(m+1)), инициализация O(n), операции DSU амортизированно O(m α(n)). Итоговая граница задания O(n+m log(m+1)); память O(n+m). Возвращайте cost как long, edge_ids как исходные ID, components как число исходных компонент, совпадающее с конечным счётчиком DSU.<\/p>\n"}, "EN": {"title": "Kruskal: sorting and safe merging", "html": "\n<p class=\"lead\">Examine edges in nondecreasing weight order. Accept an edge only if its endpoints belong to different trees of the current forest.<\/p>\n<p>Create a fresh DSU and an empty selected-ID list. Sorting must preserve the IDs stored in edge objects. A successful union means the edge connects distinct components without creating a cycle. A failed union rejects the edge. Do not stop after n−1 examined candidates: some are rejected and the graph may be disconnected.<\/p>\n<div class=\"trace\" data-trace=\"kruskal\"><\/div>\n<h2>Worked example<\/h2><p>The graph has six vertices, with vertex 5 isolated. Self-loop ID 7 of weight −8 is examined first but rejected. IDs 5, 1, 2 and 4 are accepted, costing −1+2+3+4=8. The remaining edges join vertices already connected. The answer has four edges and two components: 6−2=4.<\/p>\n<h2>Invariant and complexity<\/h2><p>The selected forest can be extended to an optimum. Before an accepted edge is added, a DSU component defines a cut respected by the forest; the examined edge is a lightest available crossing edge. The cut property preserves optimality. After all edges have been examined, every original component is spanned.<\/p>\n<p>Sorting costs O(m log(m+1)), initialisation O(n), and DSU operations O(m α(n)) amortised. The assignment bound is O(n+m log(m+1)) time and O(n+m) memory. Return long cost, original edge_ids and components, which equals the final DSU count.<\/p>\n"}, "code": "static Forest kruskal(int n, List<Edge> input) {\n        List<Edge> sorted = new ArrayList<>(input);\n        Collections.sort(sorted);\n        DSU dsu = new DSU(n);\n        Forest result = new Forest();\n        for (Edge e : sorted) {\n            if (dsu.union(e.from, e.to)) {\n                result.cost += e.weight;\n                result.edgeIds.add(e.id);\n            }\n        }\n        result.components = dsu.components;\n        return result;\n    }", "book": ["21.2", 591, 613, "43mst"]}, {"id": "prim", "RU": {"title": "Прим: граница текущего дерева", "html": "\n<p class=\"lead\">Начните с одной вершины и каждый раз присоединяйте новую вершину через самое дешёвое ребро границы уже построенного дерева.<\/p>\n<p>Для каждой исходной компоненты нужен новый старт. Отметьте стартовую вершину, увеличьте components и добавьте её исходящие рёбра в очередь с приоритетом. Извлекая ребро, проверьте его конечную вершину: если она уже посещена, кандидат устарел. Иначе примите ребро, отметьте новую вершину и добавьте её исходящие рёбра к непосещённым вершинам.<\/p>\n<div class=\"trace\" data-trace=\"prim\"><\/div>\n<h2>Почему нужна проверка после извлечения<\/h2><p>Одну вершину могут предлагать несколько рёбер. После принятия лучшего остальные записи остаются в очереди. Удалять их заранее необязательно: достаточно пропускать записи с уже посещённым концом. Поэтому эта версия называется ленивой. Посещённость нужно проверять при извлечении, а не только при добавлении.<\/p>\n<p>В примере со старта 0 принимаются ID 1, 2, 4, 5. Промежуточные стоимости: 2, 5, 9, 8. Стоимость может уменьшиться из-за отрицательного веса; это не ошибка. После опустошения очереди внешний цикл находит изолированную вершину 5 и увеличивает число компонент, не добавляя ребра.<\/p>\n<h2>Корректность и сложность<\/h2><p>Инвариант: принятые рёбра образуют дерево посещённых вершин текущей компоненты и расширяемы до оптимума. После удаления устаревших записей минимальный кандидат является лёгким ребром разреза «посещённые / непосещённые» этой компоненты. Свойство разреза обосновывает выбор.<\/p>\n<p>Ленивая очередь может хранить O(m) записей, поэтому время O(n+m log(m+1)), память O(n+m). Граница O((n+m) log(n+1)) относится к варианту с индексируемой очередью и одной актуальной записью на вершину; для показанного кода используйте границу ленивой версии. Прим должен иметь свою реализацию, а не вызывать Краскала.<\/p>\n"}, "EN": {"title": "Prim: the boundary of the current tree", "html": "\n<p class=\"lead\">Start from one vertex and repeatedly attach an unvisited vertex through the cheapest edge leaving the current tree.<\/p>\n<p>Restart for every original connected component. Mark the start, increment components and add its outgoing edges to a priority queue. When removing an edge, inspect its destination: if already visited, the candidate is stale. Otherwise accept the edge, mark the new vertex and enqueue its edges to unvisited destinations.<\/p>\n<div class=\"trace\" data-trace=\"prim\"><\/div>\n<h2>Why check again on removal?<\/h2><p>Several edges may offer the same vertex. After its best candidate is accepted, other entries remain in the heap. You need not remove them immediately: skip entries whose destination is already visited. This is the lazy version. Checking only when inserting an edge is insufficient.<\/p>\n<p>Starting at 0 in the example selects IDs 1, 2, 4 and 5. Intermediate costs are 2, 5, 9 and 8. A negative weight can reduce the running cost. After the heap empties, the outer loop finds isolated vertex 5 and increments components without selecting an edge.<\/p>\n<h2>Correctness and complexity<\/h2><p>Invariant: accepted edges form a tree spanning the currently visited portion of this component and extend to an optimum. After stale entries are removed, the minimum candidate is a light edge of the visited/unvisited cut. The cut property justifies accepting it.<\/p>\n<p>A lazy heap may hold O(m) entries: time is O(n+m log(m+1)) and memory O(n+m). The O((n+m) log(n+1)) bound describes an indexed heap with one active entry per vertex. Use the lazy bound for this code. Prim must have a separate implementation rather than calling Kruskal.<\/p>\n"}, "code": "static Forest prim(int n, List<Edge> edges) {\n        List<List<Edge>> graph = weightedGraph(n, edges, true);\n        boolean[] used = new boolean[n];\n        PriorityQueue<Edge> heap = new PriorityQueue<>();\n        Forest result = new Forest();\n        for (int start = 0; start < n; start++) {\n            if (used[start]) continue;\n            result.components++;\n            used[start] = true;\n            heap.addAll(graph.get(start));\n            while (!heap.isEmpty()) {\n                Edge e = heap.remove();\n                if (used[e.to]) continue;\n                used[e.to] = true;\n                result.cost += e.weight;\n                result.edgeIds.add(e.id);\n                for (Edge next : graph.get(e.to)) {\n                    if (!used[next.to]) heap.add(next);\n                }\n            }\n        }\n        return result;\n    }", "book": ["21.2", 591, 613, "43mst"]}, {"id": "dfs", "RU": {"title": "DFS без переполнения стека", "html": "\n<p class=\"lead\">Для Косарайю и топологической сортировки важен момент завершения вершины. Стек должен сохранять незаконченный обход, а не только список найденных вершин.<\/p>\n<p>Рекурсивный DFS запоминает в стеке вызовов вершину и позицию следующего соседа. На цепочке из 100000 вершин это может переполнить стек. В явной реализации вершины находятся в ArrayDeque, а cursor[v] хранит номер следующего ещё не просмотренного соседа. У вершины три состояния: 0 - не посещена; 1 - активна и находится в текущем стеке; 2 - завершена.<\/p>\n<h2>Одна итерация<\/h2><ol><li>Посмотрите вершину на вершине стека, не удаляя её.<\/li><li>Если все соседи обработаны, удалите вершину, пометьте её завершённой и добавьте в finish.<\/li><li>Иначе получите следующего соседа и сразу увеличьте cursor.<\/li><li>Соседа в состоянии 0 активируйте и положите в стек. Ребро в состояние 1 отмечает цикл. Состояние 2 не требует повторного обхода.<\/li><\/ol>\n<p>Без cursor повторное начало списка соседей может увеличить время до квадратичного. Если помечать вершину завершённой сразу после добавления соседей в стек, активный путь будет потерян: такой код не имитирует нужный DFS.<\/p>\n<h2>Смысл finish<\/h2><p>На цепочке 0→1→2 сначала завершается 2, затем 1, затем 0. finish=[2,1,0]. Порядок обнаружения [0,1,2] и порядок завершения - разные последовательности. В Косарайю нужен именно второй. В топологической сортировке при отсутствии циклов нужен его разворот.<\/p>\n<p>Внешний цикл запускает обход из каждой ещё не посещённой вершины. Поэтому изоляты и компоненты, недостижимые из первой вершины, не теряются. Время O(n+m), память O(n+m) вместе со списками смежности; дополнительное состояние обхода O(n). Проверка циклов не мешает использовать finish в первом проходе Косарайю: исходный граф там вправе иметь циклы.<\/p>\n"}, "EN": {"title": "DFS without call-stack overflow", "html": "\n<p class=\"lead\">Kosaraju and topological ordering need finish events. An explicit stack must preserve suspended traversal progress, not merely discovered vertices.<\/p>\n<p>Recursive DFS remembers a vertex and the position of its next neighbour in the call stack. A chain of 100000 vertices may overflow that stack. Here ArrayDeque stores active vertices and cursor[v] stores the next adjacency-list position. States are 0 = unvisited, 1 = active on the current stack and 2 = finished.<\/p>\n<h2>One iteration<\/h2><ol><li>Inspect the stack top without removing it.<\/li><li>If all neighbours are processed, pop the vertex, mark it finished and append it to finish.<\/li><li>Otherwise read the next neighbour and advance cursor immediately.<\/li><li>Push a state-0 neighbour after activating it. An edge to state 1 marks a cycle. State 2 needs no further traversal.<\/li><\/ol>\n<p>Without cursor, restarting a neighbour scan can make the algorithm quadratic. Marking a vertex finished as soon as its neighbours are pushed loses the active path and does not simulate the required DFS.<\/p>\n<h2>What finish records<\/h2><p>On 0→1→2, vertex 2 finishes first, then 1, then 0: finish=[2,1,0]. Discovery order [0,1,2] is a different sequence. Kosaraju needs finish order; topological ordering reverses it when no cycle exists.<\/p>\n<p>The outer loop starts from every unvisited vertex, preserving isolates and components unreachable from the first start. Time is O(n+m); memory including adjacency lists is O(n+m), with O(n) additional traversal state. Recording a cycle does not prevent using finish in Kosaraju's first pass: its original graph may contain cycles.<\/p>\n"}, "code": "static final class Traversal {\n        boolean acyclic = true;\n        final List<Integer> finish = new ArrayList<>();\n    }\n\n    static Traversal dfs(List<List<Integer>> graph) {\n        int n = graph.size();\n        int[] state = new int[n]; // 0 = unvisited, 1 = active, 2 = finished\n        int[] cursor = new int[n];\n        ArrayDeque<Integer> stack = new ArrayDeque<>();\n        Traversal result = new Traversal();\n        for (int start = 0; start < n; start++) {\n            if (state[start] != 0) continue;\n            state[start] = 1;\n            stack.push(start);\n            while (!stack.isEmpty()) {\n                int v = stack.peek();\n                if (cursor[v] == graph.get(v).size()) {\n                    stack.pop();\n                    state[v] = 2;\n                    result.finish.add(v);\n                    continue;\n                }\n                int to = graph.get(v).get(cursor[v]++);\n                if (state[to] == 1) result.acyclic = false;\n                if (state[to] == 0) {\n                    state[to] = 1;\n                    stack.push(to);\n                }\n            }\n        }\n        return result;\n    }", "book": ["20.3", 563, 585, "42digraph"]}, {"id": "scc", "RU": {"title": "Косарайю: взаимная достижимость и конденсация", "html": "\n<p class=\"lead\">SCC - максимальное множество вершин, в котором из любой вершины можно попасть в любую другую по направленным путям.<\/p>\n<p>Обычная связность без учёта направления не подходит. Ребро A→B не доказывает возможность вернуться из B в A. Косарайю использует два полных прохода: сначала DFS исходного графа с записью завершений; затем обход транспонированного графа в порядке убывания времени завершения первого прохода. Можно поменять графы местами, но второй обязан быть транспонированным относительно первого.<\/p>\n<h2>Пример<\/h2><p>Рёбра: 0→1, 1→2, 2→0, 2→3, 1→3, 3→4, 4→3, 4→5, 5→5; вершина 6 изолирована. Компоненты: A={0,1,2}, B={3,4}, C={5}, D={6}. Конденсация: A→B, B→C. Два исходных ребра между A и B дают только одну пару. Петля внутри C в конденсацию не попадает.<\/p>\n<h2>Почему второй проход выделяет ровно одну SCC<\/h2><p>Сожмите SCC в вершины: получится DAG. Если в нём есть дуга A→B, максимальное время завершения в A больше максимального времени завершения в B. Во втором проходе по транспонированному графу компонента с наибольшим оставшимся завершением не имеет исходящего пути в другую ещё не отмеченную компоненту. Поэтому обход не выйдет из неё, но достигнет всех её вершин.<\/p>\n<h2>Конденсация в коде<\/h2><p>Метки в примере реализации компактные: 0..k−1. Сгруппируйте вершины по метке и просмотрите исходящие рёбра каждой группы. Массив seenFrom[target] запоминает, из какой исходной компоненты уже добавлена пара в target. Проверка target!=from исключает внутренние рёбра. Это удаляет дубликаты за детерминированное O(n+m) без сортировки пар. Альтернатива - хеш-множество пар с ожидаемым O(n+m).<\/p>\n<p>Оба обхода, транспонирование и конденсация занимают O(n+m) времени и памяти. Для n=0 оба массива ответа пусты. В задании метки могут быть любыми неотрицательными числами, если они задают правильное разбиение. Не сравнивайте label-массивы двух решений буквально. В анализе зависимостей SCC обнаруживает взаимозависимую группу; сжатие группы не устраняет её внутренний конфликт расписания.<\/p>\n"}, "EN": {"title": "Kosaraju: mutual reachability and condensation", "html": "\n<p class=\"lead\">An SCC is a maximal set in which every vertex can reach every other vertex using directed paths.<\/p>\n<p>Undirected connectivity is insufficient: A→B does not imply a return path. Kosaraju first runs DFS on the original graph and records finish events. It then traverses the transpose in decreasing first-pass finish order. Starting on the transpose is also valid if the second pass uses the original graph.<\/p>\n<h2>Example<\/h2><p>Edges are 0→1, 1→2, 2→0, 2→3, 1→3, 3→4, 4→3, 4→5 and 5→5; vertex 6 is isolated. SCCs are A={0,1,2}, B={3,4}, C={5} and D={6}. Condensation contains A→B and B→C. Two original A-to-B edges produce one pair. The internal loop in C produces none.<\/p>\n<h2>Why the second pass isolates one SCC<\/h2><p>Contract the SCCs into a DAG. For a condensation edge A→B, the largest finish time in A exceeds the largest finish time in B. In the transpose, the remaining component with largest finish time has no outgoing path into another unassigned component. The next traversal therefore stays inside it and reaches all of its vertices.<\/p>\n<h2>Building condensation<\/h2><p>Our implementation uses compact labels 0..k−1. Group vertices by label and scan outgoing edges for each group. The array seenFrom[target] records which source component has already emitted a pair to target. The condition target!=from excludes internal edges. This removes duplicates in deterministic O(n+m) time without sorting pairs. A hash set of pairs is an alternative with expected O(n+m) time.<\/p>\n<p>The traversals, transpose and condensation use O(n+m) time and memory. For n=0 both output arrays are empty. Assignment labels may be any nonnegative integers defining the correct partition; do not compare two label arrays literally. In dependency analysis, an SCC identifies a mutually dependent group; contracting it does not resolve its internal scheduling conflict.<\/p>\n"}, "code": "static final class Components {\n        int[] label;\n        final List<int[]> condensation = new ArrayList<>();\n    }\n\n    static Components kosaraju(int n, int[][] edges) {\n        List<List<Integer>> graph = digraph(n, edges, false);\n        List<List<Integer>> reverse = digraph(n, edges, true);\n        List<Integer> finish = dfs(graph).finish;\n        Components result = new Components();\n        result.label = new int[n];\n        Arrays.fill(result.label, -1);\n        ArrayDeque<Integer> stack = new ArrayDeque<>();\n        int count = 0;\n        for (int i = finish.size() - 1; i >= 0; i--) {\n            int start = finish.get(i);\n            if (result.label[start] != -1) continue;\n            result.label[start] = count;\n            stack.push(start);\n            while (!stack.isEmpty()) {\n                int v = stack.pop();\n                for (int to : reverse.get(v)) {\n                    if (result.label[to] == -1) {\n                        result.label[to] = count;\n                        stack.push(to);\n                    }\n                }\n            }\n            count++;\n        }\n        // Linear deduplication for compact labels: visit each target at most once per source SCC.\n        List<List<Integer>> members = new ArrayList<>();\n        for (int c = 0; c < count; c++) members.add(new ArrayList<>());\n        for (int v = 0; v < n; v++) members.get(result.label[v]).add(v);\n        int[] seenFrom = new int[count];\n        Arrays.fill(seenFrom, -1);\n        for (int from = 0; from < count; from++) {\n            for (int v : members.get(from)) {\n                for (int to : graph.get(v)) {\n                    int target = result.label[to];\n                    if (target != from && seenFrom[target] != from) {\n                        seenFrom[target] = from;\n                        result.condensation.add(new int[]{from, target});\n                    }\n                }\n            }\n        }\n        return result;\n    }", "book": ["20.5", 576, 598, "42digraph"]}, {"id": "topo", "RU": {"title": "Топологическая сортировка и направленные циклы", "html": "\n<p class=\"lead\">Для каждого ребра u→v вершина u должна стоять раньше v. Такой порядок существует тогда и только тогда, когда направленный граф ацикличен.<\/p>\n<p>Если DFS видит ребро v→u в активную вершину u, в текущем стеке уже есть путь u→…→v. Новое ребро замыкает направленный цикл. Напротив, ребро в завершённую вершину само по себе цикла не доказывает. Например, для рёбер 0→1, 0→2, 2→1 вершина 1 может быть завершена к моменту просмотра 2→1; граф остаётся DAG.<\/p>\n<h2>Разворот завершений<\/h2><p>При отсутствии циклов для каждого ребра u→v вершина v завершится раньше u: либо DFS обойдёт её из u, либо она уже была завершена. Поэтому в развёрнутом finish вершина u стоит раньше v. Добавляйте каждую вершину ровно один раз, включая изоляты.<\/p>\n<p>Для цепочки 0→1→2 finish=[2,1,0], ответ [0,1,2]. Для 0→1, 1→0 результат acyclic=false и order=[]. Петля тоже цикл. Для пустого графа верните acyclic=true и пустой order. Код использует общий явный DFS из предыдущего раздела.<\/p>\n<h2>Применение и границы модели<\/h2><p>В системе сборки u→v означает, что v зависит от u. Топологический порядок задаёт допустимую последовательность сборки. Он не определяет оптимальное расписание нескольких исполнителей и не учитывает длительности задач. Для этого потребуются дополнительные данные и алгоритмы.<\/p>\n<p>Время O(n+m), память O(n+m). Проверяйте все компоненты: цикл в отдельной части графа делает невозможным порядок всего графа. В задании требуется DFS с тремя состояниями. Алгоритм Кана полезен как независимая проверка в тестах, но не заменяет требуемую реализацию.<\/p>\n"}, "EN": {"title": "Topological ordering and directed cycles", "html": "\n<p class=\"lead\">For each edge u→v, u must precede v. Such an ordering exists exactly when the directed graph is acyclic.<\/p>\n<p>An edge v→u to an active vertex u closes a cycle because the current DFS stack already contains a path u→…→v. An edge to a finished vertex alone proves no cycle. In the graph 0→1, 0→2, 2→1, vertex 1 may already be finished when 2→1 is examined; the graph is still acyclic.<\/p>\n<h2>Reverse finish order<\/h2><p>Without cycles, every edge u→v has v finishing before u: DFS either explores v from u, or v has already finished. Reversing finish therefore places u before v. Include each vertex once, including isolates.<\/p>\n<p>For 0→1→2, finish=[2,1,0] and the order is [0,1,2]. For 0→1 and 1→0, return acyclic=false and order=[]. A self-loop is also a cycle. The empty graph returns acyclic=true and an empty order. The code uses the explicit DFS from the preceding section.<\/p>\n<h2>Applications and model limits<\/h2><p>In a build system, u→v means that v depends on u. A topological order is a valid build sequence. It does not optimise a schedule for several workers or account for task durations; those require additional data and algorithms.<\/p>\n<p>Time and memory are O(n+m). Check every component: a cycle in a separate part still prevents an order for the whole graph. The assignment requires three-state DFS. Kahn's algorithm is useful as an independent test oracle, but does not replace the required implementation.<\/p>\n"}, "code": "static final class Ordering {\n        boolean acyclic;\n        final List<Integer> order = new ArrayList<>();\n    }\n\n    static Ordering topological(int n, int[][] edges) {\n        Traversal traversal = dfs(digraph(n, edges, false));\n        Ordering result = new Ordering();\n        result.acyclic = traversal.acyclic;\n        if (result.acyclic) {\n            for (int i = traversal.finish.size() - 1; i >= 0; i--) {\n                result.order.add(traversal.finish.get(i));\n            }\n        }\n        return result;\n    }", "book": ["20.4", 573, 595, "42digraph"]}, {"id": "dag", "RU": {"title": "Кратчайшие пути в DAG", "html": "\n<p class=\"lead\">Найдите минимальную стоимость пути из source до каждой вершины. Обработка в топологическом порядке позволяет учесть и отрицательные веса.<\/p>\n<p>Сначала проверьте весь граф на циклы. В задании даже цикл, недостижимый из source, требует acyclic=false и пустых distance/parent_edge. Если граф ацикличен, задайте distance[source]=0; остальные расстояния - null, родители - −1. Просматривайте вершины в топологическом порядке и пропускайте недостижимые.<\/p>\n<h2>Релаксация<\/h2><p>Для ребра u→v веса w посчитайте candidate=distance[u]+w. Если v ещё недостижима или candidate меньше текущего расстояния, обновите distance[v] и parent_edge[v]. В parent_edge храните исходный ID ребра, не номер u. При равенстве можно оставить прежнее ребро: обе кратчайшие трассы допустимы.<\/p>\n<div class=\"trace\" data-trace=\"dag\"><\/div>\n<p>В примере 0→1 весит 5, 0→2 - 2, 1→3 - −4, 2→3 - 2, 3→4 - 3, 2→4 - 8. До 3 выгоднее идти через 1: 5−4=1, хотя расстояние до самой вершины 1 больше, чем до 2. Итог distance=[0,5,2,1,4,null]. Вершина 5 недостижима.<\/p>\n<h2>Почему одного прохода достаточно<\/h2><p>Перед обработкой v уже обработаны все возможные предшественники v в топологическом порядке. Следовательно, все пути из источника в v уже рассмотрены через последние рёбра. Минимальное значение distance[v] окончательно. Знак веса на это рассуждение не влияет, а отсутствие циклов не даёт вернуться к уже обработанному предшественнику.<\/p>\n<p>Время O(n+m), память O(n+m). Не используйте Дейкстру при разрешённых отрицательных весах. Число −1 может быть правильным расстоянием; недостижимость обозначается только null. Для конечных сумм используйте long; при данных ограничениях полный простой путь помещается в 64 бита. В приложениях с поэтапными состояниями такой проход является динамическим программированием по графу зависимостей.<\/p>\n"}, "EN": {"title": "Shortest paths in a DAG", "html": "\n<p class=\"lead\">Find a minimum-cost path from source to every vertex. Topological processing supports negative edge weights.<\/p>\n<p>Check the entire graph for cycles first. Even a cycle unreachable from source requires acyclic=false and empty distance/parent_edge arrays in this assignment. Otherwise set distance[source]=0; all other distances are null and parents are −1. Process vertices in topological order, skipping unreachable ones.<\/p>\n<h2>Relaxation<\/h2><p>For edge u→v of weight w, compute candidate=distance[u]+w. If v is unreachable or candidate is smaller, update distance[v] and parent_edge[v]. Store the original edge ID, not vertex u. On a tie you may retain the previous parent: both shortest witnesses are acceptable.<\/p>\n<div class=\"trace\" data-trace=\"dag\"><\/div>\n<p>The example has weights 0→1:5, 0→2:2, 1→3:−4, 2→3:2, 3→4:3 and 2→4:8. Vertex 3 is cheaper via 1, costing 5−4=1, even though reaching 1 costs more than reaching 2. Final distance=[0,5,2,1,4,null]. Vertex 5 is unreachable.<\/p>\n<h2>Why one pass is sufficient<\/h2><p>Before v is processed, all its possible predecessors have already been processed. Every source-to-v path has therefore been considered through its final edge. The minimum distance[v] is final. Weight signs do not affect this argument; acyclicity prevents returning to an already processed predecessor.<\/p>\n<p>Time and memory are O(n+m). Do not use Dijkstra when negative weights are permitted. −1 may be a valid distance; only null represents unreachable. Use long for finite sums; the published bounds keep a simple path's total within 64 bits. In applications with staged states, this is dynamic programming over a dependency graph.<\/p>\n"}, "code": "static final class Paths {\n        boolean acyclic;\n        Long[] distance;\n        int[] parentEdge;\n    }\n\n    static Paths shortestDAG(int n, int[][] rows, int source) {\n        Ordering topo = topological(n, rows);\n        Paths result = new Paths();\n        result.acyclic = topo.acyclic;\n        result.distance = new Long[topo.acyclic ? n : 0];\n        result.parentEdge = new int[topo.acyclic ? n : 0];\n        if (!topo.acyclic) return result;\n        Arrays.fill(result.parentEdge, -1);\n        result.distance[source] = 0L;\n        List<List<Edge>> graph = weightedGraph(n, edges(rows), false);\n        for (int v : topo.order) {\n            if (result.distance[v] == null) continue;\n            for (Edge e : graph.get(v)) {\n                long candidate = result.distance[v] + e.weight;\n                if (result.distance[e.to] == null || candidate < result.distance[e.to]) {\n                    result.distance[e.to] = candidate;\n                    result.parentEdge[e.to] = e.id;\n                }\n            }\n        }\n        return result;\n    }", "book": ["22.2", 616, 638, "44sp"]}, {"id": "route", "RU": {"title": "Восстановление и проверка маршрута", "html": "\n<p class=\"lead\">Расстояние отвечает на вопрос «сколько стоит путь». parent_edge позволяет восстановить, какие рёбра и вершины образуют этот путь.<\/p>\n<p>Идите от цели назад к источнику. Для текущей вершины v возьмите id=parent_edge[v]; исходное ребро edges[id] должно заканчиваться в v. Перейдите к его началу. Собранные вершины идут в обратном направлении - разверните список в конце.<\/p>\n<h2>Пример и договорённость функции<\/h2><p>Для цели 4 родитель - ребро ID 4 (3→4); у 3 родитель ID 2 (1→3); у 1 родитель ID 0 (0→1). Обратная последовательность [4,3,1,0] превращается в [0,1,3,4]. Стоимость 5−4+3=4 совпадает с distance[4]. Для источника результат [0]. Для недостижимой вершины 5 наша функция возвращает []. Выберите и опишите свою договорённость для недостижимой цели.<\/p>\n<p>Если добавить ребро 2→3 веса −1, появится другой оптимальный путь [0,2,3,4] с той же стоимостью 4. Проверяйте направление и сумму весов, а не совпадение с одним образцом пути. Параллельные рёбра между одинаковыми вершинами различаются ID; одного номера предшественника недостаточно.<\/p>\n<h2>Предусловия реализации<\/h2><p>Функция ниже получает корректный результат shortestDAG и тот же исходный массив рёбер. Поэтому цикл в родительской цепочке невозможен: каждый шаг назад уменьшает позицию в топологическом порядке. На произвольном чужом результате сначала валидируйте ID, направление и число шагов не более n; иначе некорректная цепочка может зациклить проверку. Для циклического графа функция отклоняет вызов.<\/p>\n<p>Время и память результата O(L), где L - число вершин маршрута. Не ищите ребро линейным просмотром всего списка на каждом шаге: доступ по ID должен быть O(1). Функция пути не является отдельной JSON-задачей. Вызовите её в собственных тестах и приведите результаты в ANALYSIS.md.<\/p>\n"}, "EN": {"title": "Reconstructing and checking a route", "html": "\n<p class=\"lead\">A distance gives the route's cost. parent_edge allows you to reconstruct its vertices and selected edges.<\/p>\n<p>Walk backwards from target to source. At vertex v, read id=parent_edge[v]; the original edge edges[id] must end at v. Move to that edge's origin. Reverse the collected vertices at the end.<\/p>\n<h2>Example and helper contract<\/h2><p>Target 4 uses edge ID 4 (3→4); vertex 3 uses ID 2 (1→3); vertex 1 uses ID 0 (0→1). Reverse [4,3,1,0] to obtain [0,1,3,4]. Its cost 5−4+3=4 equals distance[4]. The source route is [0]. Our helper returns [] for unreachable vertex 5; document your own no-route convention.<\/p>\n<p>Adding 2→3 with weight −1 creates another optimal route [0,2,3,4], also costing 4. Check edge direction and total weight rather than matching one route literally. Parallel edges between the same vertices have distinct IDs, so a predecessor vertex alone is insufficient.<\/p>\n<h2>Implementation preconditions<\/h2><p>The helper receives a valid shortestDAG result and the same original edge array. A parent cycle cannot occur: each backward step decreases topological position. When validating an arbitrary external result, check ID bounds, direction and at most n parent steps first; an invalid chain could otherwise loop forever. The helper rejects calls for a cyclic graph.<\/p>\n<p>Time and output memory are O(L) for L route vertices. Do not scan every edge at each step: original-ID lookup must be O(1). Route reconstruction is not a separate JSON task. Call it in your own tests and record the results in ANALYSIS.md.<\/p>\n"}, "code": "// Preconditions: an acyclic result from shortestDAG and the same original edge rows.\n    // Empty list means no route to target. An absent DAG is an invalid helper call.\n    static List<Integer> route(int[][] edges, Paths paths, int source, int target) {\n        if (!paths.acyclic) throw new IllegalArgumentException(\"Graph has a cycle\");\n        List<Integer> result = new ArrayList<>();\n        if (paths.distance[target] == null) return result;\n        int v = target;\n        while (v != source) {\n            result.add(v);\n            int id = paths.parentEdge[v];\n            v = edges[id][0];\n        }\n        result.add(source);\n        Collections.reverse(result);\n        return result;\n    }", "book": ["22.2", 616, 638, "44sp"]}, {"id": "assignment", "RU": {"title": "Как использовать код в задании", "html": "\n<p class=\"lead\">Отделите алгоритм от чтения запроса и оформления ответа. Тогда один алгоритм можно проверять отдельно, а адаптер останется коротким.<\/p>\n<p>В скачиваемом GraphLesson.java методы принимают обычные n, int[][] и списки рёбер, возвращая объекты Forest, Components, Ordering или Paths. Они не читают JSON и не содержат диспетчер задач. main демонстрирует вызовы на учебных данных. Это исполняемый пример организации вычислений; в сдаваемом решении сохраните интерфейс выбранного шаблона.<\/p>\n<h2>Актуальный шаблон graphs<\/h2><p>Откройте <a href=\"https://github.com/RZhaniya/daa-assignment-3-graphs\" target=\"_blank\" rel=\"noopener\">репозиторий задания<\/a>. В Java заполните <code>src/Java/Algorithms.java<\/code>. Готовый Input читает n, source и строки массивов. Пример ниже показывает границу между вычислением и ответом для Краскала. Если вы используете учебный класс как отдельный исходник, он должен находиться рядом с Algorithms.java, без package; демонстрационный main не вызывается адаптером. Другой вариант - перенести нужные структуры и методы в собственную реализацию, объяснив их работу.<\/p>\n<h2>Если вы начали с festival<\/h2><p>В старом шаблоне путь - <code>Java/source/Algorithms.java<\/code>, а Input.java нет. Прочитайте n через <code>((Number) input.get(\"n\")).intValue()<\/code>. JSON-массив - List&lt;?&gt;: пройдите по строкам и преобразуйте Number в int[][]; не приводите List напрямую к int[][]. Сверяйтесь с CONTRACTS.md своего шаблона. Пути файлов и порядок сдачи берите из README именно используемой копии.<\/p>\n<h2>Поля ответа<\/h2><table><tr><th>Метод<\/th><th>Возвращаемые поля<\/th><\/tr><tr><td>dsu<\/td><td>states<\/td><\/tr><tr><td>kruskal / prim<\/td><td>cost, edge_ids, components<\/td><\/tr><tr><td>scc<\/td><td>component, condensation<\/td><\/tr><tr><td>topo<\/td><td>acyclic, order<\/td><\/tr><tr><td>dag<\/td><td>acyclic, distance, parent_edge<\/td><\/tr><\/table>\n<p>Каждая строка входа - отдельный запрос. Не сохраняйте DSU, visited, очередь, метки SCC или расстояния между запросами. В stdout выводите только один объект результата на строку. Не вызывайте учебный main из методов Algorithms. JSON-адаптер, ping и сброс состояния процесса должны продолжать работать.<\/p>\n<p>Для Python используйте list/dict, heapq и целые числа Python; недостижимость - None. Для C++ используйте vector, priority_queue с правильным направлением сравнения и long long; null оформляет адаптер. Для C# используйте List, Stack, PriorityQueue, long и long? для nullable-расстояний. В каждом языке явный DFS должен хранить позицию следующего соседа. Точные средства ввода и вывода уже есть в шаблоне.<\/p>\n"}, "EN": {"title": "Connecting the code to the assignment", "html": "\n<p class=\"lead\">Separate the algorithm from request extraction and result formatting. The algorithm then becomes independently testable and the adapter stays short.<\/p>\n<p>The downloadable GraphLesson.java takes ordinary n, int[][] and edge lists, returning Forest, Components, Ordering or Paths objects. It does not parse JSON or dispatch tasks. Its main demonstrates calls on lesson data. Preserve your selected assignment template's interface when preparing a submission.<\/p>\n<h2>The current graphs template<\/h2><p>Open the <a href=\"https://github.com/RZhaniya/daa-assignment-3-graphs\" target=\"_blank\" rel=\"noopener\">assignment repository<\/a>. Complete <code>src/Java/Algorithms.java<\/code>. The supplied Input reads n, source and array rows. The example below demonstrates the boundary between Kruskal computation and output. If using the teaching class as an additional source, place it beside Algorithms.java without a package; its demonstration main is not called by the adapter. Alternatively, incorporate the required structures into your own implementation and explain them.<\/p>\n<h2>If you started from festival<\/h2><p>The older template uses <code>Java/source/Algorithms.java<\/code> and has no Input.java. Read n using <code>((Number) input.get(\"n\")).intValue()<\/code>. A parsed JSON array is a List&lt;?&gt;: iterate through its rows and convert Number values to int[][]; do not cast a List directly to int[][]. Follow that template's CONTRACTS.md. Use your own copy's README for paths and submission instructions.<\/p>\n<h2>Output fields<\/h2><table><tr><th>Method<\/th><th>Fields<\/th><\/tr><tr><td>dsu<\/td><td>states<\/td><\/tr><tr><td>kruskal / prim<\/td><td>cost, edge_ids, components<\/td><\/tr><tr><td>scc<\/td><td>component, condensation<\/td><\/tr><tr><td>topo<\/td><td>acyclic, order<\/td><\/tr><tr><td>dag<\/td><td>acyclic, distance, parent_edge<\/td><\/tr><\/table>\n<p>Each input line is an independent request. Do not retain a DSU, visited flags, a heap, SCC labels or distances between requests. Standard output must contain exactly one result object per line. Do not invoke the demonstration main from Algorithms methods. Preserve the JSON adapter and ping behaviour.<\/p>\n<p>In Python, use list/dict, heapq and Python integers, with None for unreachable. In C++, use vector, priority_queue with the appropriate comparison direction and long long; the adapter handles null. In C#, use List, Stack, PriorityQueue, long and long? for nullable distances. In every language, iterative DFS must preserve the next-neighbour position. The template already supplies input/output support.<\/p>\n"}, "code": "static Map<String, Object> kruskal(Map<String, Object> input) {\n    int n = Input.vertexCount(input);\n    int[][] rows = Input.edges(input);\n    GraphLesson.Forest forest = GraphLesson.kruskal(n, GraphLesson.edges(rows));\n    Map<String, Object> result = new java.util.LinkedHashMap<>();\n    result.put(\"cost\", forest.cost);\n    result.put(\"edge_ids\", forest.edgeIds);\n    result.put(\"components\", forest.components);\n    return result;\n}", "book": null}, {"id": "tests", "RU": {"title": "Тесты: результат, свидетельство, масштаб", "html": "\n<p class=\"lead\">Успешный запуск не доказывает правильность алгоритма. Проверяйте численный результат, допустимость возвращённых объектов и поведение на границах.<\/p>\n<h2>Проверки по задачам<\/h2><ul><li><strong>DSU:<\/strong> для малого графа пересчитайте компоненты обходом после каждого добавления. Сравните число компонент и максимальный размер.<\/li><li><strong>MST:<\/strong> проверьте уникальность и границы ID, отсутствие петель и циклов, n−c рёбер, связность каждой исходной компоненты и сумму весов. Для малого m переберите все подмножества и найдите истинный минимум. Одного совпадения Краскала и Прима недостаточно: ошибки могут быть общими.<\/li><li><strong>SCC:<\/strong> на малом графе вычислите достижимость между всеми парами. Метки совпадают тогда и только тогда, когда достижимость взаимная. Затем независимо постройте множество межкомпонентных пар.<\/li><li><strong>Topo:<\/strong> проверьте перестановку вершин и position[u]&lt;position[v] для всех рёбер. Наличие цикла можно независимо проверить алгоритмом Кана.<\/li><li><strong>DAG:<\/strong> сравните расстояния с независимой релаксацией на малых графах. Проверьте все родительские пути, направление и стоимость. Отдельно добавьте цикл, недостижимый из source.<\/li><\/ul>\n<h2>Граничные случаи<\/h2><p>Пустые графы там, где разрешены; одна вершина; изоляты; несвязность; повторные объединения; петли; дубликаты и параллельные рёбра; равные оптимумы; отрицательные веса; суммы за пределами int. Для DAG используйте source, отличный от 0, и недостижимые вершины. Для DFS - цепочку из 100000 вершин. Для сброса состояния - смешанные запросы в одном процессе.<\/p>\n<h2>Команды<\/h2><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Установите Python и среду выбранного языка. Создайте my_cases.jsonl сами. Последняя команда только печатает фактические ответы: она не сравнивает их с ожидаемыми. Public checks проверяет опубликованные случаи, но не заменяет полные ограничения. Сохраните входы, ожидаемые и фактические ответы и команды в tests/.<\/p>\n<p>Пример допустимой альтернативы: перестановка меток SCC при том же разбиении. Пример неверного свидетельства: правильная сумма стоимости леса, но среди edge_ids есть петля. Ваша проверка должна принять первое и отклонить второе. Для учебного Java-файла приложена отдельная программа GraphLessonChecks.java с проверкой через независимые оракулы.<\/p>\n"}, "EN": {"title": "Testing results, witnesses and scale", "html": "\n<p class=\"lead\">A successful launch does not prove algorithm correctness. Check numerical results, returned witnesses and boundary behaviour.<\/p>\n<h2>Checks by task<\/h2><ul><li><strong>DSU:<\/strong> on small graphs, recompute components by traversal after each insertion and compare counts and largest sizes.<\/li><li><strong>MST:<\/strong> check unique valid IDs, no loops or cycles, n−c selected edges, original-component connectivity and the weight sum. For small m, enumerate subsets to obtain the actual optimum. Agreement between Kruskal and Prim alone is insufficient: they may share a defect.<\/li><li><strong>SCC:<\/strong> compute all-pairs reachability on small graphs. Labels coincide exactly when reachability is mutual. Independently construct the set of cross-component pairs.<\/li><li><strong>Topo:<\/strong> check a vertex permutation and position[u]&lt;position[v] for every edge. Kahn's algorithm independently checks cycle existence.<\/li><li><strong>DAG:<\/strong> compare distances with independent relaxation on small graphs. Check every parent route, its direction and cost. Add a cycle unreachable from source.<\/li><\/ul>\n<h2>Boundary cases<\/h2><p>Include empty graphs where allowed, one vertex, isolates, disconnected graphs, repeated unions, loops, duplicates, parallel edges, ties, negative weights and totals beyond int. Use a nonzero source and unreachable vertices. Test a 100000-vertex DFS chain and mixed requests in one process to check state reset.<\/p>\n<h2>Commands<\/h2><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Install Python and the chosen language runtime. Create my_cases.jsonl yourself. The final command prints actual answers without comparing expected results. Public checks cover published cases, not all limits. Preserve inputs, justified expected answers, actual outputs and commands under tests/.<\/p>\n<p>An acceptable alternative is an SCC-label permutation preserving membership. An invalid witness is a forest with the claimed correct cost but a selected self-loop. Your checker should accept the former and reject the latter. The teaching Java file includes a separate GraphLessonChecks.java program using independent test oracles.<\/p>\n"}, "code": "", "book": null}, {"id": "analysis", "RU": {"title": "Корректность, сложность и измерения", "html": "\n<p class=\"lead\">В ANALYSIS.md объясните, почему решение правильно и какие ресурсы оно требует. Измерения времени отвечают на другой вопрос: как ведёт себя ваша реализация на выбранных данных.<\/p>\n<h2>Структура объяснения<\/h2><p>Для каждого метода запишите цель, структуры данных, инвариант, инициализацию, сохранение инварианта и вывод при завершении. Затем разберите границы и время/память, включая возвращаемый результат. Сошлитесь на конкретные строки или функции своего кода. Для DFS объясните cursor и отсутствие зависимости от глубины стека вызовов; для DAG - проверку всех компонент и запрет релаксации из null.<\/p>\n<table><tr><th>Метод<\/th><th>Время<\/th><th>Память с результатом<\/th><\/tr><tr><td>DSU<\/td><td>O(n+q α(n)), амортизированно<\/td><td>O(n+q)<\/td><\/tr><tr><td>Краскал<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Прим, ленивый<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Косарайю<\/td><td>O(n+m); для хеш-дедупликации - ожидаемо<\/td><td>O(n+m)<\/td><\/tr><tr><td>Topo / DAG<\/td><td>O(n+m)<\/td><td>O(n+m)<\/td><\/tr><tr><td>Восстановление пути<\/td><td>O(L)<\/td><td>O(L), результат<\/td><\/tr><\/table>\n<h2>Сравнение Краскала и Прима<\/h2><p>Возьмите три размера графа. Для каждого используйте одни и те же рёбра, веса и среду для обоих методов; сначала подтвердите оптимальные стоимости и допустимость лесов. Проведите минимум три замера каждого метода и вычислите медиану. Укажите n, m, генератор/seed либо сохранённые входы, команды, версию среды, оборудование, таймер и прогрев.<\/p>\n<p>Исключите компиляцию. Заранее определите границы: например, от готового int[][] до готового результата, включая создание списков и очереди. Если включаете разбор JSON или вывод, включайте одинаково у обоих методов и сообщите об этом. Не сравнивайте прогретый метод с единственным первым запуском другого. В Java пригоден System.nanoTime; в Python - time.perf_counter.<\/p>\n<p>Одна серия на трёх размерах не доказывает асимптотику. На результат влияют плотность графа, порядок рёбер, структура компонент, выделение памяти и прогрев JVM. Отделите наблюдения от доказанной оценки сложности. Приводите только реальные измерения. Отчёт напишите на английском, укажите источники, помощь инструментов и собственную проверку по силлабусу.<\/p>\n"}, "EN": {"title": "Correctness, complexity and measurements", "html": "\n<p class=\"lead\">ANALYSIS.md explains why the solution is correct and what resources it requires. Timings answer a separate question: how your implementation behaves on selected inputs.<\/p>\n<h2>Structure of the argument<\/h2><p>For each method, state the objective, data structures, invariant, initialisation, preservation and termination argument. Then discuss boundaries and time/memory, including returned output. Refer to your own functions or lines. For DFS, explain cursor and independence from call-stack depth; for DAG, explain whole-graph cycle detection and skipping null distances.<\/p>\n<table><tr><th>Method<\/th><th>Time<\/th><th>Memory including output<\/th><\/tr><tr><td>DSU<\/td><td>O(n+q α(n)), amortised<\/td><td>O(n+q)<\/td><\/tr><tr><td>Kruskal<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Lazy Prim<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Kosaraju<\/td><td>O(n+m); expected with hash deduplication<\/td><td>O(n+m)<\/td><\/tr><tr><td>Topo / DAG<\/td><td>O(n+m)<\/td><td>O(n+m)<\/td><\/tr><tr><td>Route reconstruction<\/td><td>O(L)<\/td><td>O(L) output<\/td><\/tr><\/table>\n<h2>Kruskal–Prim benchmark<\/h2><p>Use three graph sizes. For each size, supply identical edges, weights and environment to both algorithms. Verify optimum costs and forest feasibility before measuring. Record at least three timings per method and their median. State n, m, the generator/seed or saved inputs, commands, runtime version, hardware, timer and warm-up.<\/p>\n<p>Exclude compilation. Define a timing boundary beforehand: for example, from a ready int[][] to the returned result, including adjacency-list and heap construction. If JSON parsing or output is included, include it equally and say so. Do not compare a warmed method against only the first invocation of the other. System.nanoTime is suitable in Java; time.perf_counter in Python.<\/p>\n<p>One experiment at three sizes does not prove asymptotic complexity. Density, edge order, component structure, allocation and JVM warm-up affect timings. Separate observations from the proven complexity bound. Report actual measurements only. Write the analysis in English and acknowledge sources, tool assistance and your verification according to the syllabus.<\/p>\n"}, "code": "", "book": null}, {"id": "reading", "RU": {"title": "Учебники и переходы к страницам", "html": "\n<p class=\"lead\">Используйте учебник для формального определения, доказательства и анализа. Номера ниже относятся к Introduction to Algorithms, 4th edition (CLRS).<\/p>\n<p>Откройте свою PDF-копию через кнопку ниже. Файл обрабатывается в браузере и не отправляется на сервер. В предоставленной копии печатная страница p находится на PDF-странице p+22. Для другой копии измените смещение. Ссылки рядом с каждым разделом откроют соответствующую страницу в отдельной вкладке; поддержка #page зависит от PDF-просмотрщика.<\/p>\n<div class=\"bookPicker\"><\/div>\n<table><tr><th>Тема<\/th><th>Раздел CLRS 4e<\/th><th>Печатная страница<\/th><\/tr><tr><td>Представление графа<\/td><td>20.1<\/td><td>549<\/td><\/tr><tr><td>DSU<\/td><td>19.3–19.4<\/td><td>527, 531<\/td><\/tr><tr><td>DFS<\/td><td>20.3<\/td><td>563<\/td><\/tr><tr><td>Топологическая сортировка<\/td><td>20.4<\/td><td>573<\/td><\/tr><tr><td>SCC<\/td><td>20.5<\/td><td>576<\/td><\/tr><tr><td>Свойство разреза<\/td><td>21.1<\/td><td>586<\/td><\/tr><tr><td>Краскал и Прим<\/td><td>21.2<\/td><td>591<\/td><\/tr><tr><td>Кратчайшие пути в DAG<\/td><td>22.2<\/td><td>616<\/td><\/tr><\/table>\n<p>В книге Algorithms, 4th edition (Sedgewick &amp; Wayne) используйте §1.5 Union–Find, §4.2 Directed Graphs, §4.3 Minimum Spanning Trees и §4.4 Shortest Paths. Официальные онлайн-разделы содержат объяснения и Java-реализации. Они используют собственные классы Digraph, EdgeWeightedGraph и другие; перед использованием разберите их API. Учебный файл на этом сайте обходится без внешней библиотеки.<\/p>\n<ul><li><a href=\"https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/\" target=\"_blank\" rel=\"noopener\">CLRS 4e: страница издательства<\/a> · <a href=\"https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/11599/4e_toc.pdf\" target=\"_blank\" rel=\"noopener\">Официальное оглавление PDF<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/15uf/\" target=\"_blank\" rel=\"noopener\">Sedgewick &amp; Wayne: Union–Find<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/42digraph/\" target=\"_blank\" rel=\"noopener\">Directed Graphs: DFS, topo, SCC<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/43mst/\" target=\"_blank\" rel=\"noopener\">Minimum Spanning Trees<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/44sp/\" target=\"_blank\" rel=\"noopener\">Shortest Paths<\/a><\/li><\/ul>\n<p>Графы и таблицы этого урока построены для учебных примеров. Сопоставляйте их с определениями учебника; интерфейсы и граничные случаи сдаваемой программы определяет условие задания.<\/p>\n"}, "EN": {"title": "Textbooks and page navigation", "html": "\n<p class=\"lead\">Use the textbook for definitions, proofs and analysis. The references below are for Introduction to Algorithms, fourth edition (CLRS).<\/p>\n<p>Open your own PDF using the control below. The file remains in your browser and is not sent to a server. In the supplied copy, printed page p is PDF page p+22. Change the offset for another copy. Each chapter's reading link opens the corresponding page in a new tab; #page support depends on your PDF viewer.<\/p>\n<div class=\"bookPicker\"><\/div>\n<table><tr><th>Topic<\/th><th>CLRS 4e section<\/th><th>Printed page<\/th><\/tr><tr><td>Graph representation<\/td><td>20.1<\/td><td>549<\/td><\/tr><tr><td>DSU<\/td><td>19.3–19.4<\/td><td>527, 531<\/td><\/tr><tr><td>DFS<\/td><td>20.3<\/td><td>563<\/td><\/tr><tr><td>Topological ordering<\/td><td>20.4<\/td><td>573<\/td><\/tr><tr><td>SCC<\/td><td>20.5<\/td><td>576<\/td><\/tr><tr><td>Cut property<\/td><td>21.1<\/td><td>586<\/td><\/tr><tr><td>Kruskal and Prim<\/td><td>21.2<\/td><td>591<\/td><\/tr><tr><td>DAG shortest paths<\/td><td>22.2<\/td><td>616<\/td><\/tr><\/table>\n<p>In Algorithms, fourth edition by Sedgewick &amp; Wayne, use §1.5 Union–Find, §4.2 Directed Graphs, §4.3 Minimum Spanning Trees and §4.4 Shortest Paths. The official booksite includes explanations and Java implementations. Those examples use their own Digraph, EdgeWeightedGraph and related APIs; examine these before adapting code. This lesson's Java file needs no external library.<\/p>\n<ul><li><a href=\"https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/\" target=\"_blank\" rel=\"noopener\">CLRS 4e publisher page<\/a> · <a href=\"https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/11599/4e_toc.pdf\" target=\"_blank\" rel=\"noopener\">Official contents PDF<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/15uf/\" target=\"_blank\" rel=\"noopener\">Sedgewick &amp; Wayne: Union–Find<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/42digraph/\" target=\"_blank\" rel=\"noopener\">Directed Graphs: DFS, topo, SCC<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/43mst/\" target=\"_blank\" rel=\"noopener\">Minimum Spanning Trees<\/a><\/li><li><a href=\"https://algs4.cs.princeton.edu/44sp/\" target=\"_blank\" rel=\"noopener\">Shortest Paths<\/a><\/li><\/ul>\n<p>The lesson's diagrams and tables are original worked examples. Compare them against the textbook definitions; the assignment specification determines submission interfaces and boundary cases.<\/p>\n"}, "code": "", "book": null}, {"id": "video", "RU": {"title": "Видеоурок и исполняемый пример", "html": "\n<p class=\"lead\">Видеоурок на английском: 28 минут с разбором шести алгоритмов, Java-фрагментами, проверкой корректности и тестированием.<\/p>\n<div class=\"lessonVideo\"><\/div>\n<p>Останавливайте видео перед изменением состояния и проверяйте следующий шаг самостоятельно. В видео используются свои примеры и исходные ID рёбер. Текстовый урок выше содержит полные реализации и пояснение интеграции с текущим шаблоном. Правила сдачи смотрите в актуальном README своей копии.<\/p>\n<h2>Запуск Java-примера<\/h2><p>Скачайте оба исходника в одну папку. Выполните команды из этой папки; нужен JDK 17 или новее.<\/p><pre>javac --release 17 -encoding UTF-8 GraphLesson.java GraphLessonChecks.java\njava GraphLesson\njava GraphLessonChecks<\/pre>\n<p><a href=\"code/GraphLesson.java\" download>Скачать GraphLesson.java<\/a> · <a href=\"code/GraphLessonChecks.java\" download>Скачать проверки<\/a><\/p>\n<p>main печатает результаты примеров; GraphLessonChecks независимо проверяет малые графы, граничные случаи и глубокую цепочку. Точные команды и ожидаемый вывод приведены ниже. Это проверка учебного кода; для вашего решения отдельно запустите инструменты своего репозитория.<\/p>\n<pre>Kruskal: cost=8, edges=[5, 1, 2, 4], components=2\nPrim: cost=8, edges=[1, 2, 4, 5], components=2\nDistances: [0, 5, 2, 1, 4, null]\nParent edges: [-1, 0, 1, 2, 4, -1]\nRoute to 4: [0, 1, 3, 4]\nRoute to source: [0]\nRoute to 5: []<\/pre>\n"}, "EN": {"title": "Video lesson and runnable example", "html": "\n<p class=\"lead\">The 28-minute English video covers the six algorithms, Java fragments, correctness and testing.<\/p>\n<div class=\"lessonVideo\"><\/div>\n<p>Pause before a state change and predict the next step. The video uses its own examples and original edge IDs. This written lesson supplies complete implementations and integration with the current template. Follow your own repository's current README for submission rules.<\/p>\n<h2>Run the Java example<\/h2><p>Download both source files into one directory. Run these commands there using JDK 17 or newer.<\/p><pre>javac --release 17 -encoding UTF-8 GraphLesson.java GraphLessonChecks.java\njava GraphLesson\njava GraphLessonChecks<\/pre>\n<p><a href=\"code/GraphLesson.java\" download>Download GraphLesson.java<\/a> · <a href=\"code/GraphLessonChecks.java\" download>Download checks<\/a><\/p>\n<p>The demonstration main prints the example results. GraphLessonChecks independently checks small graphs, boundaries and a deep chain. Commands and expected demonstration output follow. These checks validate the teaching code; run your assignment repository's tools separately.<\/p>\n<pre>Kruskal: cost=8, edges=[5, 1, 2, 4], components=2\nPrim: cost=8, edges=[1, 2, 4, 5], components=2\nDistances: [0, 5, 2, 1, 4, null]\nParent edges: [-1, 0, 1, 2, 4, -1]\nRoute to 4: [0, 1, 3, 4]\nRoute to source: [0]\nRoute to 5: []<\/pre>\n"}, "code": "public static void main(String[] args) {\n        int[][] cables = {{0,1,6},{0,2,2},{1,2,3},{1,3,5},{2,3,4},{3,4,-1},{0,1,6},{2,2,-8}};\n        Forest a = kruskal(6, edges(cables));\n        Forest b = prim(6, edges(cables));\n        System.out.println(\"Kruskal: cost=\" + a.cost + \", edges=\" + a.edgeIds + \", components=\" + a.components);\n        System.out.println(\"Prim: cost=\" + b.cost + \", edges=\" + b.edgeIds + \", components=\" + b.components);\n        int[][] roads = {{0,1,5},{0,2,2},{1,3,-4},{2,3,2},{3,4,3},{2,4,8}};\n        Paths paths = shortestDAG(6, roads, 0);\n        System.out.println(\"Distances: \" + Arrays.toString(paths.distance));\n        System.out.println(\"Parent edges: \" + Arrays.toString(paths.parentEdge));\n        System.out.println(\"Route to 4: \" + route(roads, paths, 0, 4));\n        System.out.println(\"Route to source: \" + route(roads, paths, 0, 0));\n        System.out.println(\"Route to 5: \" + route(roads, paths, 0, 5));\n    }", "book": null}]</script>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function locationState(){const h=new URLSearchParams(location.hash.slice(1));language=h.get('lang')==='EN'?'EN':'RU';current=chapters.some(c=>c.id===h.get('topic'))?h.get('topic'):'overview';}
function go(id,lang=language){location.hash=new URLSearchParams({topic:id,lang}).toString();}

 const q=$('search').value.trim().toLowerCase();$('contents').replaceChildren();let count=0;
 for(const c of chapters){const search=(c.RU.title+' '+c.EN.title+' '+c.RU.html+' '+c.EN.html+' '+c.code).replace(/<[^>]+>/g,' ').toLowerCase();if(q&&!search.includes(q))continue;const a=document.createElement('a');a.href='#'+new URLSearchParams({topic:c.id,lang:language});a.textContent=c[language].title;if(c.id===current)a.setAttribute('aria-current','page');$('contents').append(a);count++;}
 $('empty').textContent=count?'':text('Ничего не найдено. Измените запрос.','No matching topic. Change the search.');
