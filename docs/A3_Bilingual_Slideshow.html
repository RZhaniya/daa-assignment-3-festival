ельно.", "Оформите только требуемые поля ответа и запустите смешанные запросы."], "transfer": "Откройте src/Java/Algorithms.java в шаблоне graphs. Input.java уже переводит вход в числа и массивы; это вспомогательный класс шаблона, а не часть стандартной Java. Ниже — каркас метода для задачи с рёбрами. Для DSU используйте Input.operations(input), для DAG дополнительно Input.source(input).", "theory": "<h3>Поля результата<\/h3><p>dsu: states. kruskal/prim: cost, edge_ids, components. scc: component, condensation. topo: acyclic, order. dag: acyclic, distance, parent_edge.<\/p><p>Состояние принадлежит одному запросу: не сохраняйте visited, DSU, очереди и расстояния между строками. В stdout должен быть только JSON-ответ. Сохраняйте свои тестовые материалы в tests/. Для старой копии festival пути отличаются: Java/source/Algorithms.java и tests/student/. Проверьте README своей копии.<\/p><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Последняя команда показывает фактический ответ, но сама не сравнивает его с ожидаемым.<\/p>", "code_context": "Вставляйте каркас в соответствующий метод Algorithms.java, где input уже является параметром. Input предоставлен шаблоном graphs; Map импортирован в Algorithms.java. Заполните поля result согласно условию выбранной задачи."}, "EN": {"title": "From the example to your assignment", "story": "Now turn the diagram into your program. The template already parses JSON into numbers and arrays. Your work is the data structures, algorithm, verification and explanation. Start with one method and one small test.", "steps": ["Read the inputs and preserve original edge IDs.", "Implement and test your algorithm separately.", "Return the required fields and test mixed requests."], "transfer": "Open src/Java/Algorithms.java in the graphs template. Its supplied Input.java converts input into numbers and arrays; Input is a template helper, not a standard Java class. The scaffold below is for an edge-based task. DSU uses Input.operations(input); DAG additionally uses Input.source(input).", "theory": "<h3>Result fields<\/h3><p>dsu: states. kruskal/prim: cost, edge_ids, components. scc: component, condensation. topo: acyclic, order. dag: acyclic, distance, parent_edge.<\/p><p>State belongs to one request: do not retain visited flags, a DSU, queues or distances between lines. Standard output contains JSON results only. Keep test materials under tests/. An older festival copy uses Java/source/Algorithms.java and tests/student/ instead. Check your copy’s README.<\/p><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>The last command prints actual output but does not compare it against expected results.<\/p>", "code_context": "Use this scaffold inside the corresponding Algorithms.java method, where input is already a parameter. Input is supplied by the graphs template; Algorithms.java imports Map. Populate result according to the selected task contract."}, "lab": null, "quiz": null, "code": "int n = Input.vertexCount(input);\nint[][] edges = Input.edges(input);\n\n// TODO: your data structures, algorithm and result validation.\n\nMap<String, Object> result = new java.util.LinkedHashMap<>();\n// TODO: add exactly the output fields required for this task.\nreturn result;", "book": null, "videos": []}, {"id": "tests", "RU": {"title": "Как убедиться, что решение работает?", "story": "Один удачный пример легко скрывает ошибку. Представьте, что решение принимает красивый, но неправильный маршрут: расстояние верное, а выбранное ребро ведёт не в ту вершину. Проверьте не только число, но и то, чем оно подтверждается.", "steps": ["Сначала проверьте небольшой пример с объяснимым ответом.", "Затем добавьте границы: петлю, изолят, повтор, равные веса и недостижимость.", "После этого проверьте большие входы, глубокую цепочку и повторные запросы."], "transfer": "Для неоднозначного ответа важна допустимость, а не буквальное совпадение. Сохраните вход, ожидаемый смысл ответа, фактический вывод и команду. Публичные тесты помогают находить ошибки, но не доказывают выполнение всех требований.", "theory": "\n<p class=\"lead\">Успешный запуск не доказывает правильность алгоритма. Проверяйте численный результат, допустимость возвращённых объектов и поведение на границах.<\/p>\n<h2>Проверки по задачам<\/h2><ul><li><strong>DSU:<\/strong> для малого графа пересчитайте компоненты обходом после каждого добавления. Сравните число компонент и максимальный размер.<\/li><li><strong>MST:<\/strong> проверьте уникальность и границы ID, отсутствие петель и циклов, n−c рёбер, связность каждой исходной компоненты и сумму весов. Для малого m переберите все подмножества и найдите истинный минимум. Одного совпадения Краскала и Прима недостаточно: ошибки могут быть общими.<\/li><li><strong>SCC:<\/strong> на малом графе вычислите достижимость между всеми парами. Метки совпадают тогда и только тогда, когда достижимость взаимная. Затем независимо постройте множество межкомпонентных пар.<\/li><li><strong>Topo:<\/strong> проверьте перестановку вершин и position[u]&lt;position[v] для всех рёбер. Наличие цикла можно независимо проверить алгоритмом Кана.<\/li><li><strong>DAG:<\/strong> сравните расстояния с независимой релаксацией на малых графах. Проверьте все родительские пути, направление и стоимость. Отдельно добавьте цикл, недостижимый из source.<\/li><\/ul>\n<h2>Граничные случаи<\/h2><p>Пустые графы там, где разрешены; одна вершина; изолированные вершины; несвязность; повторные объединения; петли; дубликаты и параллельные рёбра; равные оптимумы; отрицательные веса; суммы за пределами int. Для DAG используйте source, отличный от 0, и недостижимые вершины. Для DFS - цепочку из 100000 вершин. Для сброса состояния - смешанные запросы в одном процессе.<\/p>\n<h2>Команды<\/h2><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Установите Python и среду выбранного языка. Создайте my_cases.jsonl сами. Последняя команда только печатает фактические ответы: она не сравнивает их с ожидаемыми. Публичные тесты охватывают лишь часть допустимых входов. Сохраните входы, ожидаемые и фактические ответы и команды в tests/.<\/p>\n\n"}, "EN": {"title": "How do you know the solution works?", "story": "One successful example can hide a bug. Imagine a correct distance paired with an edge that points to the wrong vertex. Check both the value and the witness supporting it.", "steps": ["Start with a small example whose answer you can justify.", "Add boundaries: loops, isolates, repeats, ties and unreachable vertices.", "Then test large inputs, deep chains and repeated requests."], "transfer": "Non-unique outputs need validity checks rather than literal matching. Preserve inputs, justified expectations, actual outputs and commands. Public checks help detect errors, but do not establish every requirement.", "theory": "\n<p class=\"lead\">A successful launch does not prove algorithm correctness. Check numerical results, returned witnesses and boundary behaviour.<\/p>\n<h2>Checks by task<\/h2><ul><li><strong>DSU:<\/strong> on small graphs, recompute components by traversal after each insertion and compare counts and largest sizes.<\/li><li><strong>MST:<\/strong> check unique valid IDs, no loops or cycles, n−c selected edges, original-component connectivity and the weight sum. For small m, enumerate subsets to obtain the actual optimum. Agreement between Kruskal and Prim alone is insufficient: they may share a defect.<\/li><li><strong>SCC:<\/strong> compute all-pairs reachability on small graphs. Labels coincide exactly when reachability is mutual. Independently construct the set of cross-component pairs.<\/li><li><strong>Topo:<\/strong> check a vertex permutation and position[u]&lt;position[v] for every edge. Kahn's algorithm independently checks cycle existence.<\/li><li><strong>DAG:<\/strong> compare distances with independent relaxation on small graphs. Check every parent route, its direction and cost. Add a cycle unreachable from source.<\/li><\/ul>\n<h2>Boundary cases<\/h2><p>Include empty graphs where allowed, one vertex, isolates, disconnected graphs, repeated unions, loops, duplicates, parallel edges, ties, negative weights and totals beyond int. Use a nonzero source and unreachable vertices. Test a 100000-vertex DFS chain and mixed requests in one process to check state reset.<\/p>\n<h2>Commands<\/h2><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Install Python and the chosen language runtime. Create my_cases.jsonl yourself. The final command prints actual answers without comparing expected results. Public checks cover published cases, not all limits. Preserve inputs, justified expected answers, actual outputs and commands under tests/.<\/p>\n\n"}, "lab": null, "quiz": {"RU": {"question": "Два решения вернули разные ID рёбер, но оба леса допустимы и оптимальны. Это ошибка?", "options": ["Нет", "Да, ID обязаны совпасть", "Да, если порядок рёбер другой"], "feedback": "При равных оптимумах принимаются разные корректные свидетельства."}, "EN": {"question": "Two solutions return different edge IDs, but both forests are feasible and optimal. Is that an error?", "options": ["No", "Yes; IDs must match", "Yes, if the order differs"], "feedback": "Different valid witnesses are accepted when optima tie."}, "answer": 0}, "code": "", "book": null, "videos": []}, {"id": "analysis", "RU": {"title": "Объяснить решение и честно измерить время", "story": "Два алгоритма дают одинаковую стоимость, но один оказался быстрее на вашем графе. Что именно вы измерили: алгоритм, чтение JSON, построение списков или запуск JVM? Сравнение имеет смысл только при одинаковых условиях.", "steps": ["Сначала объясните, почему результат корректен.", "Отдельно оцените зависимость времени и памяти от n и m.", "Затем измерьте обе реализации на одинаковых графах и обсудите ограничения эксперимента."], "transfer": "В ANALYSIS.md нужны ваши инварианты, граничные случаи и реальные результаты. Для Краскала и Прима сравните три размера графов, минимум три замера каждого метода и медианы. Не превращайте одну таблицу времени в доказательство асимптотики.", "theory": "\n<p class=\"lead\">В ANALYSIS.md объясните, почему решение правильно и какие ресурсы оно требует. Измерения времени отвечают на другой вопрос: как ведёт себя ваша реализация на выбранных данных.<\/p>\n<h2>Структура объяснения<\/h2><p>Для каждого метода запишите цель, структуры данных, инвариант, инициализацию, сохранение инварианта и вывод при завершении. Затем разберите границы и время/память, включая возвращаемый результат. Сошлитесь на конкретные строки или функции своего кода. Для DFS объясните cursor и отсутствие зависимости от глубины стека вызовов; для DAG - проверку всех компонент и запрет релаксации из null.<\/p>\n<p><strong>Обозначения:<\/strong> n — число вершин, m — число входных рёбер, q — число операций DSU, L — число вершин восстановленного пути. α(n) — обратная функция Аккермана; она растёт очень медленно. Оценка с ней амортизированная: относится к суммарной работе последовательности операций.<\/p><table><tr><th>Метод<\/th><th>Время<\/th><th>Память с результатом<\/th><\/tr><tr><td>DSU<\/td><td>O(n+q α(n)), амортизированно<\/td><td>O(n+q)<\/td><\/tr><tr><td>Краскал<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Прим, ленивый<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Косарайю<\/td><td>O(n+m); для удаления повторов через хеш-множество - ожидаемо<\/td><td>O(n+m)<\/td><\/tr><tr><td>Topo / DAG<\/td><td>O(n+m)<\/td><td>O(n+m)<\/td><\/tr><tr><td>Восстановление пути<\/td><td>O(L)<\/td><td>O(L), результат<\/td><\/tr><\/table>\n<h2>Сравнение Краскала и Прима<\/h2><p>Возьмите три размера графа. Для каждого используйте одни и те же рёбра, веса и среду для обоих методов; сначала подтвердите оптимальные стоимости и допустимость лесов. Проведите минимум три замера каждого метода и вычислите медиану. Укажите n, m, генератор/seed либо сохранённые входы, команды, версию среды, оборудование, таймер и прогрев.<\/p>\n<p>Исключите компиляцию. Заранее определите границы: например, от готового int[][] до готового результата, включая создание списков и очереди. Если включаете разбор JSON или вывод, включайте одинаково у обоих методов и сообщите об этом. Не сравнивайте прогретый метод с единственным первым запуском другого. В Java пригоден System.nanoTime; в Python - time.perf_counter.<\/p>\n<p>Одна серия на трёх размерах не доказывает асимптотику. На результат влияют плотность графа, порядок рёбер, структура компонент, выделение памяти и прогрев JVM. Отделите наблюдения от доказанной оценки сложности. Приводите только реальные измерения. Отчёт напишите на английском, укажите источники, помощь инструментов и собственную проверку по силлабусу.<\/p>\n"}, "EN": {"title": "Explain the solution and measure it fairly", "story": "Two algorithms produce the same cost, but one is faster on your graph. Did you measure the algorithm, JSON parsing, adjacency construction or JVM startup? A comparison needs matching conditions.", "steps": ["Explain correctness first.", "Analyse how time and memory depend on n and m.", "Then measure both implementations on identical graphs and discuss experimental limits."], "transfer": "ANALYSIS.md needs your invariants, boundary cases and actual results. Compare Kruskal and Prim at three sizes, with at least three timings per method and medians. A timing table is not a proof of asymptotic complexity.", "theory": "\n<p class=\"lead\">ANALYSIS.md explains why the solution is correct and what resources it requires. Timings answer a separate question: how your implementation behaves on selected inputs.<\/p>\n<h2>Structure of the argument<\/h2><p>For each method, state the objective, data structures, invariant, initialisation, preservation and termination argument. Then discuss boundaries and time/memory, including returned output. Refer to your own functions or lines. For DFS, explain cursor and independence from call-stack depth; for DAG, explain whole-graph cycle detection and skipping null distances.<\/p>\n<p><strong>Notation:<\/strong> n is the vertex count, m the input edge count, q the DSU operation count, and L the reconstructed route length in vertices. α(n) is the inverse Ackermann function, which grows very slowly. The amortised bound describes total work over a sequence of operations.<\/p><table><tr><th>Method<\/th><th>Time<\/th><th>Memory including output<\/th><\/tr><tr><td>DSU<\/td><td>O(n+q α(n)), amortised<\/td><td>O(n+q)<\/td><\/tr><tr><td>Kruskal<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Lazy Prim<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Kosaraju<\/td><td>O(n+m); expected with hash deduplication<\/td><td>O(n+m)<\/td><\/tr><tr><td>Topo / DAG<\/td><td>O(n+m)<\/td><td>O(n+m)<\/td><\/tr><tr><td>Route reconstruction<\/td><td>O(L)<\/td><td>O(L) output<\/td><\/tr><\/table>\n<h2>Kruskal–Prim benchmark<\/h2><p>Use three graph sizes. For each size, supply identical edges, weights and environment to both algorithms. Verify optimum costs and forest feasibility before measuring. Record at least three timings per method and their median. State n, m, the generator/seed or saved inputs, commands, runtime version, hardware, timer and warm-up.<\/p>\n<p>Exclude compilation. Define a timing boundary beforehand: for example, from a ready int[][] to the returned result, including adjacency-list and heap construction. If JSON parsing or output is included, include it equally and say so. Do not compare a warmed method against only the first invocation of the other. System.nanoTime is suitable in Java; time.perf_counter in Python.<\/p>\n<p>One experiment at three sizes does not prove asymptotic complexity. Density, edge order, component structure, allocation and JVM warm-up affect timings. Separate observations from the proven complexity bound. Report actual measurements only. Write the analysis in English and acknowledge sources, tool assistance and your verification according to the syllabus.<\/p>\n"}, "lab": null, "quiz": null, "code": "", "book": null, "videos": []}, {"id": "reading", "RU": {"title": "Книги курса: открыть нужный раздел", "story": "К учебнику стоит обращаться с конкретным вопросом: почему выбор безопасен, что означает завершение DFS, откуда берётся оценка времени? Ниже можно сразу открыть PDF из материалов курса на нужной странице.", "steps": ["Выберите тему, которую сейчас разбираете.", "Откройте нужную страницу и сопоставьте обозначения со схемой.", "После чтения объясните один ключевой шаг своими словами."], "transfer": "По силлабусу основные книги — CLRS, 4-е издание (2022), и Sedgewick & Wayne, 4-е издание (2011). Skiena, 3-е издание (2020), — дополнительная. Ниже доступны PDF этих изданий и переходы к разделам, связанным с темой урока.", "theory": ""}, "EN": {"title": "Course books: open the relevant section", "story": "Go to the textbook with a specific question: why is a choice safe, what does DFS finishing mean, or where does a complexity bound come from? Open the supplied course PDF directly at the relevant page below.", "steps": ["Choose the topic you are studying.", "Open its page and connect the notation to the diagram.", "After reading, explain one important step in your own words."], "transfer": "The syllabus lists CLRS, fourth edition (2022), and Sedgewick & Wayne, fourth edition (2011), as main textbooks; Skiena, third edition (2020), is additional. Open these editions below at the sections related to the lesson.", "theory": ""}, "lab": null, "quiz": null, "code": "", "book": null, "videos": []}, {"id": "video", "RU": {"title": "Смотреть по теме: видео и учебный пример", "story": "Выберите одно видео по текущему вопросу, а не длинный курс целиком. Перед просмотром решите, что хотите увидеть: изменение групп, выбор ребра, завершение DFS или обновление стоимости. После видео вернитесь к схеме и повторите пример без подсказки.", "steps": ["Для введения начните с DSU или DFS.", "Для конкретного алгоритма выберите тематическую карточку.", "Для общего повторения оставлен наш видеоурок на 20 минут."], "transfer": "Внешние видео объясняют алгоритмы, но не определяют JSON-контракт или правила сдачи. В DAG-видео часть о longest path дополнительная. Для SCC нужен Косарайю, для topo — DFS: Tarjan, Kahn и Dijkstra не заменяют требуемые методы. Учебный Java-файл ниже решает другую задачу — достижимость через BFS.", "theory": "<div class=\"lessonVideo\"><\/div><h3>Запустите похожий учебный пример<\/h3><p>ReachabilityDemo.java использует список смежности, очередь и visited, чтобы найти достижимые комнаты. Он не содержит DSU, Краскала, Прима, Косарайю, топологической сортировки или кратчайших путей DAG. Сравните очередь BFS с активным стеком DFS; не подставляйте BFS вместо требуемого алгоритма.<\/p><p><a href=\"code/ReachabilityDemo.java\" download>Скачать ReachabilityDemo.java<\/a><\/p><pre>javac --release 17 -encoding UTF-8 ReachabilityDemo.java\njava ReachabilityDemo<\/pre><p>Ожидаемый вывод: Reachable from 0: [0, 1, 2, 3]; vertex 4 reachable: false.<\/p>"}, "EN": {"title": "Watch by topic: videos and a learning example", "story": "Choose one video for your current question rather than an entire course. Decide what to watch for: changing groups, edge choices, DFS finishing or distance updates. Then return to the diagram and repeat the example without hints.", "steps": ["Start with DSU or DFS for foundations.", "Choose a topic card for a particular algorithm.", "Use the 20-minute course video for a full review."], "transfer": "External videos explain algorithms rather than defining JSON contracts or submission rules. The DAG video’s longest-path part is optional. SCC requires Kosaraju and topo requires DFS; Tarjan, Kahn and Dijkstra are not substitutes. The Java file below solves a different problem: reachability using BFS.", "theory": "<div class=\"lessonVideo\"><\/div><h3>Run a related learning example<\/h3><p>ReachabilityDemo.java uses adjacency lists, a queue and visited flags to find reachable rooms. It contains none of the six assignment algorithms. Compare its BFS queue with an active DFS stack; do not substitute BFS for a required method.<\/p><p><a href=\"code/ReachabilityDemo.java\" download>Download ReachabilityDemo.java<\/a><\/p><pre>javac --release 17 -encoding UTF-8 ReachabilityDemo.java\njava ReachabilityDemo<\/pre><p>Expected output: Reachable from 0: [0, 1, 2, 3]; vertex 4 reachable: false.<\/p>"}, "lab": null, "quiz": null, "code": "", "book": null, "videos": [{"id": "ibjEGG7ylHk", "title": "Union Find Introduction", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/ibjEGG7ylHk/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "0jNmHPfA_yE", "title": "Union Find - Union and Find Operations", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/0jNmHPfA_yE/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "VHRhJWacxis", "title": "Union Find Path Compression", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/VHRhJWacxis/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "JZBQLXgSGfs", "title": "Union Find Kruskal's Algorithm", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/JZBQLXgSGfs/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "jsmMtJpPnhU", "title": "Prim's Minimum Spanning Tree Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/jsmMtJpPnhU/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "RpgcYiky7uw", "title": "Strongly Connected Components Kosaraju's Algorithm Graph Algorithm", "author": "Tushar Roy - Coding Made Simple", "thumbnail": "https://i.ytimg.com/vi/RpgcYiky7uw/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "eL-KzMXSXXI", "title": "Topological Sort Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/eL-KzMXSXXI/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "TXkDpqjDMHA", "title": "Shortest/Longest path on a Directed Acyclic Graph (DAG)  | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/TXkDpqjDMHA/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "7fujbpJ0LB4", "title": "Depth First Search Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/7fujbpJ0LB4/hqdefault.jpg", "verified": "2026-10-19"}]}]</script><script>'use strict';

 $('deeper').replaceChildren();if(t.theory||c.code){const d=document.createElement('details');d.className='deep';d.open=c.id==='video';d.innerHTML='<summary>'+tr(c.id==='video'?'Видеоурок на 20 минут и отдельный Java-пример':c.practice?'Обоснование и ограничения алгоритма':'Разобрать подробнее',c.id==='video'?'20-minute video and a separate Java example':c.practice?'Reasoning and algorithm limits':'Explore in more depth')+'</summary><div class="deepbody">'+t.theory+(c.code&&!c.practice?'<div class="codebar"><h3>'+tr('Учебный фрагмент Java','Learning fragment · Java')+'</h3><button id="copyCode">'+tr('Копировать фрагмент','Copy fragment')+'</button></div><p class="small">'+esc(t.code_context||tr('Фрагмент внутри метода.','Method-body fragment.'))+'</p><pre><code id="sourceCode"></code></pre><p id="copyStatus" class="small live" role="status"></p>':'')+'</div>';$('deeper').append(d);if(c.code){$('sourceCode').textContent=c.code;$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(c.code);$('copyStatus').textContent=tr('Фрагмент скопирован.','Fragment copied.');}catch(e){const r=document.createRange();r.selectNodeContents($('sourceCode'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copyStatus').textContent=tr('Фрагмент выделен. Нажмите Ctrl+C / ⌘C.','Fragment selected. Press Ctrl+C / ⌘C.');}};}}
 document.querySelectorAll('.deepbody table').forEach(table=>{const w=document.createElement('div');w.className='tablewrap';table.replaceWith(w);w.append(table);});

 $('templateLink').textContent=tr('Шаблон задания','Assignment template');$('footerNote').textContent=tr('Идея → проверка на примере → собственная реализация. Полные требования к сдаче смотрите в README своего шаблона.','Understand → test on an example → implement independently. Follow your template’s README for full submission requirements.');nav();

function graph(rows,options={}){
 const n=options.n||5,points=n===3?[[110,130],[310,130],[510,130]]:[[65,145],[225,65],[225,230],[410,110],[565,190],[565,45]],selected=new Set(options.selected||[]),candidate=options.candidate,active=new Set(options.active||[]);let html='<svg viewBox="0 0 640 300" role="img" aria-label="'+esc(tr('Интерактивный учебный граф','Interactive learning graph'))+'"><defs><marker id="edgeArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#617b90"/></marker></defs>';
 rows.forEach((e,i)=>{let u=e[0],v=e[1];if(options.reverse){const z=u;u=v;v=z;}const[x,y]=points[u],[a,b]=points[v],dx=a-x,dy=b-y,l=Math.hypot(dx,dy),sx=x+dx/l*22,sy=y+dy/l*22,ex=a-dx/l*25,ey=b-dy/l*25;const color=i===candidate?'#b77b1b':selected.has(i)?'#25735e':'#a6b5c0',width=i===candidate||selected.has(i)?4:1.7;html+='<path d="M'+sx+','+sy+' L'+ex+','+ey+'" stroke="'+color+'" stroke-width="'+width+'" fill="none"'+(options.directed?' marker-end="url(#edgeArrow)"':'')+'/>';if(e.length>2&&options.weights!==false){const tx=(x+a)/2-dy/l*13,ty=(y+b)/2+dx/l*13;html+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" font-size="15" font-weight="650" fill="#3c566a" stroke="#f4f8fa" stroke-width="5" paint-order="stroke">'+e[2]+'</text>';}});
 for(let v=0;v<n;v++){const[x,y]=points[v],label=options.names?options.names[v]:String(v),group=options.groups?options.groups[v]:-1;let fill=group>=0?palette[group%palette.length]:'#fff';if(options.done&&options.done.includes(v))fill='#cfe6dc';if(active.has(v)&&!options.groups)fill='#f1ddbc';html+='<g class="node" data-node="'+v+'"'+(options.clickable?' role="button" tabindex="0" aria-label="'+esc(tr('Выбрать вершину ','Select vertex ')+label)+'"':'')+'><circle cx="'+x+'" cy="'+y+'" r="21" fill="'+fill+'" stroke="'+(active.has(v)?'#a86b10':'#3e647c')+'"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" fill="#213e52">'+v+'</text>'+(options.names?'<text x="'+x+'" y="'+(y+43)+'" text-anchor="middle" font-size="13" fill="#365971">'+esc(label)+'</text>':'')+'</g>';}
 return html+'</svg>';
}
function bindNodes(box,action){box.querySelectorAll('[data-node]').forEach(n=>{n.onclick=()=>action(Number(n.dataset.node));n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(Number(n.dataset.node));}};});}
function edgeList(rows,directed=false){return '<details class="deep edgeList"><summary>'+tr('Рёбра и их исходные ID','Edges and original IDs')+'</summary><div class="deepbody"><pre>'+rows.map((e,i)=>'ID '+i+': '+e[0]+(directed?' → ':' — ')+e[1]+(e.length>2?' · '+tr('вес ','weight ')+e[2]:'')).join('\n')+'</pre></div></details>';}
function labShell(box,title,subtitle){box.innerHTML='<div class="lab"><div class="labbar"><strong>'+title+'</strong><small>'+subtitle+'</small></div><div class="labbody"></div></div>';return box.querySelector('.labbody');}
function metric(label,value){return '<div class="metric">'+esc(label)+' <b>'+esc(value)+'</b></div>';}
function feedback(message,bad=false){return message?'<div class="feedback'+(bad?' bad':'')+'" role="status">'+esc(message)+'</div>':'';}
function paintLab(box,kind){if(kind==='overview')return overviewLab(box);if(kind==='model')return modelLab(box);if(kind==='dsu')return dsuLab(box);if(kind==='kruskal')return kruskalLab(box);if(kind==='prim')return primLab(box);if(kind==='dfs')return dfsLab(box);if(kind==='scc')return sccLab(box);if(kind==='topo')return topoLab(box);if(kind==='dag')return dagLab(box);}
function overviewLab(box){const body=labShell(box,tr('Один план — разные вопросы','One plan, different questions'),tr('Переключите цель','Switch the objective'));let mode='network';function draw(){const schedule=mode==='schedule',selected=mode==='network'?[2,1,6,3]:mode==='route'?[1,5]:[];body.innerHTML='<div class="controls">'+[['network',tr('Соединить все комнаты','Connect every room')],['route',tr('Дойти от 0 до 4','Travel from 0 to 4')],['schedule',tr('Спланировать работы','Order the work')]].map(([id,t])=>'<button data-mode="'+id+'" aria-pressed="'+(mode===id)+'">'+t+'</button>').join('')+'</div>'+graph(schedule?taskEdges:cableEdges,{selected,directed:schedule,names:schedule?(language==='RU'?namesRU:namesEN):undefined})+'<p class="message">'+(mode==='network'?tr('Выделенные кабели соединяют все пять комнат. Общая стоимость сети — 10.','Highlighted cables span all five rooms. Total network cost: 10.'):mode==='route'?tr('Для доставки из 0 в 4 достаточно пути 0→2→4. Его стоимость — 8; остальные комнаты посещать не требуется.','A delivery from 0 to 4 uses 0→2→4, costing 8. Other rooms need not be visited.'):tr('Стрелка означает «сначала закончите предыдущую работу». Например: данные → API → тесты → релиз.','An arrow means “finish the prerequisite first”. For example: data → API → tests → release.'))+'</p>';body.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw();});}draw();}
function modelLab(box){const body=labShell(box,tr('Что означает связь?','What does a link mean?'),tr('Сравните три модели','Compare three models'));let mode=0;function draw(){body.innerHTML='<div class="controls">'+[tr('Связь в обе стороны','Two-way links'),tr('Одно направление','One-way links'),tr('Направление и стоимость','Direction and cost')].map((t,i)=>'<button data-model="'+i+'" aria-pressed="'+(mode===i)+'">'+t+'</button>').join('')+'</div>'+graph(mode===0?cableEdges:taskEdges.map((e,i)=>mode===2?[...e,[5,2,2,4,3][i]]:e),{directed:mode>0,weights:mode===2})+'<p class="message">'+[tr('В неориентированном графе каждая линия доступна в обе стороны. Для хранения нужны записи соседства у обоих концов.','An undirected link works both ways. Store adjacency entries at both endpoints.'),tr('Стрелки задают только разрешённое направление. Путь туда не гарантирует путь обратно.','Arrows show permitted directions. A forward route does not guarantee a return route.'),tr('Теперь у переходов есть цена. Направление и вес — разные характеристики ребра.','Transitions now carry costs. Direction and weight are separate edge properties.')][mode]+'</p><div class="state">'+(mode===0?'neighbours[0] = [1, 2]':'outgoing[0] = [1, 2]')+'</div>';body.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{mode=Number(b.dataset.model);draw();});}draw();}
function dsuLab(box){const body=labShell(box,tr('Соберите команды','Build the teams'),tr('Нажмите на две вершины','Select two vertices'));let labels=[0,1,2,3,4],selected=[],links=[],message='',bad=false;function choose(v){if(selected.length===0){selected=[v];message=tr('Теперь выберите вторую вершину.','Now select a second vertex.');draw();return;}const u=selected[0],a=labels[u],b=labels[v];selected=[];if(a===b){message=tr('Они уже в одной группе. Число компонент не меняется.','They already share a group. The component count stays the same.');bad=false;}else{labels=labels.map(x=>x===b?a:x);links.push([u,v]);message=tr('Объединили две разные группы. Компонент стало на одну меньше.','Merged two distinct groups. There is one fewer component.');bad=false;}draw();}
 function draw(){const count=new Set(labels).size,sizes=labels.map(x=>labels.filter(y=>y===x).length),largest=Math.max(...sizes);body.innerHTML=graph(links,{groups:labels,active:selected,clickable:true})+'<div class="metrics">'+metric(tr('Компоненты','Components'),count)+metric(tr('Наибольшая','Largest'),largest)+'</div><p class="legend">'+tr('Одинаковый цвет — одна группа. Попробуйте объединить 0 и 1, затем 1 и 2, затем повторить 0 и 2.','Matching colours indicate one group. Try 0 with 1, then 1 with 2, then repeat 0 with 2.')+'</p>'+feedback(message,bad)+'<div class="controls"><button data-reset>'+tr('Начать заново','Reset')+'</button></div><details class="deep"><summary>'+tr('Как сжатие пути сокращает поиск?','How does path compression shorten a search?')+'</summary><div class="deepbody"><div class="compression"></div></div></details>';bindNodes(body,choose);body.querySelector('[data-reset]').onclick=()=>{labels=[0,1,2,3,4];selected=[];links=[];message='';draw();};compressionLab(body.querySelector('.compression'));}draw();}
function compressionLab(box){let compressed=false;function draw(){const points=compressed?[[320,45],[90,190],[245,190],[400,190],[555,190]]:[[60,150],[190,150],[320,150],[450,150],[580,150]];const parent=compressed?[0,0,0,0,0]:[0,0,1,2,3];let s='<svg viewBox="0 0 640 260" role="img" aria-label="'+esc(tr('Родительские связи до и после сжатия','Parent links before and after compression'))+'">';for(let v=1;v<5;v++){const[x,y]=points[v],[a,b]=points[parent[v]];s+='<path d="M'+x+','+y+' L'+a+','+b+'" stroke="'+(compressed?'#25735e':'#8b9fac')+'" stroke-width="3"/>';};points.forEach(([x,y],v)=>s+='<circle cx="'+x+'" cy="'+y+'" r="20" fill="'+(v===0?'#f1ddbc':'#d6e7f2')+'" stroke="#3e647c"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15">'+v+'</text>');s+='</svg>';box.innerHTML=s+'<p>'+tr(compressed?'После find(4) вершины пути ссылаются сразу на корень 0. Состав группы не изменился.':'До сжатия поиск от 4 идёт по цепочке 4→3→2→1→0.',compressed?'After find(4), path vertices point directly to root 0. Membership is unchanged.':'Before compression, finding 4 follows 4→3→2→1→0.')+'</p><div class="state">parent = ['+parent.join(', ')+']</div><div class="controls"><button>'+tr(compressed?'Показать исходное дерево':'Сжать путь от 4',compressed?'Show the original tree':'Compress the path from 4')+'</button></div>';box.querySelector('button').onclick=()=>{compressed=!compressed;draw();};}draw();}
function kruskalLab(box){const body=labShell(box,tr('Решите: принять или пропустить','Decide: accept or skip'),tr('Краскал · учебная сеть','Kruskal · example network'));const sorted=[2,1,6,0,3,5,4];let step=0,labels=[0,1,2,3,4],ids=[],cost=0,message='',bad=false;
 function act(accept){const id=sorted[step],[u,v,w]=cableEdges[id],safe=labels[u]!==labels[v];if(accept!==safe){bad=true;message=safe?tr('Сейчас это самое дешёвое ребро между разными группами. Его можно безопасно принять.','This is the cheapest edge between distinct groups. It is safe to accept.'):tr('Уже есть путь между концами. Новое ребро замкнёт цикл — пропустите его.','The endpoints already have a path. This edge closes a cycle; skip it.');draw();return;}bad=false;if(accept){const a=labels[u],b=labels[v];labels=labels.map(x=>x===b?a:x);ids.push(id);cost+=w;message=tr('Принято: разные компоненты объединились.','Accepted: two distinct components merged.');}else message=tr('Пропущено: лес остался без цикла.','Skipped: the forest remains acyclic.');step++;draw();}
 function draw(){const complete=step===sorted.length,id=complete?null:sorted[step],e=complete?null:cableEdges[id];body.innerHTML=graph(cableEdges,{selected:ids,candidate:id,groups:labels})+edgeList(cableEdges)+'<div class="metrics">'+metric(tr('Стоимость','Cost'),cost)+metric(tr('Компоненты','Components'),new Set(labels).size)+'</div><p class="message">'+(complete?tr('Готово: четыре связи соединяют пять комнат. Минимальная общая стоимость — 10.','Done: four links span five rooms. Minimum total cost: 10.'):tr('Следующее ребро: ','Next edge: ')+e[0]+'–'+e[1]+', '+tr('вес ','weight ')+e[2]+'.')+'</p><div class="controls"><button data-accept '+(complete?'disabled':'')+'>'+tr('Принять','Accept')+'</button><button data-skip '+(complete?'disabled':'')+'>'+tr('Пропустить','Skip')+'</button><button data-reset>'+tr('Сначала','Reset')+'</button></div>'+feedback(message,bad)+'<p class="legend">'+tr('Зелёные рёбра приняты. Золотое — текущий кандидат.','Green edges are accepted. Gold is the current candidate.')+'</p>';body.querySelector('[data-accept]').onclick=()=>act(true);body.querySelector('[data-skip]').onclick=()=>act(false);body.querySelector('[data-reset]').onclick=()=>{step=0;labels=[0,1,2,3,4];ids=[];cost=0;message='';draw();};}draw();}
function primLab(box){const body=labShell(box,tr('Выберите связь границы','Choose a boundary link'),tr('Прим · старт из 0','Prim · start at 0'));let used=new Set([0]),ids=[],cost=0,message='',bad=false;
 function draw(){const options=cableEdges.map((e,id)=>({e,id})).filter(({e})=>used.has(e[0])!==used.has(e[1])),complete=used.size===5;body.innerHTML=graph(cableEdges,{selected:ids,done:[...used]})+edgeList(cableEdges)+'<div class="metrics">'+metric(tr('Подключено','Connected'),used.size+' / 5')+metric(tr('Стоимость','Cost'),cost)+'</div><p class="message">'+(complete?tr('Вся сеть подключена. Стоимость 10 совпадает с результатом Краскала.','The network is connected. Cost 10 agrees with Kruskal.'):tr('Выберите самое дешёвое ребро от подключённой части к новой вершине.','Choose the cheapest edge from the connected part to a new vertex.'))+'</p><div class="controls candidates">'+options.map(({e,id})=>'<button data-offer="'+id+'">'+e[0]+'–'+e[1]+' · '+tr('вес ','weight ')+e[2]+'</button>').join('')+'</div>'+feedback(message,bad)+'<div class="controls"><button data-reset>'+tr('Начать заново','Reset')+'</button></div>';body.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.offer),e=cableEdges[id],min=Math.min(...options.map(x=>x.e[2]));if(e[2]!==min){bad=true;message=tr('На границе есть более дешёвая связь. Сравните все текущие предложения.','A cheaper boundary link exists. Compare all current offers.');}else{bad=false;used.add(e[0]);used.add(e[1]);ids.push(id);cost+=e[2];message=tr('Новая вершина подключена. Теперь изменился и набор кандидатов.','A new vertex joined. The candidate boundary has changed.');}draw();});body.querySelector('[data-reset]').onclick=()=>{used=new Set([0]);ids=[];cost=0;message='';draw();};}draw();}
function dfsLab(box){const body=labShell(box,tr('Посмотрите, когда вершина завершается','Watch when a vertex finishes'),tr('Состояние стека','Stack state'));const events=[[[0],[],'start'],[[0,1],[],'push'],[[0,1,3],[],'push'],[[0,1,3,4],[],'push'],[[0,1,3],[4],'finish'],[[0,1],[4,3],'finish'],[[0],[4,3,1],'finish'],[[0,2],[4,3,1],'push'],[[0,2],[4,3,1],'skip'],[[0],[4,3,1,2],'finish'],[[],[4,3,1,2,0],'finish']];let step=0;
 function draw(){const[stack,finish,action]=events[step];let msg=step===0?tr('Начните из вершины 0. Она активна, но ещё не завершена.','Start at vertex 0. It is active, not finished.'):action==='push'?tr('Перейдите к новому соседу. Незавершённые предшественники остаются в стеке.','Visit a new neighbour. Unfinished predecessors remain on the stack.'):action==='skip'?tr('Из 2 видим уже завершённую 3. Это не ребро в активную вершину и не доказательство цикла.','From 2, vertex 3 is already finished. This is not an active back edge and proves no cycle.'):tr('Все соседи вершины обработаны: добавьте её в finish и вернитесь к предшественнику.','All neighbours are processed: append the vertex to finish and return to its predecessor.');body.innerHTML=graph(taskEdges,{directed:true,active:stack,done:finish})+'<div class="controls"><button data-prev '+(!step?'disabled':'')+'>'+tr('Назад','Back')+'</button><span class="tag">'+(step+1)+' / '+events.length+'</span><button data-next '+(step===events.length-1?'disabled':'')+'>'+tr('Следующий шаг','Next step')+'</button><button data-reset>'+tr('Сначала','Reset')+'</button></div><p class="message">'+msg+'</p><div class="state">stack = ['+stack.join(', ')+']\nfinish = ['+finish.join(', ')+']'+(step===10?'\nreverse(finish) = [0, 2, 1, 3, 4]':'')+'</div><p class="legend">'+tr('Золотой — активный путь; зелёный — завершённые вершины. Верх стека справа.','Gold is the active path; green vertices are finished. Stack top is on the right.')+'</p>';body.querySelector('[data-prev]').onclick=()=>{step--;draw();};body.querySelector('[data-next]').onclick=()=>{step++;draw();};body.querySelector('[data-reset]').onclick=()=>{step=0;draw();};}draw();}
function sccLab(box){const body=labShell(box,tr('Найдите взаимную достижимость','Explore mutual reachability'),tr('Выберите вершину','Select a vertex'));const rows=[[0,1],[1,2],[2,0],[2,3],[3,4],[4,3]],labels=[0,0,0,1,1,2];let selected=0,condensed=false,reverse=false;
 function draw(){const members=labels.map((g,v)=>g===labels[selected]?v:null).filter(v=>v!==null);body.innerHTML='<div class="controls"><button data-full aria-pressed="'+!condensed+'">'+tr('Исходный граф','Original graph')+'</button><button data-condense aria-pressed="'+condensed+'">'+tr('Сжать группы','Contract the groups')+'</button><button data-reverse aria-pressed="'+reverse+'" '+(condensed?'disabled':'')+'>'+tr('Развернуть стрелки','Transpose the edges')+'</button></div>'+(condensed?graph([[0,1]],{n:3,directed:true,groups:[0,1,2],names:['A={0,1,2}','B={3,4}','C={5}']}):graph(rows,{n:6,directed:true,reverse,groups:labels,active:members,clickable:true}))+'<p class="message">'+(condensed?tr('Взаимно достижимые вершины стали одной группой. Между A и B осталось направление A→B; C изолирована.','Mutually reachable vertices became one group. The remaining link is A→B; C is isolated.'):tr('В одной SCC с ','In the same SCC as ')+selected+': {'+members.join(', ')+'}. '+tr('Проверять нужно пути в обе стороны.','Paths must exist in both directions.'))+'</p><div class="state">'+(condensed?'condensation: A -> B; C':tr('Метки групп: ','Group labels: ')+'[0, 0, 0, 1, 1, 2]')+'</div><p class="legend">'+tr('Разворот всех стрелок сохраняет SCC, но меняет направления между группами. Здесь объясняется результат; Косарайю использует два DFS-прохода.','Transposing every edge preserves SCC membership but reverses inter-group links. This explains the result; Kosaraju computes it using two DFS passes.')+'</p>';if(!condensed)bindNodes(body,v=>{selected=v;draw();});body.querySelector('[data-full]').onclick=()=>{condensed=false;draw();};body.querySelector('[data-condense]').onclick=()=>{condensed=true;reverse=false;draw();};body.querySelector('[data-reverse]').onclick=()=>{reverse=!reverse;draw();};}draw();}
function topoLab(box){const body=labShell(box,tr('Составьте допустимый порядок работ','Build a valid task order'),tr('Можно ошибаться и проверять','Try a choice and get feedback'));let order=[],cycle=false,message='',bad=false;
 function draw(){const rows=cycle?[...taskEdges,[4,0]]:taskEdges,names=language==='RU'?namesRU:namesEN;body.innerHTML=graph(rows,{directed:true,names,done:order,candidate:cycle?5:null})+'<p class="message">'+tr('Какая работа может идти следующей?','Which task may come next?')+'</p><div class="controls">'+names.map((t,v)=>'<button data-task="'+v+'" '+(order.includes(v)?'disabled':'')+'>'+v+' · '+t+'</button>').join('')+'</div><div class="state">order = ['+order.join(', ')+']</div>'+feedback(message,bad)+'<div class="controls"><button data-cycle aria-pressed="'+cycle+'">'+tr(cycle?'Убрать цикл 4→0':'Добавить цикл 4→0',cycle?'Remove cycle 4→0':'Add cycle 4→0')+'</button><button data-reset>'+tr('Сначала','Reset')+'</button></div><p class="legend">'+tr('Это проверка смысла порядка. В задании порядок нужно построить через DFS с тремя состояниями.','This checks order validity. The assignment requires constructing the order using three-state DFS.')+'</p>';body.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.task),missing=rows.filter(e=>e[1]===v&&!order.includes(e[0])).map(e=>e[0]);if(missing.length){bad=true;message=tr('Рано: сначала нужны работы ','Not yet: finish tasks ')+missing.join(', ')+'.';}else{bad=false;order.push(v);message=order.length===5?tr('Порядок готов. API и интерфейс можно было выполнить в любом взаимном порядке.','Order complete. API and interface could have appeared in either relative order.'):tr('Зависимости выполнены. Выберите следующую работу.','Prerequisites satisfied. Choose the next task.');}draw();});body.querySelector('[data-cycle]').onclick=()=>{cycle=!cycle;order=[];bad=cycle;message=cycle?tr('Теперь 0 зависит от 4, а 4 — через цепочку от 0. Ни одна работа не может начать полный порядок.','Now 0 depends on 4, while 4 indirectly depends on 0. No task can start a complete order.'):'';draw();};body.querySelector('[data-reset]').onclick=()=>{order=[];message='';draw();};}draw();}
function dagLab(box){const body=labShell(box,tr('Как меняется лучшая стоимость','How the best cost changes'),tr('Пройдите расчёт по этапам','Step through the stages'));let step=0,discount=false,isolate=false,pathOnly=false;function draw(){const rows=[[0,1,5],[0,2,2],[1,3,discount?-4:2],[2,3,4],[3,4,3],[2,4,9]],states=[[0,null,null,null,null],[0,5,2,null,null],[0,5,2,discount?1:7,null],[0,5,2,discount?1:6,11],[0,5,2,discount?1:6,discount?4:9],[0,5,2,discount?1:6,discount?4:9]],parents=[[-1,-1,-1,-1,-1],[-1,0,1,-1,-1],[-1,0,1,2,-1],[-1,0,1,discount?2:3,5],[-1,0,1,discount?2:3,4],[-1,0,1,discount?2:3,4]],distance=[...states[step]],parent=[...parents[step]];if(isolate){distance.push(null);parent.push(-1);}let selected=parent.filter(x=>x>=0);const route=discount?[0,1,3,4]:[0,2,3,4];if(pathOnly&&step===5)selected=discount?[0,2,4]:[1,3,4];const msg=[tr('Пока известна только стоимость до источника 0. Вершины обрабатываем в порядке 0,1,2,3,4.','Only the source distance is known initially. Process vertices in order 0,1,2,3,4.'),tr('Из 0 узнали стоимости до 1 и 2.','From 0, discover costs to 1 and 2.'),tr('Через 1 появился первый кандидат пути до 3.','Via 1, obtain a first candidate route to 3.'),tr(discount?'Через 2 путь к 3 не улучшился; появился кандидат до 4.':'Через 2 стоимость до 3 улучшилась с 7 до 6; появился кандидат до 4.',discount?'Going through 2 does not improve 3; it provides a candidate to 4.':'Via 2, improve 3 from 7 to 6 and obtain a candidate to 4.'),tr('Через 3 улучшили путь до 4.','Via 3, improve the route to 4.'),tr('Расчёт окончен. Путь до 4: ','Complete. Route to 4: ')+route.join('→')+', '+tr('стоимость ','cost ')+(discount?4:9)+'.'][step];body.innerHTML=graph(rows,{n:isolate?6:5,directed:true,selected,active:step>0?[step-1]:[]})+edgeList(rows,true)+'<div class="controls"><button data-prev '+(!step?'disabled':'')+'>'+tr('Назад','Back')+'</button><span class="tag">'+step+' / 5</span><button data-next '+(step===5?'disabled':'')+'>'+tr('Следующий этап','Next stage')+'</button><button data-discount aria-pressed="'+discount+'">'+tr(discount?'Убрать скидку':'Включить скидку −4',discount?'Remove discount':'Enable discount −4')+'</button><button data-isolate aria-pressed="'+isolate+'">'+tr('Изолированная вершина','Isolated vertex')+'</button><button data-path '+(step!==5?'disabled':'')+' aria-pressed="'+pathOnly+'">'+tr('Только путь до 4','Only the route to 4')+'</button></div><p class="message">'+msg+'</p><div class="state">distance = ['+distance.map(x=>x===null?'null':x).join(', ')+']\nparent_edge = ['+parent.join(', ')+']</div><p class="legend">'+tr('Веса подписаны на стрелках. Зелёным выделены выбранные родительские рёбра. Пока расчёт не закончен, null означает, что путь ещё не найден.','Arrows carry weights. Green shows current parent edges. Before processing finishes, null means no route has been discovered yet.')+(isolate?tr(' Вершина 5 останется недостижимой.',' Vertex 5 remains unreachable.'):'')+'</p>';body.querySelector('[data-prev]').onclick=()=>{step--;pathOnly=false;draw();};body.querySelector('[data-next]').onclick=()=>{step++;draw();};body.querySelector('[data-discount]').onclick=()=>{discount=!discount;step=0;pathOnly=false;draw();};body.querySelector('[data-isolate]').onclick=()=>{isolate=!isolate;draw();};body.querySelector('[data-path]').onclick=()=>{pathOnly=!pathOnly;draw();};}draw();}
