<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore graph algorithms through interactive diagrams, questions, practical applications and course reading. Russian and English."><title>Graph Algorithms | DAA</title><style>:root{font-family:"Segoe UI",Arial,sans-serif;color:#203348;background:#f5f3ef;--ink:#203348;--muted:#5d6b78;--line:#dddfe1;--rose:#8d3658;--blue:#356b89;--green:#25735e;--amber:#9b6616}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,summary{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:1px solid #bbc5cc;border-radius:8px;padding:10px 15px;background:white;color:var(--ink);line-height:1.3}button:hover{border-color:var(--blue);background:#f0f6f8}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true],button.primary{background:var(--ink);color:white;border-color:var(--ink)}a{color:#813450;text-underline-offset:3px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #bd7293;outline-offset:3px}header{background:#fff;border-top:5px solid var(--rose);border-bottom:1px solid var(--line);padding:17px 3vw;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-size:23px;font-weight:700;letter-spacing:-.02em}.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500;margin-top:5px}.languages{display:flex;gap:6px}.layout{max-width:1480px;margin:auto;display:grid;grid-template-columns:230px minmax(0,990px);gap:35px;padding:28px 3vw 50px}aside{position:sticky;top:18px;align-self:start;max-height:94vh;overflow:auto}aside label{font-size:13px;color:var(--muted);display:block;margin:0 0 7px}#search{width:100%;border:1px solid #b8c1c9;border-radius:7px;padding:10px;background:white}.navgroup{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.0 ont-size:13px}.small{font-size:13px;color:var(--muted);line-height:1.6}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px;line-height:1.6}td,th{border:1px solid var(--line);text-align:left;padding:10px;vertical-align:top}th{background:#f0f3f5}code{font-family:Consolas,monospace;font-size:.9em;background:#f0f2f5;padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}pre{font:14px/1.65 Consolas,monospace;overflow:auto;white-space:pre;padding:19px;background:#173248;color:#ecf2f7;border-radius:9px;max-height:600px}pre code{background:none;padding:0;font-size:inherit;white-space:pre;overflow-wrap:normal}.resourcehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.resourcehead span{font-size:12px;color:var(--muted)}.videogrid,.bookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:16px 0}.videoCard,.bookCard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white}.videoCard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#dce8ee}.videoCard .cardbody,.bookCard{padding:15px}.videoCard h3,.bookCard h3{margin:4px 0 8px;font-size:16px}.videoCard p,.bookCard p{font-size:13px;line-height:1.6}.videoCard button,.bookCard button{font-size:13px;padding:7px 10px}.videoCard iframe{width:100%;aspect-ratio:16/9;border:0;display:block}.bookCard .badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:12px;background:#ebf1ea;color:#345b3b}.bookCard .badge.extra{background:#f3eadf;color:#805b2d}.bookLinks{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.bookFrame{width:100%;height:650px;border:1px solid var(--line);border-radius:9px;margin-top:13px;background:#eef2f4}.bookPreview[hidden]{display:none}.nextnav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:22px;margin-top:30px}.nextnav button{max-width:48%;text-align:left;font-size:14px}footer{font-size:13px;line-hei </style></head><body><a class="skip" href="#main">К уроку / Skip to lesson</a><header><div class="brand">Graph Algorithms<small>Design and Analysis of Algorithms · Assignment 3</small></div><div class="languages" role="group" aria-label="Language / Язык"><button id="ru" aria-pressed="true">Русский</button><button id="en" aria-pressed="false">English</button></div></header><div class="layout"><aside><label id="searchLabel" for="search"></label><input id="search" type="search" autocomplete="off"><nav id="contents" aria-label="Lesson contents"></nav><p id="empty" class="small" role="status"></p><p id="navHint" class="navhint"></p></aside><main id="main" tabindex="-1"><article><p id="eyebrow" class="eyebrow"></p><div class="progressline" aria-hidden="true"><span id="progress"></span></div><h1 id="title"></h1><p id="story" class="story"></p><div id="routebar" class="routebar"></div><section id="activity"></section><section id="steps" class="steps"></section><section id="quiz"></section><section id="transfer" class="transfer"></section><section id="practice"></section><section id="deeper"></section><section id="reading"></section><section id="videos"></section><nav class="nextnav" aria-label="Lesson navigation"><button id="prev"></button><button id="next"></button></nav></article><footer><div class="quicklinks"><a href="https://github.com/RZhaniya/daa-assignment-3-graphs" id="templateLink" target="_blank" rel="noopener"></a><a href="https://github.com/RZhaniya/daa-assignment-3-graphs/blob/main/docs/Assignment_3_EN.pdf" target="_blank" rel="noopener">Assignment PDF · English</a><a href="https://github.com/RZhaniya/daa-assignment-3-graphs/blob/main/docs/Assignment_3_RU.pdf" target="_blank" rel="noopener">Задание PDF · русский</a></div><p id="footerNote"></p></footer></main></div><script id="lesson-data" type="application/json">[{"id": "overview", "RU": {"title": "Графы: от знакомой ситуации к решению", "story": "Один план кампуса — три задачи: провести кабель, составить порядок работ и рассчитать доставку. Переключите цель и посмотрите, почему ответы различаются.", "steps": ["Назовите объекты: комнаты, работы или состояния программы. Это вершины.", "Назовите связи: кабели, зависимости или переходы. Это рёбра.", "Сформулируйте цель: соединить всё, соблюсти порядок или найти лучший путь."], "transfer": "В реальной работе начните с вопроса и ограничений, а затем выбирайте алгоритм. Например, минимальная стоимость кабелей и кратчайший маршрут доставки требуют разных ответов. В задании вы реализуете шесть требуемых алгоритмов; здесь сначала разберём, зачем нужен каждый.", "theory": "<p>Фрагменты кода в уроке показывают отдельные приёмы. Шесть алгоритмов задания и функцию восстановления пути вы реализуете самостоятельно. В конце урока есть отдельный запускаемый пример BFS для знакомства со списками смежности и очередью.<\/p>"}, "EN": {"title": "Graphs: from a familiar situation to a solution", "story": "One campus plan, three tasks: install cables, schedule work and plan a delivery. Switch the objective and see why the answers differ.", "steps": ["Identify the objects: rooms, tasks or program states. These are vertices.", "Identify the links: cables, dependencies or transitions. These are edges.", "State the objective: connect everything, respect an order or find a best route."], "transfer": "In practice, start with the question and constraints, then choose an algorithm. A cheap cable layout and a shortest delivery route ask for different answers. The assignment requires six methods; first understand what each is for.", "theory": "<p>Code fragments illustrate individual techniques. Implement the six assignment algorithms and route reconstruction yourself. A separate runnable BFS example at the end demonstrates adjacency lists and a queue.<\/p>"}, "lab": "overview", "quiz": {"RU": {"question": "Что нужно изменить в первую очередь, если цель задачи поменялась?", "options": ["Формулировку результата и выбор алгоритма", "Всегда строить остов для любого вопроса о графе", "Сохранить прежний алгоритм, изменив только источник"], "feedback": "Одного и того же графа недостаточно: цель определяет, какой ответ считать правильным."}, "EN": {"question": "What should you reconsider first when the goal changes?", "options": ["The required result and algorithm", "Always build an MST for any graph question", "Keep the same algorithm and only change the source"], "feedback": "A graph alone is insufficient: the objective determines which answer is correct."}, "answer": 0}, "code": "", "book": null, "videos": []}, {"id": "model", "RU": {"title": "Как читать граф и хранить его в программе", "story": "На схеме комнаты обозначены числами. Линия означает доступный переход, стрелка — переход только в одну сторону, число на ребре — его стоимость. Переключите вид графа и проговорите, что изменилось в модели.", "steps": ["Список рёбер отвечает на вопрос «какие связи существуют?».", "Список смежности отвечает на вопрос «куда можно перейти из этой вершины?».", "ID ребра сохраняет связь между исходной строкой входа и результатом алгоритма."], "transfer": "В программе навигации из комнаты нужно быстро получить соседние комнаты, поэтому удобен список смежности. В задании сохраняйте номер исходной строки edges[i], даже если позже сортируете рёбра. Работу со списками можно проследить в отдельном BFS-примере в конце урока.", "theory": "<p>Здесь n — число вершин, m — число входных рёбер.<\/p>\n<p class=\"lead\">Сначала определите направление рёбер, смысл веса и состав ответа. Эти решения должны быть видны в структурах данных.<\/p>\n<p>Вершины задания имеют номера от 0 до n−1. Строка <code>edges[i]<\/code> задаёт ребро с исходным ID i. Этот ID не меняется при сортировке, помещении в очередь или построении обратного графа. Для взвешенного ребра храните <code>from<\/code>, <code>to<\/code>, <code>weight<\/code> и <code>id<\/code>.<\/p>\n<h2>Список смежности<\/h2><p>Для каждого v храните исходящие рёбра. В ориентированном графе добавляется одна запись. В неориентированном графе добавляются две ориентированные записи с одним ID: u→v и v→u. Это две записи одного ребра, а не два выбранных ребра леса. Петля не может попасть в остов. Параллельные рёбра сохраняйте отдельно.<\/p>\n<p>Список смежности занимает O(n+m) памяти. Матрица смежности занимает O(n²): для 100000 вершин она не подходит. Обход соседей в списках даёт O(n+m), если каждое ребро просматривается ограниченное число раз.<\/p>\n<h2>Ограничения задания<\/h2><p>0 ≤ n ≤ 100000; для dag требуется n ≥ 1. Число рёбер или операций DSU не превышает 250000. Вес: от −1000000000 до 1000000000. Концы рёбер и source корректны; для n=0 рёбра и операции пусты. Обрабатывать повреждённый JSON в алгоритмах не требуется.<\/p><h2>Типы и сравнения<\/h2><p>Номер вершины и отдельный вес в пределах задания помещаются в int, а сумма весов может выйти за его пределы. Например, три ребра по 1000000000 дают 3000000000. В Java используйте long для стоимости и Long[] для расстояний с null. Сравнивайте веса через Long.compare, а не вычитанием. Для воспроизводимости можно сравнивать равные по весу рёбра по ID. Задание допускает и другие корректные оптимумы.<\/p>\n<p>При чтении строки i сохраните id=i в своей записи ребра. Сортируйте копию списка, чтобы исходный массив оставался доступен по ID. При построении обратного графа поменяйте направление, сохранив ID исходного ребра.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.List и java.util.ArrayList. Вершины имеют номера 0, 1, 2."}, "EN": {"title": "Reading a graph and storing it in a program", "story": "Rooms are numbered on the diagram. A line represents an available link, an arrow makes it one-way, and a number gives its cost. Switch the graph model and describe what changed.", "steps": ["An edge list answers “which links exist?”.", "An adjacency list answers “where can I go from this vertex?”.", "An edge ID connects an original input row to the algorithm’s result."], "transfer": "Navigation software needs quick access to neighbouring rooms, so an adjacency list is useful. Preserve the original row index edges[i] even when sorting edges. The separate BFS example at the end of the lesson demonstrates these lists in use.", "theory": "<p>Here n is the number of vertices and m the number of input edges.<\/p>\n<p class=\"lead\">Decide the edge direction, the meaning of the weight and the required output before choosing data structures.<\/p>\n<p>Assignment vertices are 0..n−1. The row <code>edges[i]<\/code> has original edge ID i. Sorting, queue insertion and transposition must not change it. A weighted edge stores <code>from<\/code>, <code>to<\/code>, <code>weight<\/code> and <code>id<\/code>.<\/p>\n<h2>Adjacency lists<\/h2><p>Store outgoing edges for each vertex. A directed edge contributes one entry. An undirected edge contributes entries u→v and v→u with the same original ID. These are two representations of one edge, not two selected forest edges. A self-loop cannot belong to a forest. Keep parallel edges as separate candidates.<\/p>\n<p>Adjacency lists use O(n+m) memory. An adjacency matrix uses O(n²), which is unsuitable for 100000 vertices. Traversal is O(n+m) when each stored edge is examined a bounded number of times.<\/p>\n<h2>Assignment limits<\/h2><p>0 ≤ n ≤ 100000; dag requires n ≥ 1. There are at most 250000 edges or DSU operations. Weights range from −1000000000 to 1000000000. Endpoints and source are valid; edges and operations are empty for n=0. Algorithm implementations need not handle malformed JSON.<\/p><h2>Numeric types and comparisons<\/h2><p>A vertex index and a single permitted weight fit int; a total may not. Three edges of weight 1000000000 sum to 3000000000. Use long for Java totals and Long[] for nullable distances. Compare weights using Long.compare rather than subtraction. You may break weight ties by ID for reproducibility; the assignment also accepts other valid optima.<\/p>\n<p>When reading row i, retain id=i in your edge record. Sort a copy of the list so that the original array remains available for ID lookup. When building the transpose, reverse the direction while retaining the original edge ID.<\/p>\n", "code_context": "Method-body fragment; import java.util.List and java.util.ArrayList. The vertices are 0, 1, 2."}, "lab": "model", "quiz": {"RU": {"question": "Ребро было третьим во входе, а после сортировки стало первым. Какой у него ID?", "options": ["Его нужно создать заново", "2", "0"], "feedback": "Нумерация начинается с нуля. ID относится к исходной строке, а не к позиции после сортировки."}, "EN": {"question": "An edge was third in the input and first after sorting. What is its ID?", "options": ["Assign a new one", "2", "0"], "feedback": "IDs are zero-based original row numbers, not sorted positions."}, "answer": 1}, "code": "int n = 3;\nList<List<Integer>> neighbours = new ArrayList<>();\nfor (int v = 0; v < n; v++) neighbours.add(new ArrayList<>());\nneighbours.get(0).add(2);\nneighbours.get(2).add(0);\nSystem.out.println(neighbours.get(0));\nSystem.out.println(neighbours.get(2));", "book": ["20.1", 549, 571, "40graphs"], "videos": [{"id": "7fujbpJ0LB4", "title": "Depth First Search Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/7fujbpJ0LB4/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Создайте список смежности для трёх вершин. Добавьте неориентированное ребро 0–2 и выведите соседей вершин 0 и 2. Какие две записи нужны для одного ребра?", "explanation": ["Для каждой вершины создаём отдельный пустой список.", "Записи 0→2 и 2→0 позволяют пройти по неориентированному ребру в обе стороны.", "Вершина 1 остаётся с пустым списком. Добавьте второе ребро 1–2 и проверьте новые списки."]}, "EN": {"task": "Create adjacency lists for three vertices. Add the undirected edge 0–2 and print the neighbours of 0 and 2. Which two entries represent this one edge?", "explanation": ["Create a separate empty list for each vertex.", "Entries 0→2 and 2→0 allow traversal in both directions along the undirected edge.", "Vertex 1 keeps an empty list. Add edge 1–2 and check the updated lists."]}, "output": "[2]\n[0]"}}, {"id": "dsu", "RU": {"title": "DSU: какие группы уже связаны?", "story": "В учебной группе создаются команды. Сначала каждый работает отдельно. Затем две команды объединяются для совместного проекта. Важно быстро узнать, находятся ли два человека уже в одной команде. Выберите две вершины и объедините их; затем повторите ту же связь.", "steps": ["При объединении разных групп их число уменьшается на один.", "Повторная связь внутри одной группы ничего не меняет.", "DSU хранит представителя группы; сжатие пути ускоряет последующие поиски."], "transfer": "В сеть по одному добавляют соединения между компьютерами. Компьютеры — вершины, новые соединения — операции union. После каждого добавления DSU отвечает, сколько отдельных групп осталось и как велика крупнейшая. Это и есть два числа состояния в задании. Удаления связей здесь не рассматриваются.", "theory": "\n<p class=\"lead\">DSU поддерживает разбиение вершин на непересекающиеся множества. find(v) возвращает представителя множества; union(a,b) объединяет два множества.<\/p>\n<p>В начале каждая вершина является своим корнем: parent[v]=v, size[v]=1. Количество компонент равно n; наибольшая имеет размер 1, а при n=0 - 0. Размер имеет смысл у корня. Вызов union сначала находит оба корня. Если они совпадают, ничего менять не нужно: это относится и к повторной связи, и к объединению вершины с собой.<\/p>\n<h2>Сжатие пути и объединение по размеру<\/h2><p>В двухпроходном варианте find сначала доходит до корня, затем повторно проходит тот же путь и перенаправляет посещённые вершины прямо к корню. Переменная next сохраняет старого родителя до изменения parent[v]. При объединении подвесьте меньший корень к большему, прибавьте размер меньшей компоненты и уменьшите счётчик ровно на один. Не считайте rank размером, если выберете объединение по рангу.<\/p>\n\n<h2>Почему это корректно<\/h2><p>Инвариант: деревья parent задают текущее разбиение на компоненты; size[root] равен числу вершин компоненты. Сжатие меняет форму дерева, но не его корень и не состав множества. Объединение разных корней соединяет ровно две компоненты и не затрагивает остальные. Поэтому после каждой операции сохранённые components и largest описывают текущий граф.<\/p>\n<p><strong>Сложность:<\/strong> O(n+q α(n)) амортизированного времени со сжатием пути и балансировкой. Память DSU O(n), а вместе с массивом всех q ответов - O(n+q). Это не обещание константного времени для каждого отдельного find. Обычный DSU не поддерживает удаление произвольного ребра: для такой задачи нужна другая организация вычислений.<\/p>\n<p>В задании верните массив состояний после операций, без начального состояния. Сохраняйте два числа в каждой строке ответа, а не ссылку на один постоянно изменяемый массив.<\/p>\n<p>В оценке q — число объединений, α(n) — очень медленно растущая обратная функция Аккермана.<\/p>", "code_context": "Фрагмент внутри метода; импортируйте java.util.Arrays для вывода массива. Корень уже известен, выполняется только один шаг второго прохода."}, "EN": {"title": "DSU: which groups are already connected?", "story": "Students form project teams. Initially everyone works alone; later, two teams merge. You need to tell whether two people already belong to the same team. Select two vertices and merge their teams, then repeat the same link.", "steps": ["Merging two different groups reduces their count by one.", "A repeated link within one group changes nothing.", "DSU stores a representative; path compression speeds up later searches."], "transfer": "A network receives new computer-to-computer links. Computers are vertices; each added link is a union operation. After each addition, DSU reports the number of groups and the largest group size: the two state values required by the assignment. Link deletion is outside this model.", "theory": "\n<p class=\"lead\">DSU maintains a partition of vertices into disjoint sets. find(v) returns the representative of a set; union(a,b) merges two sets.<\/p>\n<p>Initially each vertex is its own root: parent[v]=v and size[v]=1. There are n components; largest is 1, or 0 when n=0. Component size is meaningful at a root. Union first finds both roots. If they coincide, nothing changes; this covers repeated links and self-unions.<\/p>\n<h2>Path compression and union by size<\/h2><p>A two-pass find walks to the root, then follows the original path again from the starting vertex and points each visited vertex directly at the root. The variable next saves the old parent before overwriting parent[v]. Union attaches the smaller root to the larger one, adds the smaller size and reduces the component count exactly once. If you use rank instead, maintain sizes separately.<\/p>\n\n<h2>Correctness<\/h2><p>Invariant: parent trees represent the current components and size[root] counts their vertices. Compression changes the tree shape without changing its root or membership. Merging different roots joins exactly two components and leaves every other component unchanged. Thus components and largest describe the graph after each operation.<\/p>\n<p><strong>Complexity:<\/strong> O(n+q α(n)) amortised time with compression and balancing. DSU storage is O(n); including q returned states it is O(n+q). This does not claim constant worst-case time for every individual find. Ordinary DSU does not support arbitrary edge deletion.<\/p>\n<p>For the assignment, return a state after each operation, without an initial state. Store a new pair of numbers for each answer, rather than repeatedly storing a reference to one mutable array.<\/p>\n<p>In this bound, q counts union operations and α(n) is the very slowly growing inverse Ackermann function.<\/p>", "code_context": "Method-body fragment; import java.util.Arrays to print the array. The root is already known; this is one step of the second pass."}, "lab": "dsu", "quiz": {"RU": {"question": "После связей 0–1 и 1–2 добавляем 0–2. Число групп уменьшится?", "options": ["Да, каждое добавленное ребро уменьшает счётчик", "Число групп то же, но размер группы станет 4", "Нет, обе вершины уже в одной группе"], "feedback": "0 и 2 уже связаны через 1. Новое ребро не объединяет разные компоненты."}, "EN": {"question": "After links 0–1 and 1–2, does adding 0–2 reduce the group count?", "options": ["Yes; every added edge reduces the count", "The count stays, but the group size becomes 4", "No; both vertices already share a group"], "feedback": "0 and 2 are already connected through 1, so no distinct components merge."}, "answer": 2}, "code": "int[] parent = {0, 0, 1, 2};\nint v = 3, root = 0;\nint next = parent[v];\nparent[v] = root;\nv = next;\nSystem.out.println(Arrays.toString(parent));\nSystem.out.println(v);", "book": ["19.3–19.4", 527, 549, "15uf"], "videos": [{"id": "ibjEGG7ylHk", "title": "Union Find Introduction", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/ibjEGG7ylHk/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "0jNmHPfA_yE", "title": "Union Find - Union and Find Operations", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/0jNmHPfA_yE/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "VHRhJWacxis", "title": "Union Find Path Compression", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/VHRhJWacxis/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Даны parent=[0,0,1,2], текущая вершина v=3 и уже найденный корень root=0. Напишите один шаг сжатия пути: перенаправьте v к корню, затем перейдите к её прежнему родителю. Не пишите весь find.", "explanation": ["next сохраняет 2 до изменения массива.", "parent[3]=0 сокращает путь для вершины 3; остальные ссылки пока не меняются.", "v=next продолжает проход по прежнему пути. Если сначала перезаписать parent[v], старую ссылку можно потерять."]}, "EN": {"task": "Given parent=[0,0,1,2], current vertex v=3 and an already known root=0, write one compression step: point v to the root, then move to its former parent. Do not write the entire find operation.", "explanation": ["next retains 2 before the array is changed.", "parent[3]=0 shortens the path from vertex 3; the other links remain unchanged for now.", "v=next continues along the original path. Overwriting parent[v] first could lose that link."]}, "output": "[0, 0, 1, 0]\n2"}}, {"id": "mst", "RU": {"title": "Остов или маршрут: какую стоимость уменьшаем?", "story": "Нужно соединить пять комнат кабелем. За каждое проложенное ребро вы платите один раз. Другая задача — пройти из комнаты 0 в комнату 4 с наименьшей стоимостью. Сравните выделенные связи: одинаковые веса не означают одинаковую задачу.", "steps": ["Остов соединяет все вершины компоненты без циклов.", "Маршрут соединяет выбранные начало и конец.", "Краскал и Прим решают первую задачу; кратчайшие пути — вторую."], "transfer": "Нужно проложить кабели между зданиями. Вершины — здания, рёбра — разрешённые трассы, веса — стоимость прокладки. Остов выбирает самый дешёвый набор, соединяющий здания. При этом дерево не имеет резервных связей: требования отказоустойчивости потребуют более сложной модели. В задании верните стоимость, ID выбранных рёбер и число компонент.", "theory": "\n<p class=\"lead\">Выберите рёбра минимальной суммарной стоимости так, чтобы внутри каждой компоненты исходного неориентированного графа все вершины были соединены без циклов.<\/p>\n<p>Для связного графа результат является деревом. Для несвязного - лесом, включая изолированные вершины. При c компонентах лес содержит n−c рёбер. Для n=0 стоимость и число компонент равны нулю. Отрицательный вес допустим: он означает снижение общей стоимости. Даже петлю с отрицательным весом нельзя включать в остов, поскольку она не соединяет разные вершины и образует цикл.<\/p>\n<h2>Свойство разреза<\/h2><p>Разрез делит вершины на две части. Если он не пересекает уже выбранные рёбра, одно из самых лёгких рёбер через этот разрез можно безопасно добавить к некоторому оптимальному остову, содержащему текущие выбранные рёбра. При равных весах безопасное ребро не обязано входить во все оптимальные остовы.<\/p>\n<p>Обоснование заменой: возьмите оптимальный остов без выбранного лёгкого ребра e. Добавление e создаёт цикл. В этом цикле есть другое ребро f через тот же разрез; его вес не меньше веса e. Замените f на e: связность сохранится, стоимость не вырастет. Для леса рассуждение применяется отдельно к каждой исходной компоненте.<\/p>\n<h2>Почему нужны два алгоритма<\/h2><p>Краскал выбирает рёбра глобально по весу и отсеивает циклы через DSU. Прим расширяет одно построенное дерево через минимальное ребро его границы. Они могут выбрать разные ID, но должны вернуть одинаковую оптимальную стоимость и одинаковое количество компонент.<\/p>\n<p>Не путайте стоимость сети со стоимостью пути. Остов может вынуждать длинный обход между двумя вершинами, хотя в исходном графе есть более короткая прямая связь. В задаче маршрутов нужен алгоритм кратчайшего пути.<\/p>\n"}, "EN": {"title": "Spanning tree or route: which cost are we minimising?", "story": "You must connect five rooms with cables and pay for each installed link once. A different task is to travel from room 0 to room 4 as cheaply as possible. Compare the highlighted links: the same weights do not imply the same objective.", "steps": ["A spanning tree connects every vertex of a component without cycles.", "A route connects a chosen source and target.", "Kruskal and Prim solve the first problem; shortest-path algorithms solve the second."], "transfer": "Suppose buildings need cable connections. Vertices are buildings, edges are permitted cable routes, and weights are installation costs. An MST chooses the cheapest set connecting them. A tree provides no redundant links; reliability requirements need a richer model. Return cost, selected edge IDs and component count in the assignment.", "theory": "\n<p class=\"lead\">Select edges of minimum total cost so that every original connected component remains connected without cycles.<\/p>\n<p>A connected graph produces a tree; a disconnected graph produces a forest, including isolated vertices. With c components the forest has n−c edges. For n=0, both cost and component count are zero. Negative weights are valid discounts. Even a negative self-loop cannot be selected: it connects no distinct vertices and forms a cycle.<\/p>\n<h2>The cut property<\/h2><p>A cut partitions the vertices into two sets. If the cut respects the selected edges, a lightest edge crossing it is safe for some optimum containing those selected edges. When weights tie, a safe edge need not belong to every optimum.<\/p>\n<p>Exchange argument: take an optimum without the light edge e. Adding e creates a cycle. That cycle contains another edge f crossing the same cut, with weight at least that of e. Replace f by e; connectivity remains and cost does not increase. For a forest, apply the argument within each original connected component.<\/p>\n<h2>Why implement both methods?<\/h2><p>Kruskal examines globally sorted edges and uses DSU to reject cycles. Prim grows one tree using its cheapest boundary edge. Selected IDs may differ, but optimum costs and component counts must agree.<\/p>\n<p>Network cost is not path cost. A spanning tree may force a long detour between two vertices even when the original graph has a shorter direct connection. Routing requires a shortest-path objective.<\/p>\n"}, "lab": "overview", "quiz": {"RU": {"question": "Почему нельзя использовать сумму весов остова как расстояние от 0 до 4?", "options": ["Остов оплачивает связи всей компоненты", "Остов обязан содержать кратчайший путь между каждой парой", "Нужно просто разделить вес остова на число рёбер"], "feedback": "У этих задач разные объекты оптимизации: вся сеть и один путь."}, "EN": {"question": "Why is a forest’s total weight not the distance from 0 to 4?", "options": ["It pays for links spanning the entire component", "An MST must preserve a shortest path for every pair", "Divide the tree weight by its edge count"], "feedback": "The optimised objects differ: the entire network versus one route."}, "answer": 0}, "code": "", "book": ["21.1", 586, 608, "43mst"], "videos": []}, {"id": "kruskal", "RU": {"title": "Краскал: покупаем дешёвые связи без циклов", "story": "Для пяти комнат подготовили несколько вариантов кабеля. Рассматривайте предложения от дешёвых к дорогим. Перед покупкой ответьте: это ребро действительно соединит две разные части сети или только замкнёт уже существующий путь?", "steps": ["Упорядочьте кандидаты по весу.", "Если концы в разных компонентах, связь полезна: примите её и объедините компоненты.", "Если концы уже связаны, ребро создаст цикл: пропустите его."], "transfer": "В задаче проектирования сети это последовательный выбор наиболее выгодных допустимых соединений. В задании для проверки компонент используйте собственный DSU и сохраните исходные ID. Попробуйте специально неверное решение на схеме: обратная связь объяснит причину.", "theory": "\n<p class=\"lead\">Рассматривайте рёбра в неубывающем порядке веса. Принимайте ребро только тогда, когда его концы принадлежат разным деревьям текущего леса.<\/p>\n<p>Создайте отдельный DSU для этого вызова и пустой список выбранных ID. После сортировки исходные ID должны остаться у рёбер. Успешный union означает, что ребро соединяет разные компоненты и не создаёт цикл. При неуспешном union ребро пропускается. Не останавливайтесь после n−1 попыток: часть рёбер будет отвергнута, а исходный граф может быть несвязным.<\/p>\n\n<h2>Разбор примера<\/h2><p>На схеме пять вершин. При равных весах рассматриваем меньший ID первым. Порядок рёбер: 2, 1, 6, 0, 3, 5, 4. Принимаем ID 2, 1, 6; ID 0 пропускаем, потому что 0 и 1 уже связаны через 2. Затем принимаем ID 3. Рёбра 5 и 4 уже замыкают циклы. Итог: 1+2+2+5=10, четыре ребра и одна компонента: 5−1=4.<\/p>\n<h2>Инвариант и сложность<\/h2><p>Выбранные рёбра образуют лес, расширяемый до оптимального остовного леса. Перед добавлением ребра компонента DSU задаёт допустимый разрез, а рассматриваемое ребро имеет минимальный доступный вес через него. Свойство разреза сохраняет оптимальность. После обработки всех рёбер вершины каждой исходной компоненты соединены.<\/p>\n<p>Сортировка O(m log(m+1)), инициализация O(n), операции DSU амортизированно O(m α(n)). Итоговая граница задания O(n+m log(m+1)); память O(n+m). Возвращайте cost как long, edge_ids как исходные ID, components как число исходных компонент, совпадающее с конечным счётчиком DSU.<\/p>\n", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Рассматривается непустой массив рёбер."}, "EN": {"title": "Kruskal: buy cheap links without forming cycles", "story": "Several cable links are available for five rooms. Examine offers from cheapest to most expensive. Before buying one, decide whether it joins two separate network parts or merely closes an existing path.", "steps": ["Order candidate edges by weight.", "If endpoints belong to different components, accept the link and merge the components.", "If the endpoints are already connected, skip the cycle-forming edge."], "transfer": "In network design, this selects the cheapest admissible connections. In the assignment, use your own DSU for component checks and preserve original IDs. Try an incorrect decision in the diagram: feedback explains why it fails.", "theory": "\n<p class=\"lead\">Examine edges in nondecreasing weight order. Accept an edge only if its endpoints belong to different trees of the current forest.<\/p>\n<p>Create a fresh DSU and an empty selected-ID list. Sorting must preserve the IDs stored in edge objects. A successful union means the edge connects distinct components without creating a cycle. A failed union rejects the edge. Do not stop after n−1 examined candidates: some are rejected and the graph may be disconnected.<\/p>\n\n<h2>Worked example<\/h2><p>The diagram has five vertices. Break weight ties by smaller ID in this example. The examination order is 2, 1, 6, 0, 3, 5, 4. Accept IDs 2, 1, 6; skip ID 0 because 0 and 1 are already connected through 2. Then accept ID 3. Edges 5 and 4 close cycles. The result costs 1+2+2+5=10, with four edges and one component: 5−1=4.<\/p>\n<h2>Invariant and complexity<\/h2><p>The selected forest can be extended to an optimum. Before an accepted edge is added, a DSU component defines a cut respected by the forest; the examined edge is a lightest available crossing edge. The cut property preserves optimality. After all edges have been examined, every original component is spanned.<\/p>\n<p>Sorting costs O(m log(m+1)), initialisation O(n), and DSU operations O(m α(n)) amortised. The assignment bound is O(n+m log(m+1)) time and O(n+m) memory. Return long cost, original edge_ids and components, which equals the final DSU count.<\/p>\n", "code_context": "Method-body fragment with no additional imports. The edge array is nonempty."}, "lab": "kruskal", "quiz": {"RU": {"question": "Самое дешёвое оставшееся ребро замыкает цикл. Что делать?", "options": ["Начать сортировку заново", "Пропустить", "Взять, потому что оно дешёвое"], "feedback": "Дешевизна не отменяет условие леса. Уже связанные вершины не нужно соединять повторно."}, "EN": {"question": "The cheapest remaining edge closes a cycle. What should happen?", "options": ["Restart sorting", "Skip it", "Take it because it is cheap"], "feedback": "Low cost does not override the forest constraint; connected vertices need no additional link."}, "answer": 1}, "code": "int[][] edges = {{0, 1, 4}, {0, 2, 2}, {1, 2, 1}};\nint bestId = 0;\nfor (int id = 1; id < edges.length; id++) {\n    if (edges[id][2] < edges[bestId][2]) bestId = id;\n}\nSystem.out.println(bestId);", "book": ["21.2", 591, 613, "43mst"], "videos": [{"id": "JZBQLXgSGfs", "title": "Union Find Kruskal's Algorithm", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/JZBQLXgSGfs/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Строки edges имеют вид [u,v,weight]. Найдите ID самого дешёвого ребра, не переставляя строки. При равных весах оставьте меньший ID. Это упражнение на исходные ID, а не на построение остова.", "explanation": ["Здесь ID — номер строки; edges[id][2] — вес. Массив непустой, поэтому можно начать с ID 0.", "Строгое сравнение < сохраняет более ранний ID при равенстве весов.", "Минимальное ребро имеет ID 2 и вес 1. В Краскале одного минимума недостаточно: нужны порядок всех кандидатов и проверка компонент."]}, "EN": {"task": "Each edges row is [u,v,weight]. Find the cheapest edge ID without rearranging rows. Keep the smaller ID on a weight tie. Practise original IDs here, rather than constructing an MST.", "explanation": ["Here the row index is the ID, and edges[id][2] is the weight. The array is nonempty, so ID 0 is a valid initial choice.", "Strict comparison < retains the earlier ID on equal weights.", "The minimum edge has ID 2 and weight 1. Kruskal needs more than one minimum: all candidates in order and connectivity checks."]}, "output": "2"}}, {"id": "prim", "RU": {"title": "Прим: расширяем уже подключённую часть", "story": "Представьте, что электричество уже подведено к комнате 0. Теперь нужно постепенно подключить остальные комнаты. Смотреть на все рёбра сразу не обязательно: интересуют связи от уже подключённой части к новым вершинам. Выберите следующую связь.", "steps": ["Отметьте уже подключённые вершины.", "Найдите самое дешёвое ребро их границы.", "Подключите новую вершину и обновите список кандидатов."], "transfer": "При подключении зданий удобно следить за границей уже соединённой части сети: какой допустимый кабель подключит новое здание дешевле всего? Очередь с приоритетом хранит кандидатов. В задании после завершения одной компоненты начните со следующей непосещённой вершины.", "theory": "\n<p class=\"lead\">Начните с одной вершины и каждый раз присоединяйте новую вершину через самое дешёвое ребро границы уже построенного дерева.<\/p>\n<p>Для каждой исходной компоненты нужен новый старт. Отметьте стартовую вершину, увеличьте components и добавьте её исходящие рёбра в очередь с приоритетом. Извлекая ребро, проверьте его конечную вершину: если она уже посещена, кандидат устарел. Иначе примите ребро, отметьте новую вершину и добавьте её исходящие рёбра к непосещённым вершинам.<\/p>\n\n<h2>Почему нужна проверка после извлечения<\/h2><p>Одну вершину могут предлагать несколько рёбер. После принятия лучшего остальные записи остаются в очереди. Удалять их заранее необязательно: достаточно пропускать записи с уже посещённым концом. Поэтому эта версия называется ленивой. Посещённость нужно проверять при извлечении, а не только при добавлении.<\/p>\n<p>На схеме стартуем из 0 и принимаем ID 1, 2, 3, 6. Общая стоимость после каждого шага: 2, 3, 8, 10. Результат совпадает с Краскалом по стоимости, хотя порядок выбора иной. Отдельно проверьте в своих тестах изолированную вершину: она добавляет одну компоненту и ни одного ребра. В исходном графе схемы таких вершин нет.<\/p>\n<h2>Корректность и сложность<\/h2><p>Инвариант: принятые рёбра образуют дерево посещённых вершин текущей компоненты и расширяемы до оптимума. После удаления устаревших записей минимальный кандидат является лёгким ребром разреза «посещённые / непосещённые» этой компоненты. Свойство разреза обосновывает выбор.<\/p>\n<p>Ленивая очередь может хранить O(m) записей, поэтому время O(n+m log(m+1)), память O(n+m). Граница O((n+m) log(n+1)) относится к варианту с индексируемой очередью и одной актуальной записью на вершину; для этого варианта используйте границу ленивой версии. Прим должен иметь свою реализацию, а не вызывать Краскала.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.PriorityQueue. Буква L задаёт значения типа long."}, "EN": {"title": "Prim: extend the connected part", "story": "Room 0 already has power. Extend the connected area to the remaining rooms. You need not inspect every edge equally: consider links from the connected part to new vertices. Choose the next link.", "steps": ["Mark the connected vertices.", "Choose the cheapest edge on their boundary.", "Connect its new endpoint and update the candidates."], "transfer": "When connecting buildings, track the boundary of the connected part: which permitted cable adds a new building at the lowest cost? A priority queue stores candidates. In the assignment, restart from an unvisited vertex after completing each component.", "theory": "\n<p class=\"lead\">Start from one vertex and repeatedly attach an unvisited vertex through the cheapest edge leaving the current tree.<\/p>\n<p>Restart for every original connected component. Mark the start, increment components and add its outgoing edges to a priority queue. When removing an edge, inspect its destination: if already visited, the candidate is stale. Otherwise accept the edge, mark the new vertex and enqueue its edges to unvisited destinations.<\/p>\n\n<h2>Why check again on removal?<\/h2><p>Several edges may offer the same vertex. After its best candidate is accepted, other entries remain in the heap. You need not remove them immediately: skip entries whose destination is already visited. This is the lazy version. Checking only when inserting an edge is insufficient.<\/p>\n<p>Start at 0 in the diagram and accept IDs 1, 2, 3, 6. Running totals are 2, 3, 8, 10. The optimum cost agrees with Kruskal, although the selection order differs. Separately test an isolated vertex: it adds one component and no edge. The displayed graph contains no isolated vertices.<\/p>\n<h2>Correctness and complexity<\/h2><p>Invariant: accepted edges form a tree spanning the currently visited portion of this component and extend to an optimum. After stale entries are removed, the minimum candidate is a light edge of the visited/unvisited cut. The cut property justifies accepting it.<\/p>\n<p>A lazy heap may hold O(m) entries: time is O(n+m log(m+1)) and memory O(n+m). The O((n+m) log(n+1)) bound describes an indexed heap with one active entry per vertex. Use the lazy bound for this variant. Prim must have a separate implementation rather than calling Kruskal.<\/p>\n", "code_context": "Method-body fragment; import java.util.PriorityQueue. The L suffix creates long values."}, "lab": "prim", "quiz": {"RU": {"question": "Ребро дешёвое, но оба конца уже подключены. Нужно ли его добавлять?", "options": ["Да, если это минимум оставшейся очереди", "Да, если это ребро ещё не добавляли в дерево", "Нет, новая вершина не появится"], "feedback": "Такой кандидат устарел. Прим расширяет дерево, а не накапливает все дешёвые рёбра."}, "EN": {"question": "An edge is cheap, but both endpoints are already connected. Add it?", "options": ["Yes, if it is the remaining queue minimum", "Yes, if this edge has not been selected before", "No; it adds no new vertex"], "feedback": "That candidate is stale. Prim grows a tree rather than accumulating every cheap edge."}, "answer": 2}, "code": "PriorityQueue<Long> offers = new PriorityQueue<>();\noffers.add(9L);\noffers.add(3L);\noffers.add(7L);\nSystem.out.println(offers.remove());\nSystem.out.println(offers.peek());", "book": ["21.2", 591, 613, "43mst"], "videos": [{"id": "jsmMtJpPnhU", "title": "Prim's Minimum Spanning Tree Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/jsmMtJpPnhU/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Добавьте предложения стоимости 9, 3 и 7 в очередь с приоритетом. Извлеките минимум, затем посмотрите следующий минимум, не удаляя его. Предскажите оба числа до запуска.", "explanation": ["Очередь с естественным порядком Long возвращает наименьшее число.", "remove() возвращает и удаляет 3; peek() показывает 7, оставляя его в очереди.", "Для Прима кандидат должен также хранить концы и ID ребра. Одного веса недостаточно, чтобы проверить новую вершину."]}, "EN": {"task": "Insert offers costing 9, 3 and 7 into a priority queue. Remove the minimum, then inspect the next minimum without removing it. Predict both values before running.", "explanation": ["A queue using the natural Long order returns the smallest value.", "remove() returns and removes 3; peek() reports 7 while retaining it.", "A Prim candidate also needs endpoints and an edge ID. A weight alone cannot identify the new vertex."]}, "output": "3\n7"}}, {"id": "dfs", "RU": {"title": "DFS: пройти ветку и вернуться к незавершённому", "story": "Вы проверяете зависимости программы. Дойдите по одной цепочке до конца, затем вернитесь к месту, где остались непроверенные связи. Смотрите на стек: он показывает, какую работу обход ещё не закончил.", "steps": ["Обнаружить вершину — ещё не значит завершить её.", "Завершение наступает после обработки всех её исходящих связей.", "Для глубокого графа храните вершину и позицию следующего соседа в явном стеке."], "transfer": "Так обходят структуры каталогов и графы зависимостей; похожий порядок нужен для SCC и топологической сортировки. В задании важно не перепутать порядок обнаружения с порядком завершения. В отдельном учебном BFS-примере очередь устроена иначе — сравните поведение двух структур.", "theory": "\n<p class=\"lead\">Для Косарайю и топологической сортировки важен момент завершения вершины. Стек должен сохранять незаконченный обход, а не только список найденных вершин.<\/p>\n<p>Рекурсивный DFS запоминает в стеке вызовов вершину и позицию следующего соседа. На цепочке из 100000 вершин это может переполнить стек. В явной реализации вершины находятся в ArrayDeque, а cursor[v] хранит номер следующего ещё не просмотренного соседа. У вершины три состояния: 0 - не посещена; 1 - активна и находится в текущем стеке; 2 - завершена.<\/p>\n<h2>Одна итерация<\/h2><ol><li>Посмотрите на верхний элемент стека, не удаляя его.<\/li><li>Если все соседи обработаны, удалите вершину, пометьте её завершённой и добавьте в finish.<\/li><li>Иначе получите следующего соседа и сразу увеличьте cursor.<\/li><li>Соседа в состоянии 0 активируйте и положите в стек. Ребро в состояние 1 отмечает цикл. Состояние 2 не требует повторного обхода.<\/li><\/ol>\n<p>Без cursor повторное начало списка соседей может увеличить время до квадратичного. Если помечать вершину завершённой сразу после добавления соседей в стек, активный путь будет потерян: такой код не имитирует нужный DFS.<\/p>\n<h2>Смысл finish<\/h2><p>На цепочке 0→1→2 сначала завершается 2, затем 1, затем 0. finish=[2,1,0]. Порядок обнаружения [0,1,2] и порядок завершения - разные последовательности. В Косарайю нужен именно второй. В топологической сортировке при отсутствии циклов нужен его разворот.<\/p>\n<p>Внешний цикл запускает обход из каждой ещё не посещённой вершины. Поэтому изолированные вершины и компоненты, недостижимые из первой вершины, не теряются. Время O(n+m), память O(n+m) вместе со списками смежности; дополнительное состояние обхода O(n). Проверка циклов не мешает использовать finish в первом проходе Косарайю: исходный граф там вправе иметь циклы.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.ArrayDeque. Он показывает порядок извлечения из стека, а не моменты завершения DFS."}, "EN": {"title": "DFS: follow a branch and return to unfinished work", "story": "You are inspecting program dependencies. Follow one chain to its end, then return to where unexplored links remain. Watch the stack: it records traversal work that is still unfinished.", "steps": ["Discovering a vertex does not finish it.", "It finishes after all outgoing links have been processed.", "On deep graphs, explicitly store both the vertex and its next-neighbour position."], "transfer": "This pattern appears in directory traversal and dependency analysis, and supports SCC and topological ordering. Do not confuse discovery and finish order. The separate BFS example uses a queue instead; compare how the two structures behave.", "theory": "\n<p class=\"lead\">Kosaraju and topological ordering need finish events. An explicit stack must preserve suspended traversal progress, not merely discovered vertices.<\/p>\n<p>Recursive DFS remembers a vertex and the position of its next neighbour in the call stack. A chain of 100000 vertices may overflow that stack. Here ArrayDeque stores active vertices and cursor[v] stores the next adjacency-list position. States are 0 = unvisited, 1 = active on the current stack and 2 = finished.<\/p>\n<h2>One iteration<\/h2><ol><li>Inspect the stack top without removing it.<\/li><li>If all neighbours are processed, pop the vertex, mark it finished and append it to finish.<\/li><li>Otherwise read the next neighbour and advance cursor immediately.<\/li><li>Push a state-0 neighbour after activating it. An edge to state 1 marks a cycle. State 2 needs no further traversal.<\/li><\/ol>\n<p>Without cursor, restarting a neighbour scan can make the algorithm quadratic. Marking a vertex finished as soon as its neighbours are pushed loses the active path and does not simulate the required DFS.<\/p>\n<h2>What finish records<\/h2><p>On 0→1→2, vertex 2 finishes first, then 1, then 0: finish=[2,1,0]. Discovery order [0,1,2] is a different sequence. Kosaraju needs finish order; topological ordering reverses it when no cycle exists.<\/p>\n<p>The outer loop starts from every unvisited vertex, preserving isolates and components unreachable from the first start. Time is O(n+m); memory including adjacency lists is O(n+m), with O(n) additional traversal state. Recording a cycle does not prevent using finish in Kosaraju's first pass: its original graph may contain cycles.<\/p>\n", "code_context": "Method-body fragment; import java.util.ArrayDeque. It demonstrates stack removal order, not DFS finish events."}, "lab": "dfs", "quiz": {"RU": {"question": "На цепочке 0→1→2 какая вершина завершится первой?", "options": ["2", "0 — она обнаружена первой", "1 — она соединяет начало с концом"], "feedback": "У 2 нет следующего непроверенного соседа; только после неё могут завершиться 1 и 0."}, "EN": {"question": "On 0→1→2, which vertex finishes first?", "options": ["2", "0, because it was discovered first", "1, because it connects the ends"], "feedback": "Vertex 2 has no unexplored neighbour; only then can 1 and 0 finish."}, "answer": 0}, "code": "ArrayDeque<Integer> pending = new ArrayDeque<>();\npending.push(4);\npending.push(7);\nSystem.out.println(pending.pop());\nSystem.out.println(pending.peek());", "book": ["20.3", 563, 585, "42digraph"], "videos": [{"id": "7fujbpJ0LB4", "title": "Depth First Search Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/7fujbpJ0LB4/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Используйте ArrayDeque как стек. Положите 4, затем 7; извлеките верхний элемент и посмотрите, что осталось сверху. Объясните, почему порядок отличается от очереди.", "explanation": ["push добавляет на вершину стека. Последним добавили 7.", "pop удаляет 7, после чего peek показывает 4 без удаления.", "В DFS стек хранит активные вершины; для правильных завершений нужно также помнить прогресс просмотра соседей."]}, "EN": {"task": "Use ArrayDeque as a stack. Push 4, then 7; pop the top value and inspect the remaining top. Explain why this differs from a queue.", "explanation": ["push adds to the stack top. The last value pushed is 7.", "pop removes 7, after which peek reports 4 without removing it.", "DFS stores active vertices in a stack; correct finish events also require retaining neighbour traversal progress."]}, "output": "7\n4"}}, {"id": "scc", "RU": {"title": "SCC: можно ли вернуться обратно?", "story": "Между модулями программы есть направленные зависимости. Из A можно попасть в B, но есть ли путь назад? Выберите вершину: одним цветом выделятся только те вершины, между которыми есть пути в обе стороны. Затем сожмите каждую такую группу.", "steps": ["Проверьте достижимость в обе стороны.", "Объедините максимальные взаимно достижимые группы.", "Сохраните связи между группами, убрав внутренние рёбра и повторы."], "transfer": "В графе модулей ребро A→B может означать, что A зависит от B. Взаимно зависимые модули образуют SCC: их изменения приходится согласовывать. Конденсация показывает зависимости между такими группами, но не устраняет внутренний цикл. В задании найдите компоненты алгоритмом Косарайю.", "theory": "\n<p class=\"lead\">SCC - максимальное множество вершин, в котором из любой вершины можно попасть в любую другую по направленным путям.<\/p>\n<p>Обычная связность без учёта направления не подходит. Ребро A→B не доказывает возможность вернуться из B в A. Косарайю использует два полных прохода: сначала DFS исходного графа с записью завершений; затем обход транспонированного графа в порядке убывания времени завершения первого прохода. Можно поменять графы местами, но второй обязан быть транспонированным относительно первого.<\/p>\n<h2>Пример<\/h2><p>На схеме рёбра 0→1, 1→2, 2→0, 2→3, 3→4, 4→3; вершина 5 изолирована. Компоненты: A={0,1,2}, B={3,4}, C={5}. В конденсации остаётся A→B, а C изолирована. Если развернуть все стрелки, состав компонент сохранится, а связь между A и B станет B→A. Кнопка «Сжать группы» показывает конденсацию исходного графа.<\/p>\n<h2>Почему второй проход выделяет ровно одну SCC<\/h2><p>Сожмите SCC в вершины: получится DAG. Если в нём есть дуга A→B, максимальное время завершения в A больше максимального времени завершения в B. Во втором проходе по транспонированному графу компонента с наибольшим оставшимся завершением не имеет исходящего пути в другую ещё не отмеченную компоненту. Поэтому обход не выйдет из неё, но достигнет всех её вершин.<\/p>\n<h2>Конденсация в коде<\/h2><p>Метки можно выбрать компактными: 0..k−1. Сгруппируйте вершины по метке и просмотрите исходящие рёбра каждой группы. Инициализируйте seenFrom значением −1, которое не является меткой компоненты. Массив seenFrom[target] запоминает, из какой исходной компоненты уже добавлена пара в target. Проверка target!=from исключает внутренние рёбра. Это удаляет дубликаты за детерминированное O(n+m) без сортировки пар. Альтернатива - хеш-множество пар с ожидаемым O(n+m).<\/p>\n<p>Оба обхода, транспонирование и конденсация занимают O(n+m) времени и памяти. Для n=0 оба массива ответа пусты. В задании метки могут быть любыми неотрицательными числами, если они задают правильное разбиение. Не сравнивайте label-массивы двух решений буквально. В анализе зависимостей SCC обнаруживает взаимозависимую группу; сжатие группы не устраняет её внутренний конфликт расписания.<\/p>\n", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Метки уже даны; это проверка результата, а не реализация Косарайю."}, "EN": {"title": "SCC: can you get back?", "story": "Program modules have directed dependencies. A path leads from A to B, but can you get back? Select a vertex to highlight exactly the vertices mutually reachable with it, then contract each group.", "steps": ["Check reachability in both directions.", "Identify maximal mutually reachable groups.", "Keep links between groups, removing internal edges and duplicate pairs."], "transfer": "In a module graph, A→B may mean that A depends on B. Mutually dependent modules form SCCs, whose changes need coordination. Condensation shows dependencies between these groups without resolving internal cycles. Use Kosaraju to find components in the assignment.", "theory": "\n<p class=\"lead\">An SCC is a maximal set in which every vertex can reach every other vertex using directed paths.<\/p>\n<p>Undirected connectivity is insufficient: A→B does not imply a return path. Kosaraju first runs DFS on the original graph and records finish events. It then traverses the transpose in decreasing first-pass finish order. Starting on the transpose is also valid if the second pass uses the original graph.<\/p>\n<h2>Example<\/h2><p>The diagram contains 0→1, 1→2, 2→0, 2→3, 3→4, 4→3; vertex 5 is isolated. Its SCCs are A={0,1,2}, B={3,4}, C={5}. Condensation retains A→B, with C isolated. Transposing all edges preserves membership and changes A→B to B→A. “Contract the groups” displays condensation of the original graph.<\/p>\n<h2>Why the second pass isolates one SCC<\/h2><p>Contract the SCCs into a DAG. For a condensation edge A→B, the largest finish time in A exceeds the largest finish time in B. In the transpose, the remaining component with largest finish time has no outgoing path into another unassigned component. The next traversal therefore stays inside it and reaches all of its vertices.<\/p>\n<h2>Building condensation<\/h2><p>A possible implementation uses compact labels 0..k−1. Group vertices by label and scan outgoing edges for each group. Initialise seenFrom to −1, which is not a component label. The array seenFrom[target] records which source component has already emitted a pair to target. The condition target!=from excludes internal edges. This removes duplicates in deterministic O(n+m) time without sorting pairs. A hash set of pairs is an alternative with expected O(n+m) time.<\/p>\n<p>The traversals, transpose and condensation use O(n+m) time and memory. For n=0 both output arrays are empty. Assignment labels may be any nonnegative integers defining the correct partition; do not compare two label arrays literally. In dependency analysis, an SCC identifies a mutually dependent group; contracting it does not resolve its internal scheduling conflict.<\/p>\n", "code_context": "Method-body fragment with no additional imports. Labels are given; this checks a result rather than implementing Kosaraju."}, "lab": "scc", "quiz": {"RU": {"question": "Есть путь A→B, но нет пути B→A. Это одна SCC?", "options": ["Да, если убрать направления, они связаны", "Нет: нужен и обратный путь", "Да: достаточно пути хотя бы в одну сторону"], "feedback": "Внутри SCC достижимость должна быть взаимной, а не только односторонней."}, "EN": {"question": "A reaches B, but B cannot reach A. Are they in one SCC?", "options": ["Yes; they connect when directions are ignored", "No; a return path is also required", "Yes; a path in either direction suffices"], "feedback": "SCC membership requires mutual, not one-way, reachability."}, "answer": 1}, "code": "int[] component = {0, 0, 0, 1, 1, 2};\nSystem.out.println(component[0] == component[2]);\nSystem.out.println(component[2] == component[3]);", "book": ["20.5", 576, 598, "42digraph"], "videos": [{"id": "RpgcYiky7uw", "title": "Strongly Connected Components Kosaraju's Algorithm Graph Algorithm", "author": "Tushar Roy - Coding Made Simple", "thumbnail": "https://i.ytimg.com/vi/RpgcYiky7uw/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Метки компонент уже вычислены: [0,0,0,1,1,2]. Напишите проверку: находятся ли вершины 0 и 2 в одной компоненте? А 2 и 3? Здесь не нужно вычислять сами SCC.", "explanation": ["Индекс массива — вершина, значение — метка её компоненты.", "У 0 и 2 одна метка 0; у 2 и 3 метки различаются.", "Сравнивайте равенство меток, а не их величину. Номера компонент не являются расстояниями или порядком вершин."]}, "EN": {"task": "Component labels are already given: [0,0,0,1,1,2]. Check whether vertices 0 and 2 share a component, then check 2 and 3. Do not compute the SCCs in this exercise.", "explanation": ["The array index identifies a vertex; its value labels that vertex’s component.", "Vertices 0 and 2 both have label 0; vertices 2 and 3 have different labels.", "Compare label equality, not magnitude. Component numbers are neither distances nor vertex positions."]}, "output": "true\nfalse"}}, {"id": "topo", "RU": {"title": "Зависимости: что можно сделать следующим?", "story": "Чтобы выпустить приложение, сначала подготовьте данные, затем API и интерфейс, после них тесты и релиз. Выберите следующую работу так, чтобы все её предпосылки уже были выполнены. Потом добавьте циклическую зависимость и попробуйте построить порядок снова.", "steps": ["Ребро u→v означает: u должно быть раньше v.", "Допустимых порядков может быть несколько: независимые работы иногда можно переставлять.", "Цикл делает полный порядок невозможным; DFS обнаруживает его через активную вершину."], "transfer": "При сборке проекта библиотеку-предпосылку нужно собрать раньше зависящего от неё модуля: направьте ребро от предпосылки к потребителю. Топологический порядок даёт допустимую последовательность. Независимые задачи иногда можно выполнять параллельно, но сам порядок не рассчитывает сроки и загрузку исполнителей. В задании используйте DFS с тремя состояниями.", "theory": "\n<p class=\"lead\">Для каждого ребра u→v вершина u должна стоять раньше v. Такой порядок существует тогда и только тогда, когда направленный граф ацикличен.<\/p>\n<p>Если DFS видит ребро v→u в активную вершину u, в текущем стеке уже есть путь u→…→v. Новое ребро замыкает направленный цикл. Напротив, ребро в завершённую вершину само по себе цикла не доказывает. Например, для рёбер 0→1, 0→2, 2→1 вершина 1 может быть завершена к моменту просмотра 2→1; граф остаётся DAG.<\/p>\n<h2>Разворот завершений<\/h2><p>При отсутствии циклов для каждого ребра u→v вершина v завершится раньше u: либо DFS обойдёт её из u, либо она уже была завершена. Поэтому в развёрнутом finish вершина u стоит раньше v. Добавляйте каждую вершину ровно один раз, включая изолированные вершины.<\/p>\n<p>Для цепочки 0→1→2 finish=[2,1,0], ответ [0,1,2]. Для 0→1, 1→0 результат acyclic=false и order=[]. Петля тоже цикл. Для пустого графа верните acyclic=true и пустой order. Используйте явный DFS с сохранением позиции следующего соседа.<\/p>\n<h2>Применение и границы модели<\/h2><p>В системе сборки u→v означает, что v зависит от u. Топологический порядок задаёт допустимую последовательность сборки. Он не определяет оптимальное расписание нескольких исполнителей и не учитывает длительности задач. Для этого потребуются дополнительные данные и алгоритмы.<\/p>\n<p>Время O(n+m), память O(n+m). Проверяйте все компоненты: цикл в отдельной части графа делает невозможным порядок всего графа. В задании требуется DFS с тремя состояниями. Алгоритм Кана полезен как независимая проверка в тестах, но не заменяет требуемую реализацию.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.Arrays. В этом упражнении order уже является перестановкой 0..4."}, "EN": {"title": "Dependencies: what can happen next?", "story": "To release an application, prepare data, then API and interface, followed by tests and release. Choose the next task only after its prerequisites are done. Then introduce a circular dependency and try again.", "steps": ["An edge u→v requires u before v.", "Independent tasks may be reordered, so valid orders need not be unique.", "A cycle prevents a full order; DFS detects it through an active vertex."], "transfer": "A build system must compile a prerequisite library before a dependent module: direct each edge from prerequisite to consumer. A topological order gives a valid sequence. Independent tasks may run in parallel, but the order alone does not optimise durations or worker allocation. The assignment requires three-state DFS.", "theory": "\n<p class=\"lead\">For each edge u→v, u must precede v. Such an ordering exists exactly when the directed graph is acyclic.<\/p>\n<p>An edge v→u to an active vertex u closes a cycle because the current DFS stack already contains a path u→…→v. An edge to a finished vertex alone proves no cycle. In the graph 0→1, 0→2, 2→1, vertex 1 may already be finished when 2→1 is examined; the graph is still acyclic.<\/p>\n<h2>Reverse finish order<\/h2><p>Without cycles, every edge u→v has v finishing before u: DFS either explores v from u, or v has already finished. Reversing finish therefore places u before v. Include each vertex once, including isolates.<\/p>\n<p>For 0→1→2, finish=[2,1,0] and the order is [0,1,2]. For 0→1 and 1→0, return acyclic=false and order=[]. A self-loop is also a cycle. The empty graph returns acyclic=true and an empty order. Use explicit DFS with a saved next-neighbour position.<\/p>\n<h2>Applications and model limits<\/h2><p>In a build system, u→v means that v depends on u. A topological order is a valid build sequence. It does not optimise a schedule for several workers or account for task durations; those require additional data and algorithms.<\/p>\n<p>Time and memory are O(n+m). Check every component: a cycle in a separate part still prevents an order for the whole graph. The assignment requires three-state DFS. Kahn's algorithm is useful as an independent test oracle, but does not replace the required implementation.<\/p>\n", "code_context": "Method-body fragment; import java.util.Arrays. In this exercise, order is already a permutation of 0..4."}, "lab": "topo", "quiz": {"RU": {"question": "Две работы не зависят друг от друга. Можно ли поменять их местами?", "options": ["Да, отсутствие прямого ребра всегда разрешает перестановку", "Нет, допустимый порядок всегда единственный", "Да, если остальные зависимости соблюдены"], "feedback": "Топологический порядок может быть неоднозначным. Проверяйте все рёбра, а не совпадение с образцом."}, "EN": {"question": "Two tasks are independent. May their order be swapped?", "options": ["Yes; no direct edge always permits a swap", "No; a valid order is always unique", "Yes, if other dependencies remain satisfied"], "feedback": "Topological orders may be non-unique. Check every edge rather than matching a reference sequence."}, "answer": 2}, "code": "int[] order = {2, 0, 1, 3, 4};\nint[] position = new int[order.length];\nfor (int i = 0; i < order.length; i++) position[order[i]] = i;\nSystem.out.println(Arrays.toString(position));\nSystem.out.println(position[1] < position[3]);", "book": ["20.4", 573, 595, "42digraph"], "videos": [{"id": "eL-KzMXSXXI", "title": "Topological Sort Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/eL-KzMXSXXI/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Для отдельного графа с единственным ребром 1→3 предложен порядок [2,0,1,3,4]. Постройте position[v] — позицию каждой вершины — и проверьте это ребро. Не путайте порядок и массив позиций.", "explanation": ["order[i] отвечает, какая вершина стоит на месте i. position[v] отвечает, где стоит вершина v.", "Вершина 1 находится на позиции 2, вершина 3 — на позиции 3: зависимость соблюдена.", "Для проверки целого графа нужно проверить все рёбра и убедиться, что order является перестановкой вершин."]}, "EN": {"task": "For a separate graph containing only edge 1→3, consider order [2,0,1,3,4]. Build position[v], the position of each vertex, and check the edge. Distinguish the order from its inverse position array.", "explanation": ["order[i] tells which vertex occupies position i; position[v] tells where vertex v occurs.", "Vertex 1 is at position 2 and vertex 3 at position 3, so this dependency is satisfied.", "Checking a whole graph requires checking every edge and verifying that order is a vertex permutation."]}, "output": "[1, 2, 0, 3, 4]\ntrue"}}, {"id": "dag", "RU": {"title": "DAG: выбираем выгодный маршрут по этапам", "story": "Заказ проходит несколько этапов обработки. Каждый переход имеет стоимость; возвратов к пройденным этапам нет. Пройдите расчёт по шагам. Затем включите скидку на одном переходе: посмотрите, почему маршрут с более дорогим первым шагом может стать выгоднее.", "steps": ["Начальная стоимость источника — 0; неизвестные расстояния обозначайте null.", "В топологическом порядке сравнивайте стоимость уже известного пути с новым кандидатом.", "При улучшении запоминайте ребро, чтобы затем восстановить маршрут."], "transfer": "Деталь можно обработать несколькими способами. Вершина — состояние детали после этапа, ребро — допустимый следующий переход, вес — его стоимость. Среди альтернатив нужен самый дешёвый полный маршрут. Модель подходит, если переходы не возвращают к прежним состояниям. В задании проверьте весь граф на циклы, включая недостижимую часть.", "theory": "\n<p class=\"lead\">Найдите минимальную стоимость пути из source до каждой вершины. Обработка в топологическом порядке позволяет учесть и отрицательные веса.<\/p>\n<p>Сначала проверьте весь граф на циклы. В задании даже цикл, недостижимый из source, требует acyclic=false и пустых distance/parent_edge. Если граф ацикличен, задайте distance[source]=0; остальные расстояния - null, родители - −1. Просматривайте вершины в топологическом порядке и пропускайте недостижимые.<\/p>\n<h2>Релаксация<\/h2><p>Для ребра u→v веса w посчитайте candidate=distance[u]+w. Если v ещё недостижима или candidate меньше текущего расстояния, обновите distance[v] и parent_edge[v]. В parent_edge храните исходный ID ребра, не номер u. При равенстве можно оставить прежнее ребро: обе кратчайшие пути допустимы.<\/p>\n\n<p>В исходном режиме веса: 0→1:5, 0→2:2, 1→3:2, 2→3:4, 3→4:3, 2→4:9. После пяти этапов distance=[0,5,2,6,9], путь к 4 — 0→2→3→4. Нажмите «Включить скидку −4»: изменится только вес 1→3, а расчёт начнётся заново. Теперь distance=[0,5,2,1,4], путь — 0→1→3→4. Кнопка «Изолированная вершина» добавляет вершину 5 и null в конец массива. «Только путь до 4» выделяет рёбра одного маршрута вместо всего дерева родителей.<\/p>\n<h2>Почему одного прохода достаточно<\/h2><p>Перед обработкой v уже обработаны все возможные предшественники v в топологическом порядке. Следовательно, все пути из источника в v уже рассмотрены через последние рёбра. Минимальное значение distance[v] окончательно. Знак веса на это рассуждение не влияет, а отсутствие циклов не даёт вернуться к уже обработанному предшественнику.<\/p>\n<p>Время O(n+m), память O(n+m). Не используйте Дейкстру при разрешённых отрицательных весах. Число −1 может быть правильным расстоянием; недостижимость обозначается только null. Для конечных сумм используйте long; при данных ограничениях полный простой путь помещается в 64 бита. В приложениях с поэтапными состояниями такой проход является динамическим программированием по графу зависимостей.<\/p>\n", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Long допускает null; long хранит конечную сумму."}, "EN": {"title": "DAG: choose a low-cost route through stages", "story": "An order passes through processing stages. Each transition costs something, and transitions cannot return to earlier stages. Step through the calculation, then enable a discount and see why a more expensive first step can lead to a cheaper route.", "steps": ["The source distance is 0; use null for unreachable vertices.", "In topological order, compare the current distance with each new candidate.", "When improving a distance, retain its edge for route reconstruction."], "transfer": "A workpiece can follow alternative processing routes. A vertex is its state after a stage, an edge is a permitted next transition, and its weight is the transition cost. Choose the cheapest complete route. This model applies when transitions cannot return to earlier states. In the assignment, check the whole graph for cycles, including unreachable parts.", "theory": "\n<p class=\"lead\">Find a minimum-cost path from source to every vertex. Topological processing supports negative edge weights.<\/p>\n<p>Check the entire graph for cycles first. Even a cycle unreachable from source requires acyclic=false and empty distance/parent_edge arrays in this assignment. Otherwise set distance[source]=0; all other distances are null and parents are −1. Process vertices in topological order, skipping unreachable ones.<\/p>\n<h2>Relaxation<\/h2><p>For edge u→v of weight w, compute candidate=distance[u]+w. If v is unreachable or candidate is smaller, update distance[v] and parent_edge[v]. Store the original edge ID, not vertex u. On a tie you may retain the previous parent: both shortest witnesses are acceptable.<\/p>\n\n<p>Default weights are 0→1:5, 0→2:2, 1→3:2, 2→3:4, 3→4:3, 2→4:9. After five stages, distance=[0,5,2,6,9], with route 0→2→3→4 to vertex 4. “Enable discount −4” changes only weight 1→3 and restarts the calculation. Now distance=[0,5,2,1,4], with route 0→1→3→4. “Isolated vertex” adds vertex 5 and a final null entry. “Only the route to 4” highlights one route instead of the entire parent tree.<\/p>\n<h2>Why one pass is sufficient<\/h2><p>Before v is processed, all its possible predecessors have already been processed. Every source-to-v path has therefore been considered through its final edge. The minimum distance[v] is final. Weight signs do not affect this argument; acyclicity prevents returning to an already processed predecessor.<\/p>\n<p>Time and memory are O(n+m). Do not use Dijkstra when negative weights are permitted. −1 may be a valid distance; only null represents unreachable. Use long for finite sums; the published bounds keep a simple path's total within 64 bits. In applications with staged states, this is dynamic programming over a dependency graph.<\/p>\n", "code_context": "Method-body fragment with no additional imports. Long permits null; long holds a finite sum."}, "lab": "dag", "quiz": {"RU": {"question": "Текущее расстояние 6, новый кандидат 5+(−4)=1. Какое оставить?", "options": ["1", "6", "null"], "feedback": "Сравнивайте полную стоимость пути. Отрицательные веса допустимы в DAG."}, "EN": {"question": "The current distance is 6; a new candidate is 5+(−4)=1. Which should remain?", "options": ["1", "6", "null"], "feedback": "Compare total path costs. Negative weights are valid in a DAG."}, "answer": 0}, "code": "Long current = 6L;\nlong candidate = 5L + (-4L);\nif (current == null || candidate < current) current = candidate;\nSystem.out.println(current);", "book": ["22.2", 616, 638, "44sp"], "videos": [{"id": "TXkDpqjDMHA", "title": "Shortest/Longest path on a Directed Acyclic Graph (DAG)  | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/TXkDpqjDMHA/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Текущая лучшая стоимость — 6. Новый путь приходит из вершины со стоимостью 5 по ребру веса −4. Напишите одно обновление минимума и выведите результат. Затем проверьте тот же код с current=null.", "explanation": ["candidate — полная стоимость нового пути: 5−4=1.", "Если стоимости ещё нет или кандидат меньше, сохраняем кандидата. || проверяет правую часть только когда current не равен null.", "При current=null результат тоже 1. В полном алгоритме такую проверку выполняют для рёбер из достижимых вершин в топологическом порядке."]}, "EN": {"task": "The current best cost is 6. A new route arrives from a vertex costing 5 along an edge of weight −4. Write one minimum update and print the result. Then test the same code with current=null.", "explanation": ["candidate is the entire new route cost: 5−4=1.", "Store the candidate if no cost is known or the candidate is smaller. With ||, the right-hand comparison is evaluated only when current is non-null.", "Starting with current=null also gives 1. The full algorithm applies this update to edges from reachable vertices in topological order."]}, "output": "1"}}, {"id": "route", "RU": {"title": "От стоимости к самому маршруту", "story": "Стоимость пути сама по себе не объясняет, какие переходы выбрать. Нужна последовательность вершин и рёбер. Пройдите расчёт ниже до конца, нажмите «Только путь до 4» и сравните результат со скидкой и без неё.", "steps": ["Вспомните последнее ребро пути к цели.", "Перейдите к его началу и повторяйте, пока не дойдёте до источника.", "Разверните собранную последовательность: вы шли от цели назад."], "transfer": "В навигации результат должен быть объяснимым: путь, направление и сумма весов. Для параллельных рёбер нужен ID конкретного ребра. В задании вы сами реализуете функцию восстановления и проверите источник, достижимую и недостижимую цели.", "theory": "<h3>Что проверить в своей функции<\/h3><p>Родительское ребро должно заканчиваться в текущей вершине, а цепочка вести к source. Проверьте границы ID, направление, отсутствие зацикливания и совпадение суммы весов с distance. Для source маршрут [source]; для недостижимой цели выберите и опишите результат, например []. Не используйте −1 как недостижимое расстояние: это допустимая стоимость.<\/p><p>Восстановление пути из L вершин занимает O(L), если ребро находится по исходному ID за O(1). Проверьте достижимую цель, источник, недостижимую цель и равные/параллельные рёбра. Код этой функции вы пишете самостоятельно.<\/p>", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Исходные ID совпадают с номерами строк links."}, "EN": {"title": "From a cost to the actual route", "story": "A route cost does not tell you which transitions to take. You also need its vertices and edges. Complete the calculation below, select “Only the route to 4”, and compare the routes with and without the discount.", "steps": ["Read the final edge of the route to the target.", "Move to its origin and repeat until the source.", "Reverse the collected sequence, because the walk went backwards."], "transfer": "Navigation needs an explainable result: route, direction and total cost. Parallel links require the specific edge ID. Implement your own route helper and test the source, a reachable target and an unreachable target.", "theory": "<h3>Check your helper<\/h3><p>Each parent edge must end at the current vertex and the chain must lead to source. Check ID bounds, direction, termination and agreement between the weight sum and distance. The source route is [source]. Choose and document a no-route result such as [] for an unreachable target. Do not use −1 for unreachable distance; it may be a valid cost.<\/p><p>A route containing L vertices takes O(L) to reconstruct with O(1) original-ID edge lookup. Test a reachable target, the source, an unreachable target and tied/parallel edges. Write the route helper yourself.<\/p>", "code_context": "Method-body fragment with no additional imports. Original edge IDs are row indices in links."}, "lab": "dag", "quiz": {"RU": {"question": "parent_edge[v] хранит число 2. Что это означает?", "options": ["Расстояние 2", "ID исходного входящего ребра", "Всегда вершину 2"], "feedback": "По ID нужно найти исходное ребро и перейти к его началу."}, "EN": {"question": "parent_edge[v] is 2. What does it mean?", "options": ["Distance 2", "The original incoming edge ID", "Always vertex 2"], "feedback": "Look up the original edge by ID and move to its origin."}, "answer": 1}, "code": "int[][] links = {{0, 1, 3}, {1, 2, 4}};\nint selectedEdgeId = 1;\nint previousVertex = links[selectedEdgeId][0];\nlong lastWeight = links[selectedEdgeId][2];\nSystem.out.println(previousVertex);\nSystem.out.println(lastWeight);", "book": ["22.2", 616, 638, "44sp"], "videos": [], "practice": {"RU": {"task": "Даны рёбра [[0,1,3],[1,2,4]], где строка содержит [from,to,weight]. Для вершины 2 выбрано родительское ребро с ID 1. Найдите предыдущую вершину и вес этого последнего перехода.", "explanation": ["ID 1 выбирает вторую строку массива, то есть ребро 1→2 веса 4.", "Столбец 0 даёт предыдущую вершину 1; столбец 2 — вес перехода.", "Вес 4 относится только к последнему ребру, а не ко всему пути 0→1→2. Для полного пути нужны остальные родительские рёбра."]}, "EN": {"task": "Given edges [[0,1,3],[1,2,4]], with rows [from,to,weight], vertex 2 uses parent edge ID 1. Find the previous vertex and the weight of this final transition.", "explanation": ["ID 1 selects the second row: edge 1→2 of weight 4.", "Column 0 gives the previous vertex, 1; column 2 gives this transition’s weight.", "The value 4 is only the last edge weight, not the total for 0→1→2. A complete route requires following the other parent edges."]}, "output": "1\n4"}}, {"id": "assignment", "RU": {"title": "Переходим от примера к заданию", "story": "Теперь схема должна превратиться в вашу программу. Готовый шаблон уже читает JSON и получает числа и массивы. Ваша часть — структуры данных, алгоритм, проверка его результата и объяснение. Начните с одного метода и одного маленького теста.", "steps": ["Прочитайте поля входа и сохраните исходные ID.", "Напишите свой алгоритм и проверьте его отд
