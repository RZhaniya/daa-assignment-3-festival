ont-size:13px}.small{font-size:13px;color:var(--muted);line-height:1.6}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14px;line-height:1.6}td,th{border:1px solid var(--line);text-align:left;padding:10px;vertical-align:top}th{background:#f0f3f5}code{font-family:Consolas,monospace;font-size:.9em;background:#f0f2f5;padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}pre{font:14px/1.65 Consolas,monospace;overflow:auto;white-space:pre;padding:19px;background:#173248;color:#ecf2f7;border-radius:9px;max-height:600px}pre code{background:none;padding:0;font-size:inherit;white-space:pre;overflow-wrap:normal}.resourcehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.resourcehead span{font-size:12px;color:var(--muted)}.videogrid,.bookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:16px 0}.videoCard,.bookCard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white}.videoCard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#dce8ee}.videoCard .cardbody,.bookCard{padding:15px}.videoCard h3,.bookCard h3{margin:4px 0 8px;font-size:16px}.videoCard p,.bookCard p{font-size:13px;line-height:1.6}.videoCard button,.bookCard button{font-size:13px;padding:7px 10px}.videoCard iframe{width:100%;aspect-ratio:16/9;border:0;display:block}.bookCard .badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:12px;background:#ebf1ea;color:#345b3b}.bookCard .badge.extra{background:#f3eadf;color:#805b2d}.bookLinks{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}.bookFrame{width:100%;height:650px;border:1px solid var(--line);border-radius:9px;margin-top:13px;background:#eef2f4}.bookPreview[hidden]{display:none}.nextnav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:22px;margin-top:30px}.nextnav button{max-width:48%;text-align:left;font-size:14px}footer{font-size:13px;line-hei </style></head><body><a class="skip" href="#main">К уроку / Skip to lesson</a><header><div class="brand">Graph Algorithms<small>Design and Analysis of Algorithms · Assignment 3</small></div><div class="languages" role="group" aria-label="Language / Язык"><button id="ru" aria-pressed="true">Русский</button><button id="en" aria-pressed="false">English</button></div></header><div class="layout"><aside><label id="searchLabel" for="search"></label><input id="search" type="search" autocomplete="off"><nav id="contents" aria-label="Lesson contents"></nav><p id="empty" class="small" role="status"></p><p id="navHint" class="navhint"></p></aside><main id="main" tabindex="-1"><article><p id="eyebrow" class="eyebrow"></p><div class="progressline" aria-hidden="true"><span id="progress"></span></div><h1 id="title"></h1><p id="story" class="story"></p><div id="routebar" class="routebar"></div><section id="application"></section><section id="activity"></section><section id="steps" class="steps"></section><section id="quiz"></section><section id="transfer" class="transfer"></section><section id="practice"></section><section id="extension"></section><section id="deeper"></section><section id="reading"></section><section id="videos"></section><nav class="nextnav" aria-label="Lesson navigation"><button id="prev"></button><button id="next"></button></nav></article><footer><div class="quicklinks"><a href="https://github.com/RZhaniya/daa-assignment-3-graphs" id="templateLink" target="_blank" rel="noopener"></a><a href="https://github.com/RZhaniya/daa-assignment-3-graphs/blob/main/docs/Assignment_3_EN.pdf" target="_blank" rel="noopener">Assignment PDF · English</a><a href="https://github.com/RZhaniya/daa-assignment-3-graphs/blob/main/docs/Assignment_3_RU.pdf" target="_blank" rel="noopener">Задание PDF · русский</a></div><p id="footerNote"></p></footer></main></div><script id="fieldwork-data" type="application/json">{"meta": {"cables": {"RU": {"title": "Спланируйте сеть четырёх корпусов", "intro": "У вас есть допустимые трассы и бюджет. Измените цену одной трассы или закройте её, затем проверьте, можно ли соединить все корпуса.", "model": "Вершины — корпуса, рёбра — допустимые кабели, вес — условная стоимость монтажа. В этом примере нет ограничений на длину или пропускную способность.", "state": "Отдельно храните исходные ID трасс, выбранные ID, сумму и число компонент. Цена одной трассы и стоимость всего плана — разные величины.", "use": "Так формулируется задача начального кабельного плана: связать площадки с минимальной суммой затрат. При закрытии трассы меняется вход, и план нужно пересчитать.", "limit": "Дешёвое дерево не обеспечивает резервирование. Здесь можно проверить один выбранный разрыв и подобрать один дополнительный кабель; это не проект защиты от всех возможных аварий."}, "EN": {"title": "Plan a network for four buildings", "intro": "You have permitted cable routes and a budget. Change one route price or close it, then check whether every building can be connected.", "model": "Vertices are buildings, edges are permitted cables, and weights are installation costs in arbitrary units. Length and capacity constraints are outside this example.", "state": "Keep original route IDs, selected IDs, the total, and the component count separately. One cable price differs from the cost of the whole plan.", "use": "This models an initial cable layout: connect sites at minimum total cost. Closing a route changes the input, so the plan must be recalculated.", "limit": "A cheapest tree provides no redundancy. Test one selected failure and choose one extra cable here; this does not design protection against every possible failure."}}, "connectivity": {"RU": {"title": "Проверьте проход между корпусами", "intro": "Открывайте и закрывайте проходы. Затем выберите два корпуса и предскажите, можно ли добраться из одного в другой.", "model": "Каждая открытая связь допускает движение в обе стороны. Достижимость определяется всей цепочкой проходов, а не только прямой связью.", "state": "Группа хранит множество связанных вершин. Для добавлений DSU позволяет быстро проверять принадлежность одной группе и учитывать её размер.", "use": "Так проверяют, какие участки сети или площадки остаются связанными по доступным переходам. Номер представителя сам по себе не является адресом или длиной маршрута.", "limit": "После закрытия прохода группа может распасться. Демонстрация пересчитывает связность; обычный DSU из задания поддерживает объединения, но не произвольное разделение."}, "EN": {"title": "Check access between buildings", "intro": "Open and close walkways. Choose two buildings and predict whether one can be reached from the other.", "model": "Each open link works in both directions. Reachability depends on the full chain of walkways, rather than only a direct edge.", "state": "A group represents connected vertices. For additions, DSU efficiently checks common membership and tracks group size.", "use": "Use this model to find which network regions or sites remain connected through available links. A representative ID is neither an address nor a route length.", "limit": "Closing a walkway can split a group. This demonstration recomputes connectivity; ordinary assignment DSU supports merging, not arbitrary splitting."}}, "build": {"RU": {"title": "Спланируйте сборку приложения", "intro": "Запускайте готовые работы и переходите к следующему завершению. Сравните план с одним и двумя исполнителями.", "model": "Стрелка u→v означает: работа u должна завершиться до запуска v. Длительности заданы в условных минутах; номера вершин обозначают работы.", "state": "Планировщику нужны завершённые и работающие задачи, оставшееся время и свободные исполнители. Допустимый порядок не содержит всех этих сведений.", "use": "Так зависимости используются при сборке: данные конфигурации готовят раньше модулей, а пакет собирают после обязательных частей. Независимые работы могут выполняться одновременно.", "limit": "Топологический порядок проверяет зависимости, но сам по себе не минимизирует время при ограниченных исполнителях. Кнопка автозапуска выбирает готовые работы по номеру, без обещания оптимального расписания."}, "EN": {"title": "Schedule an application build", "intro": "Start ready tasks and advance to the next completion. Compare plans with one and two workers.", "model": "An arrow u→v means task u must finish before v starts. Durations are in arbitrary minutes; vertex numbers identify tasks.", "state": "A scheduler needs finished and running tasks, remaining times, and free workers. A valid vertex order does not contain all this information.", "use": "Build dependencies work this way: prepare configuration before modules, and assemble the package after required parts. Independent work may run concurrently.", "limit": "Topological order checks dependencies but does not by itself minimize time with limited workers. Auto-start chooses ready tasks by vertex number, without promising an optimal schedule."}}, "routes": {"RU": {"title": "Выберите маршрут обработки детали", "intro": "Пройдите от заготовки до готового изделия. Меняйте цену перехода, закрывайте линию и сравнивайте стоимость своего маршрута с другими вариантами.", "model": "Вершины — состояния обработки, стрелки — разрешённые следующие переходы. Линии A и B — альтернативы; проходить обе не требуется.", "state": "Храните полную накопленную стоимость и исходные ID выбранных переходов. Отрицательная цена здесь означает скидку или возврат, а не отрицательную длину.", "use": "Так можно описать выбор между допустимыми технологическими цепочками или переходами между этапами услуги. Сначала нужно проверить, что порядок этапов действительно образует DAG.", "limit": "Минимальная стоимость не учитывает пропускную способность, очередь оборудования или время доставки. Числа в этой модели условные; они не являются измерениями реального производства."}, "EN": {"title": "Choose a workpiece processing route", "intro": "Move from raw material to a finished item. Change a transition price, close a line, and compare your route with other options.", "model": "Vertices are processing states and arrows are permitted next transitions. Lines A and B are alternatives; you do not have to visit both.", "state": "Retain the full accumulated cost and original transition IDs. A negative price means a discount or refund here, not a negative physical length.", "use": "This models a choice among permitted processing chains or service stages. First check that the stage dependencies really form a DAG.", "limit": "Minimum cost omits equipment capacity, queues and delivery time. Values in this model are illustrative, not measurements from a factory."}}, "modules": {"RU": {"title": "Разберите зависимости модулей", "intro": "Здесь стрелка u→v означает: модуль u вызывает v. Добавьте обратный вызов и проверьте, какие группы объединятся.", "model": "Два модуля находятся в одной SCC, если вызовы позволяют дойти из каждого к другому. Одна направленная зависимость этого не гарантирует.", "state": "Метки component обозначают группы; конденсация хранит уникальные связи между группами. Числовые названия меток можно менять, сохраняя разбиение.", "use": "При изменении модуля полезно проверить его потенциальных вызывающих: модули, из которых к нему существует путь. Взаимные зависимости помогают определить область согласованного изменения.", "limit": "Достижимость обозначает потенциальную зависимость, а не доказанное изменение поведения каждого вызывающего. Конденсация показывает циклические группы, но не исправляет их архитектуру."}, "EN": {"title": "Explore module dependencies", "intro": "Here u→v means module u calls v. Add a return call and check which groups merge.", "model": "Two modules share an SCC when call paths exist in both directions. A one-way dependency alone is insufficient.", "state": "component labels name groups; condensation retains unique inter-group links. Numeric labels may change while preserving the partition.", "use": "When a module changes, inspect potential callers: modules with a path to it. Mutual dependencies help identify a region needing coordinated changes.", "limit": "Reachability marks potential dependence, not a proven behaviour change in every caller. Condensation identifies cyclic groups but does not repair the architecture."}}, "trace": {"RU": {"title": "Проверьте зависимости шаг за шагом", "intro": "Управляйте проверкой сборочных зависимостей: выбирайте действие до раскрытия следующего состояния стека.", "model": "В активном стеке находятся незавершённые вызовы DFS. Завершённая вершина уже просмотрела всех соседей; переход к ней не является свидетельством цикла.", "state": "Запись стека хранит вершину и индекс следующего соседа. finish пополняется только при завершении, а не при открытии вершины.", "use": "Так можно проследить, почему проверка зависимостей сборки обнаружила замкнутую цепочку. Отдельная недостижимая из 0 часть тоже должна быть проверена.", "limit": "В этом тренажёре DFS проверяет циклы зависимостей. Первый DFS алгоритма Косарайю решает другую задачу и не прекращается из-за найденного цикла."}, "EN": {"title": "Inspect dependencies one step at a time", "intro": "Control a build-dependency check: choose an action before revealing the next stack state.", "model": "The active stack contains suspended DFS calls. A finished vertex has examined all its neighbours; an edge to it is not evidence of a cycle.", "state": "A frame stores a vertex and its next-neighbour index. Append to finish only on completion, rather than discovery.", "use": "Trace why a dependency check reported a closed chain. A separate part unreachable from 0 must also be checked.", "limit": "This simulator uses DFS for cycle detection. Kosaraju’s first DFS has a different purpose and must not stop merely because a cycle exists."}}, "representation": {"RU": {"title": "Постройте вход для программы", "intro": "Добавляйте рёбра и смотрите, какие записи появляются у выбранной вершины. Добавьте обратное ребро, параллельные рёбра и петлю.", "model": "ID — номер исходной строки. Новая строка получает новый ID, даже если её концы совпадают с другой строкой.", "state": "Список смежности хранит to, weight и id. Для неориентированной связи добавляются записи у обоих концов; исходное ребро при этом остаётся одним.", "use": "Так хранят несколько рейсов между остановками или несколько допустимых соединений между площадками. Разные цены нельзя потерять при объединении одинаковых концов.", "limit": "В этой маленькой схеме до восьми строк и до двух связей одной пары вершин. Ограничение нужно для читаемости рисунка; пределы основного задания значительно больше."}, "EN": {"title": "Construct a program input", "intro": "Add edges and inspect the entries stored at a selected vertex. Try a reverse link, parallel edges and a self-loop.", "model": "An ID is an original row index. A new row has a new ID even when its endpoints match an earlier row.", "state": "An adjacency entry stores to, weight and id. An undirected edge adds entries at both ends while remaining one original edge.", "use": "Represent multiple services between stops or multiple permitted site connections this way. Do not lose different prices when endpoints match.", "limit": "This small drawing allows eight rows and two links per vertex pair for readability. The main assignment has much larger limits."}}, "scale": {"RU": {"title": "Оцените память до запуска", "intro": "Изменяйте число вершин и рёбер. Сравните матрицу с компактными массивами списка смежности и задайте бюджет памяти.", "model": "Матрица использует n² ячеек по 4 байта. Для списка здесь считаются offsets[n+1] и три int на запись: to, weight, id; неориентированное ребро даёт две записи.", "state": "Умножение должно начинаться с long: (long)n*n. Эти формулы оценивают только указанные массивы, без входа, очереди, ответов и объектных накладных расходов.", "use": "Так можно заранее исключить представление, которое не помещается в ограничения, прежде чем измерять скорость реализации.", "limit": "Это расчёт объёма выбранных массивов, а не измерение Java heap или времени работы. Одна ячейка матрицы также не сохраняет произвольное число параллельных рёбер."}, "EN": {"title": "Estimate memory before running", "intro": "Change the vertex and edge counts. Compare a matrix with compact adjacency arrays and set a memory budget.", "model": "The matrix has n² cells of 4 bytes. The list model counts offsets[n+1] and three ints per entry: to, weight and id; an undirected edge uses two entries.", "state": "Start multiplication in long: (long)n*n. These formulas count only the named arrays, excluding input, queues, output and object overhead.", "use": "Rule out representations exceeding the limit before benchmarking an implementation.", "limit": "This calculates selected array sizes rather than measuring Java heap or runtime. One matrix cell also cannot retain arbitrarily many parallel edges."}}, "witness": {"RU": {"title": "Проверьте предложенный результат", "intro": "Результат программы может иметь правильную сумму и неверные рёбра. Измените предложенный JSON и найдите конкретную причину принятия или отказа. Это сокращённые учебные свидетельства, а не полные ответы JSON Lines для сдачи.", "model": "Здесь используются небольшие фиксированные графы. Для леса проверяются ID, циклы, охват компонент и оптимальная сумма; для порядка — все вершины и направления зависимостей.", "state": "Для маршрута важны последовательность исходных ID и сумма, для SCC — разбиение и точный набор пар конденсации. Допустимые неоднозначные ответы не сравниваются с одной строкой.", "use": "Так устроены содержательные проверки результата: программа должна подтвердить ответ выбранными связями, порядком или маршрутом, а не только напечатать число.", "limit": "Успех на этих малых примерах не заменяет проверку всей области входов. Изменение JSON здесь не запускает ваш код и не выставляет оценку. В этом тренажёре метки ограничены точными целыми JavaScript: 0…9007199254740991. В задании разрешён весь неотрицательный диапазон signed 64-bit."}, "EN": {"title": "Validate a proposed result", "intro": "A program may return the correct sum with invalid edges. Edit a proposed JSON answer and find a concrete acceptance or rejection reason. These are shortened learning witnesses, not complete JSON Lines submission responses.", "model": "These use small fixed graphs. Forest checks cover IDs, cycles, spanning every input component and optimal cost; order checks cover all vertices and dependency directions.", "state": "Routes need consecutive original IDs and their sum; SCCs need a correct partition and exact condensation pairs. Non-unique answers are not compared with one reference string.", "use": "Meaningful result checks require a witness: selected links, an order or a route, rather than only a number.", "limit": "Passing these small examples does not cover the full input domain. Editing JSON here does not execute your program or award marks. This trainer restricts labels to exact JavaScript integers: 0…9007199254740991. The assignment permits the full nonnegative signed 64-bit range."}}}, "traces": [{"n": 4, "edges": [[0, 1], [0, 2], [1, 3], [2, 3]], "events": [{"before": {"states": [0, 0, 0, 0], "stack": [], "finish": []}, "action": "start", "vertex": 0, "after": {"states": [1, 0, 0, 0], "stack": [[0, 0]], "finish": []}}, {"before": {"states": [1, 0, 0, 0], "stack": [[0, 0]], "finish": []}, "action": "descend", "vertex": 0, "to": 1, "edge": 0, "after": {"states": [1, 1, 0, 0], "stack": [[0, 1], [1, 0]], "finish": []}}, {"before": {"states": [1, 1, 0, 0], "stack": [[0, 1], [1, 0]], "finish": []}, "action": "descend", "vertex": 1, "to": 3, "edge": 2, "after": {"states": [1, 1, 0, 1], "stack": [[0, 1], [1, 1], [3, 0]], "finish": []}}, {"before": {"states": [1, 1, 0, 1], "stack": [[0, 1], [1, 1], [3, 0]], "finish": []}, "action": "finish", "vertex": 3, "after": {"states": [1, 1, 0, 2], "stack": [[0, 1], [1, 1]], "finish": [3]}}, {"before": {"s x]\n", "java": "static int[] solve(int n, int[][] edges, int vertex) {\n    List<Integer> ids = new ArrayList<>();\n    for (int i = 0; i < edges.length; i++) {\n        if (edges[i][0] == vertex) ids.add(i);\n    }\n    int[] answer = new int[ids.size()];\n    for (int i = 0; i < answer.length; i++) answer[i] = ids.get(i);\n    return answer;\n}", "tests": [{"args": [4, [[0, 1, 7], [2, 0, 1], [0, 0, -2], [0, 1, 3]], 0], "expected": [0, 2, 3]}, {"args": [1, [], 0], "expected": []}, {"args": [3, [[2, 1, 4]], 0], "expected": []}, {"args": [2, [[1, 0, -1], [1, 0, -1]], 1], "expected": [0, 1]}, {"args": [1, [[0, 0, 0]], 0], "expected": [0]}], "notes": [["ID 1 входит в 0, но не выходит из неё; ID 2 — петля.", "ID 1 enters 0 rather than leaving it; ID 2 is a self-loop."], ["Без рёбер результат пуст.", "With no edges, the result is empty."]], "starter_python": "def solve(n, edges, vertex):\n    # Return the result described above.\n    pass\n", "starter_java": "static int[] solve(int n, int[][] edges, int vertex) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice01", "java_file": "code/practice/Practice01.java"}, {"id": "sizes", "topic": "dsu", "level": "warmup", "args": ["labels"], "RU": {"title": "02 · Размеры уже известных групп", "task": "Для каждой вершины дана метка группы labels[v]. Верните массив: на позиции v — число вершин с той же меткой. Метки могут идти с пропусками. Находить группы или выполнять union не нужно.", "limits": "0 ≤ n ≤ 10000; labels содержит n целых меток от 0 до 10⁶.", "hint": "Сначала посчитайте частоту каждой метки, затем пройдите исходный массив ещё раз.", "explain": ["Ключ таблицы — метка, значение — число её появлений.", "Порядок результата совпадает с порядком вершин, а не с порядком ключей таблицы."], "complexity": "Ожидаемое O(n) времени с хеш-таблицей; O(n) памяти вместе с ответом.", "use": "Проверяйте размер компоненты независимо от её представителя. В DSU rank не заменяет размер."}, "EN": {"title": "02 · Sizes of known groups", "task": "Each vertex has a group label labels[v]. Return an array whose entry v counts vertices with that label. Labels need not be consecutive. Do not find groups or perform unions.", "limits": "0 ≤ n ≤ 10000; labels contains n integers from 0 to 10⁶.", "hint": "Count each label first, then scan the original array again.", "explain": ["A map key is a label; its value is the number of occurrences.", "Return entries in vertex order, rather than map-key order."], "complexity": "Expected O(n) time with a hash map; O(n) space including output.", "use": "Check component sizes independently of representative names. In DSU, rank does not replace size."}, "python": "def solve(labels):\n    count = {}\n    for label in labels:\n        count[label] = count.get(label, 0) + 1\n    return [count[label] for label in labels]\n", "java": "static int[] solve(int[] labels) {\n    Map<Integer, Integer> count = new HashMap<>();\n    for (int label : labels) count.put(label, count.getOrDefault(label, 0) + 1);\n    int[] answer = new int[labels.length];\n    for (int v = 0; v < labels.length; v++) answer[v] = count.get(labels[v]);\n    return answer;\n}", "tests": [{"args": [[7, 7, 2, 9, 2]], "expected": [2, 2, 2, 1, 2]}, {"args": [[]], "expected": []}, {"args": [[0]], "expected": [1]}, {"args": [[4, 4, 4]], "expected": [3, 3, 3]}, {"args": [[8, 3, 6]], "expected": [1, 1, 1]}], "notes": [["Метки 7 и 2 встречаются по два раза, 9 — один раз.", "Labels 7 and 2 occur twice each; 9 occurs once."], ["Для нуля вершин массив ответа пуст.", "With zero vertices, the output array is empty."]], "starter_python": "def solve(labels):\n    # Return the result described above.\n    pass\n", "starter_java": "static int[] solve(int[] labels) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice02", "java_file": "code/practice/Practice02.java"}, {"id": "positions", "topic": "dfs", "level": "warmup", "args": ["finish"], "RU": {"title": "03 · От завершений к позициям", "task": "Дан finish — порядок завершения DFS некоторого DAG. Он гарантированно содержит каждую вершину 0..n−1 ровно один раз. Разверните его в order и верните position[v] — индекс v в order. Не выполняйте DFS и не проверяйте циклы.", "limits": "0 ≤ n ≤ 10000; finish — перестановка 0..n−1.", "hint": "Идите по finish справа налево. Для каждой вершины запишите номер её места.", "explain": ["order[position[v]] равен v. Это связь двух массивов с разным смыслом.", "Не возвращайте order вместо position: в первом примере эти массивы различаются."], "complexity": "O(n) времени и O(n) памяти.", "use": "Массив позиций позволяет проверить, что зависимость u→v идёт вперёд в предложенном порядке."}, "EN": {"title": "03 · From finish order to positions", "task": "finish is a DFS finishing order of a DAG and contains every vertex 0..n−1 exactly once. Reverse it to obtain order, then return position[v], the index of v in order. Do not run DFS or check cycles.", "limits": "0 ≤ n ≤ 10000; finish is a permutation of 0..n−1.", "hint": "Scan finish from right to left and record each vertex position.", "explain": ["order[position[v]] equals v. The arrays describe different mappings.", "Do not return order in place of position: they differ in the first example."], "complexity": "O(n) time and O(n) space.", "use": "Positions let you check whether a dependency u→v points forward in a proposed order."}, "python": "def solve(finish):\n    position = [0] * len(finish)\n    for i, vertex in enumerate(reversed(finish)):\n        position[vertex] = i\n    return position\n", "java": "static int[] solve(int[] finish) {\n    int n = finish.length;\n    int[] position = new int[n];\n    for (int i = 0; i < n; i++) position[finish[n - 1 - i]] = i;\n    return position;\n}", "tests": [{"args": [[3, 2, 0, 1]], "expected": [1, 0, 2, 3]}, {"args": [[]], "expected": []}, {"args": [[2, 1, 0]], "expected": [0, 1, 2]}, {"args": [[0, 1, 2]], "expected": [2, 1, 0]}, {"args": [[1, 0, 2]], "expected": [1, 2, 0]}], "notes": [["order=[1,0,2,3], поэтому position[0]=1, position[1]=0.", "order=[1,0,2,3], so position[0]=1 and position[1]=0."], ["У пустого порядка нет позиций.", "An empty order has no positions."]], "starter_python": "def solve(finish):\n    # Return the result described above.\n    pass\n", "starter_java": "static int[] solve(int[] finish) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice03", "java_file": "code/practice/Practice03.java"}, {"id": "relax", "topic": "dag", "level": "warmup", "args": ["current", "from_distance", "weight"], "RU": {"title": "04 · Одна релаксация", "task": "Даны текущая стоимость current до цели, стоимость from_distance до начала ребра и вес weight. null означает неизвестную стоимость. Если начало недостижимо, оставьте current. Иначе верните меньшую из current и from_distance+weight; при current=null сохраните найденную сумму.", "limits": "Известные стоимости — целые от −10¹² до 10¹²; |weight| ≤ 10⁹. current и from_distance могут быть null.", "hint": "Сначала проверьте from_distance. Только затем складывайте и сравнивайте.", "explain": ["null нельзя заменять числом −1: сумма может законно равняться −1.", "Равный кандидат сохраняет ту же стоимость. Работа с родительским ID рассматривается в тренажёре раздела DAG."], "complexity": "O(1) времени и памяти.", "use": "Это один переход в расчёте маршрутов. Порядок обработки графа в этой задаче уже не требуется."}, "EN": {"title": "04 · One relaxation", "task": "Given current cost to a destination, from_distance to an edge source, and weight, use null for unknown costs. If the source is unreachable, retain current. Otherwise return the smaller of current and from_distance+weight; when current is null, store the candidate.", "limits": "Known costs are integers from −10¹² to 10¹²; |weight| ≤ 10⁹. Both costs may be null.", "hint": "Check from_distance before adding and comparing.", "explain": ["Do not replace null with −1: a valid sum can equal −1.", "An equal candidate leaves the cost unchanged. Parent IDs are covered in the DAG chapter simulator."], "complexity": "O(1) time and space.", "use": "This is one transition in a route calculation. No graph traversal is required here."}, "python": "def solve(current, from_distance, weight):\n    if from_distance is None:\n        return current\n    candidate = from_distance + weight\n    if current is None or candidate < current:\n        return candidate\n    return current\n", "java": "static Long solve(Long current, Long fromDistance, long weight) {\n    if (fromDistance == null) return current;\n    long candidate = fromDistance + weight;\n    if (current == null || candidate < current) return candidate;\n    return current;\n}", "tests": [{"args": [6, 5, -4], "expected": 1}, {"args": [null, null, 9], "expected": null}, {"args": [null, 5, -4], "expected": 1}, {"args": [1, 2, 4], "expected": 1}, {"args": [3, null, -20], "expected": 3}, {"args": [5, 2, 3], "expected": 5}, {"args": [null, 3000000000, 1000000000], "expected": 4000000000}, {"args": [0, 4, -5], "expected": -1}], "notes": [["Кандидат 5+(−4)=1 улучшает стоимость 6.", "Candidate 5+(−4)=1 improves cost 6."], ["Путь к началу ребра неизвестен, поэтому нового кандидата нет.", "The edge source is unreachable, so there is no candidate."]], "starter_python": "def solve(current, from_distance, weight):\n    # Return the result described above.\n    pass\n", "starter_java": "static Long solve(Long current, Long fromDistance, long weight) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice04", "java_file": "code/practice/Practice04.java"}, {"id": "boundary", "topic": "prim", "level": "core", "args": ["edges", "inside"], "RU": {"title": "05 · Самое дешёвое ребро границы", "task": "Дан неориентированный граф edges[i]=[u,v,weight] и inside[v]: принадлежит ли v уже выбранной области. Верните исходный ID самого дешёвого ребра с ровно одним концом внутри. При равных весах выберите меньший ID. Если кандидата нет, верните −1.", "limits": "0 ≤ n ≤ 100; 0 ≤ m ≤ 500; inside — n логических значений; концы корректны; |weight| ≤ 10⁹.", "hint": "У подходящего ребра inside[u] и inside[v] различаются. Сначала отберите допустимые рёбра, затем сравните вес.", "explain": ["Петля никогда не пересекает границу. Параллельные рёбра имеют собственные ID.", "Просмотр по возрастанию ID с обновлением только при меньшем весе сохраняет меньший ID при ничьей. Это правило этой задачи; основное задание допускает разные оптимумы."], "complexity": "O(n+m) времени с учётом чтения inside; O(1) дополнительной памяти.", "use": "Так проверяется один выбор на границе дерева. Здесь нет очереди, обхода компонент и полного алгоритма Прима."}, "EN": {"title": "05 · Cheapest boundary edge", "task": "Given an undirected graph edges[i]=[u,v,weight] and membership inside[v], return the original ID of the cheapest edge with exactly one endpoint inside. Break weight ties by smaller ID. Return −1 when no candidate exists.", "limits": "0 ≤ n ≤ 100; 0 ≤ m ≤ 500; inside contains n Booleans; valid endpoints; |weight| ≤ 10⁹.", "hint": "A boundary edge has different inside values at its endpoints. Filter by eligibility before comparing weights.", "explain": ["A self-loop never crosses the boundary. Parallel edges keep distinct IDs.", "Scan IDs in ascending order and update only for a lower weight to keep the smaller ID on ties. This exercise has that tie-break; the main assignment accepts alternative optima."], "complexity": "O(n+m) time including reading inside; O(1) auxiliary space.", "use": "Check one boundary choice. This is not a complete Prim implementation: there is no queue or component traversal."}, "python": "def solve(edges, inside):\n    best = -1\n    for i, (u, v, weight) in enumerate(edges):\n        if inside[u] == inside[v]:\n            continue\n        if best == -1 or weight < edges[best][2]:\n            best = i\n    return best\n", "java": "static int solve(int[][] edges, boolean[] inside) {\n    int best = -1;\n    for (int i = 0; i < edges.length; i++) {\n        int u = edges[i][0], v = edges[i][1];\n        if (inside[u] == inside[v]) continue;\n        if (best == -1 || edges[i][2] < edges[best][2]) best = i;\n    }\n    return best;\n}", "tests": [{"args": [[[0, 0, -100], [0, 1, 5], [0, 1, -2], [1, 2, 1], [2, 3, 0]], [true, false, false, false]], "expected": 2}, {"args": [[[0, 1, 4], [0, 2, 4], [1, 2, -9]], [true, false, false]], "expected": 0}, {"args": [[], [true, false]], "expected": -1}, {"args": [[[0, 1, -1]], [true, true]], "expected": -1}, {"args": [[[0, 1, -1]], [false, false]], "expected": -1}, {"args": [[[0, 1, 7], [2, 1, 2]], [false, true, false]], "expected": 1}, {"args": [[], []], "expected": -1}], "notes": [["Петля ID 0 дешевле всех, но не пересекает границу. Из двух рёбер 0–1 выбираем ID 2 веса −2.", "Loop ID 0 is cheapest overall but does not cross the boundary. Of the two 0–1 edges, choose ID 2 with weight −2."], ["ID 0 и 1 имеют вес 4. Условие выбирает меньший ID 0; ребро ID 2 вне границы.", "IDs 0 and 1 both weigh 4. The tie-break selects ID 0; ID 2 is outside the boundary."]], "starter_python": "def solve(edges, inside):\n    # Return the result described above.\n    pass\n", "starter_java": "static int solve(int[][] edges, boolean[] inside) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice05", "java_file": "code/practice/Practice05.java"}, {"id": "order", "topic": "topo", "level": "core", "args": ["n", "edges", "order"], "RU": {"title": "06 · Проверить порядок зависимостей", "task": "Верните true, если order содержит каждую вершину 0..n−1 ровно один раз и для каждого направленного ребра u→v вершина u стоит раньше v. Иначе верните false. Проверяйте предложенный порядок, не стройте свой.", "limits": "0 ≤ n ≤ 100; 0 ≤ m ≤ 500; концы edges корректны. order содержит от 0 до n+2 целых чисел в диапазоне −1..n; ошибочные кандидаты допустимы.", "hint": "Сначала проверьте перестановку, затем постройте position и сравните позиции концов всех рёбер.", "explain": ["Проверки рёбер недостаточно: пустой граф всё равно требует каждую вершину ровно один раз.", "Петля требует position[v]<position[v], что невозможно. Допустимые порядки могут различаться."], "complexity": "O(n+m) времени и O(n) дополнительной памяти.", "use": "Перед запуском сборки можно проверить, что заявленная последовательность уважает все зависимости. Длительности работ этот тест не вычисляет."}, "EN": {"title": "06 · Validate a dependency order", "task": "Return true if order contains every vertex 0..n−1 exactly once and u precedes v for every directed edge u→v. Otherwise return false. Validate the supplied order rather than constructing one.", "limits": "0 ≤ n ≤ 100; 0 ≤ m ≤ 500; valid edge endpoints. order has 0..n+2 integer entries in −1..n; invalid candidates are allowed.", "hint": "Check the permutation first, then build position and compare every edge.", "explain": ["Edge checks alone are insufficient: even an edgeless graph requires each vertex exactly once.", "A self-loop would require position[v]<position[v], which is impossible. Valid orders need not be unique."], "complexity": "O(n+m) time and O(n) auxiliary space.", "use": "Before a build, check whether a declared sequence respects all dependencies. This does not calculate task durations."}, "python": "def solve(n, edges, order):\n    if len(order) != n:\n        return False\n    position = [-1] * n\n    for i, vertex in enumerate(order):\n        if vertex < 0 or vertex >= n or position[vertex] != -1:\n            return False\n        position[vertex] = i\n    return all(position[u] < position[v] for u, v in edges)\n", "java": "static boolean solve(int n, int[][] edges, int[] order) {\n    if (order.length != n) return false;\n    int[] position = new int[n];\n    Arrays.fill(position, -1);\n    for (int i = 0; i < n; i++) {\n        int v = order[i];\n        if (v < 0 || v >= n || position[v] != -1) return false;\n        position[v] = i;\n    }\n    for (int[] edge : edges) if (position[edge[0]] >= position[edge[1]]) return false;\n    return true;\n}", "tests": [{"args": [4, [[0, 2], [1, 2], [2, 3]], [1, 0, 2, 3]], "expected": true}, {"args": [4, [[0, 2], [1, 2], [2, 3]], [0, 2, 1, 3]], "expected": false}, {"args": [4, [[0, 2], [1, 2], [2, 3]], [0, 1, 2, 3]], "expected": true}, {"args": [3, [], [0, 0, 2]], "expected": false}, {"args": [3, [], [0, 1]], "expected": false}, {"args": [1, [[0, 0]], [0]], "expected": false}, {"args": [0, [], []], "expected": true}, {"args": [4, [[0, 1], [2, 3], [3, 2]], [0, 1, 2, 3]], "expected": false}, {"args": [3, [[0, 1], [0, 1]], [0, 1, 2]], "expected": true}, {"args": [2, [], [0, 2]], "expected": false}, {"args": [2, [], [-1, 0]], "expected": false}], "notes": [["Рёбра 0→2, 1→2 и 2→3 идут вперёд. Порядок [0,1,2,3] тоже допустим.", "Edges 0→2, 1→2 and 2→3 all point forward. Order [0,1,2,3] is also valid."], ["Ребро 1→2 нарушено: вершина 1 стоит после 2.", "Edge 1→2 is violated: vertex 1 appears after 2."]], "starter_python": "def solve(n, edges, order):\n    # Return the result described above.\n    pass\n", "starter_java": "static boolean solve(int n, int[][] edges, int[] order) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice06", "java_file": "code/practice/Practice06.java"}, {"id": "pairs", "topic": "scc", "level": "core", "args": ["labels", "edges"], "RU": {"title": "07 · Связи между размеченными группами", "task": "Метка labels[v] каждой вершины уже дана. Для каждого направленного ребра u→v между разными метками получите пару [labels[u],labels[v]]. Верните все такие пары без повторов, в любом порядке. Не вычисляйте SCC. Если метки обозначают SCC, результат является рёбрами конденсации.", "limits": "0 ≤ n ≤ 100; 0 ≤ m ≤ 500; метки — целые 0..10⁶; концы edges корректны. Метки могут описывать произвольные группы.", "hint": "Пропускайте внутренние рёбра. Для остальных сохраняйте пару меток в множестве.", "explain": ["Проверяется множество пар, но повторять пару в ответе нельзя.", "Названия меток не требуют перенумерации. В примере Java сортировка служит только для воспроизводимого вывода."], "complexity": "Ожидаемое O(n+m) времени с хеш-множеством; O(n+m) памяти с результатом. Показанная сортировка ответа добавляет O(k log(k+1)) для k пар.", "use": "Так можно оставить одну зависимость между двумя группами модулей, даже если исходных связей между ними несколько."}, "EN": {"title": "07 · Links between labelled groups", "task": "Every vertex already has a label labels[v]. For each directed edge u→v between different labels, form [labels[u],labels[v]]. Return all such pairs without duplicates, in any order. Do not compute SCCs. If labels identify SCCs, these are the condensation edges.", "limits": "0 ≤ n ≤ 100; 0 ≤ m ≤ 500; integer labels in 0..10⁶; valid endpoints. Labels may describe arbitrary groups.", "hint": "Skip internal edges and store other label pairs in a set.", "explain": ["Compare sets of pairs, but repeated pairs in the output are invalid.", "Do not renumber labels. The Java example sorts only for reproducible output."], "complexity": "Expected O(n+m) time with a hash set; O(n+m) space including output. The displayed output sort adds O(k log(k+1)) for k pairs.", "use": "Retain one dependency between module groups even when multiple original links connect them."}, "python": "def solve(labels, edges):\n    pairs = set()\n    for u, v in edges:\n        if labels[u] != labels[v]:\n            pairs.add((labels[u], labels[v]))\n    return [list(pair) for pair in pairs]\n", "java": "static int[][] solve(int[] labels, int[][] edges) {\n    Map<Integer, Set<Integer>> outgoing = new HashMap<>();\n    for (int[] edge : edges) {\n        int a = labels[edge[0]], b = labels[edge[1]];\n        if (a != b) outgoing.computeIfAbsent(a, key -> new HashSet<>()).add(b);\n    }\n    List<int[]> pairs = new ArrayList<>();\n    for (int a : outgoing.keySet()) for (int b : outgoing.get(a)) pairs.add(new int[]{a, b});\n    pairs.sort((a, b) -> a[0] != b[0] ? Integer.compare(a[0], b[0]) : Integer.compare(a[1], b[1]));\n    return pairs.toArray(new int[0][]);\n}", "tests": [{"args": [[5, 5, 9, 3], [[0, 1], [1, 0], [1, 2], [0, 2], [2, 3], [3, 3]]], "expected": [[5, 9], [9, 3]]}, {"args": [[10, 10], [[0, 1], [1, 0]]], "expected": []}, {"args": [[], []], "expected": []}, {"args": [[8, 2, 7], [[0, 1], [0, 2], [0, 1], [1, 2]]], "expected": [[2, 7], [8, 2], [8, 7]]}, {"args": [[0, 1, 2], []], "expected": []}, {"args": [[0], [[0, 0]]], "expected": []}], "notes": [["Два исходных ребра дают пару [5,9]; сохраняем её один раз. Петля внутри группы 3 исключается.", "Two original edges yield [5,9]; keep it once. The loop within group 3 is excluded."], ["Все рёбра внутренние, поэтому межгрупповых пар нет.", "Every edge stays within one group, so no cross-group pairs remain."]], "starter_python": "def solve(labels, edges):\n    # Return the result described above.\n    pass\n", "starter_java": "static int[][] solve(int[] labels, int[][] edges) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice07", "java_file": "code/practice/Practice07.java"}, {"id": "walk", "topic": "route", "level": "core", "args": ["n", "edges", "source", "target", "edge_ids"], "RU": {"title": "08 · Проверить переходы по ID", "task": "В ориентированном графе edges[i]=[from,to,weight] дан список ID предполагаемого маршрута из source в target. Начните в source и проходите рёбра в указанном порядке. Если ID неверен, ребро начинается не в текущей вершине или конец не равен target, верните null. Иначе верните сумму весов. Это проверка переходов, а не поиск кратчайшего пути.", "limits": "1 ≤ n ≤ 100; 0 ≤ m ≤ 500; до 500 ID; ID могут быть от −1 до m; корректные source, target и концы рёбер; |weight| ≤ 10⁹.", "hint": "Держите current_vertex и total. Перед переходом проверьте диапазон ID и первый столбец выбранной строки.", "explain": ["Пустой список даёт 0 только при source=target.", "В этом упражнении повторные вершины и рёбра разрешены: проверяется последовательность переходов. Сумма может быть отрицательной."], "complexity": "O(L) времени для L ID; O(1) дополнительной памяти.", "use": "Так проверяется присланный маршрут: выбранные переходы действительно стыкуются, а заявленная стоимость равна их сумме."}, "EN": {"title": "08 · Validate transitions by ID", "task": "In a directed graph edges[i]=[from,to,weight], edge_ids proposes a route from source to target. Start at source and follow the listed edges in order. Return null for an invalid ID, an edge that starts elsewhere, or a final vertex different from target. Otherwise return the weight sum. This checks transitions; it does not find a shortest path.", "limits": "1 ≤ n ≤ 100; 0 ≤ m ≤ 500; at most 500 IDs in −1..m; valid source, target and endpoints; |weight| ≤ 10⁹.", "hint": "Maintain current_vertex and total. Check the ID range and the selected row source before moving.", "explain": ["An empty list costs 0 only when source=target.", "Repeated vertices and edges are allowed in this exercise: it checks a walk. The total may be negative."], "complexity": "O(L) time for L IDs; O(1) auxiliary space.", "use": "Check whether a proposed route joins up and whether its cost equals the sum of its transitions."}, "python": "def solve(n, edges, source, target, edge_ids):\n    vertex = source\n    total = 0\n    for edge_id in edge_ids:\n        if edge_id < 0 or edge_id >= len(edges):\n            return None\n        u, v, weight = edges[edge_id]\n        if u != vertex:\n            return None\n        vertex = v\n        total += weight\n    return total if vertex == target else None\n", "java": "static Long solve(int n, int[][] edges, int source, int target, int[] edgeIds) {\n    int vertex = source;\n    long total = 0;\n    for (int id : edgeIds) {\n        if (id < 0 || id >= edges.length || edges[id][0] != vertex) return null;\n        vertex = edges[id][1];\n        total += edges[id][2];\n    }\n    return vertex == target ? total : null;\n}", "tests": [{"args": [3, [[0, 1, 5], [0, 1, 2], [1, 2, -1], [0, 2, 7]], 0, 2, [1, 2]], "expected": 1}, {"args": [3, [[0, 1, 5], [0, 1, 2], [1, 2, -1], [0, 2, 7]], 0, 2, [2, 1]], "expected": null}, {"args": [1, [], 0, 0, []], "expected": 0}, {"args": [2, [], 0, 1, []], "expected": null}, {"args": [1, [[0, 0, -2]], 0, 0, [0, 0]], "expected": -4}, {"args": [2, [[0, 1, 4]], 0, 1, [-1]], "expected": null}, {"args": [2, [[0, 1, 4]], 0, 1, [1]], "expected": null}, {"args": [4, [[0, 1, 1000000000], [1, 2, 1000000000], [2, 3, 1000000000]], 0, 3, [0, 1, 2]], "expected": 3000000000}], "notes": [["ID 1 задаёт 0→1 веса 2, ID 2 — 1→2 веса −1. Сумма 1. Это не утверждение о минимальности любого допустимого ответа.", "ID 1 is 0→1 with weight 2; ID 2 is 1→2 with weight −1. Total 1. A valid result alone does not prove optimality."], ["Первое ребро ID 2 начинается в 1, а текущая вершина — 0.", "First edge ID 2 starts at 1, but the current vertex is 0."]], "starter_python": "def solve(n, edges, source, target, edge_ids):\n    # Return the result described above.\n    pass\n", "starter_java": "static Long solve(int n, int[][] edges, int source, int target, int[] edgeIds) {\n    throw new UnsupportedOperationException(\"Implement this method\");\n}", "java_class": "Practice08", "java_file": "code/practice/Practice08.java"}]</script><script id="lesson-data" type="application/json">[{"id": "overview", "RU": {"title": "Графы: от знакомой ситуации к решению", "story": "Один план кампуса — три задачи: провести кабель, составить порядок работ и рассчитать доставку. Переключите цель и посмотрите, почему ответы различаются.", "steps": ["Назовите объекты: комнаты, работы или состояния программы. Это вершины.", "Назовите связи: кабели, зависимости или переходы. Это рёбра.", "Сформулируйте цель: соединить всё, соблюсти порядок или найти лучший путь."], "transfer": "В реальной работе начните с вопроса и ограничений, а затем выбирайте алгоритм. Например, минимальная стоимость кабелей и кратчайший маршрут доставки требуют разных ответов. В задании вы реализуете шесть требуемых алгоритмов; здесь сначала разберём, зачем нужен каждый.", "theory": "<p>Фрагменты кода в уроке показывают отдельные приёмы. Шесть алгоритмов задания и функцию восстановления пути вы реализуете самостоятельно. В конце урока есть отдельный запускаемый пример BFS для знакомства со списками смежности и очередью.<\/p>"}, "EN": {"title": "Graphs: from a familiar situation to a solution", "story": "One campus plan, three tasks: install cables, schedule work and plan a delivery. Switch the objective and see why the answers differ.", "steps": ["Identify the objects: rooms, tasks or program states. These are vertices.", "Identify the links: cables, dependencies or transitions. These are edges.", "State the objective: connect everything, respect an order or find a best route."], "transfer": "In practice, start with the question and constraints, then choose an algorithm. A cheap cable layout and a shortest delivery route ask for different answers. The assignment requires six methods; first understand what each is for.", "theory": "<p>Code fragments illustrate individual techniques. Implement the six assignment algorithms and route reconstruction yourself. A separate runnable BFS example at the end demonstrates adjacency lists and a queue.<\/p>"}, "lab": "overview", "quiz": {"RU": {"question": "Что нужно изменить в первую очередь, если цель задачи поменялась?", "options": ["Формулировку результата и выбор алгоритма", "Всегда строить остов для любого вопроса о графе", "Сохранить прежний алгоритм, изменив только источник"], "feedback": "Одного и того же графа недостаточно: цель определяет, какой ответ считать правильным."}, "EN": {"question": "What should you reconsider first when the goal changes?", "options": ["The required result and algorithm", "Always build an MST for any graph question", "Keep the same algorithm and only change the source"], "feedback": "A graph alone is insufficient: the objective determines which answer is correct."}, "answer": 0}, "code": "", "book": null, "videos": []}, {"id": "model", "RU": {"title": "Как читать граф и хранить его в программе", "story": "На схеме комнаты обозначены числами. Линия означает доступный переход, стрелка — переход только в одну сторону, число на ребре — его стоимость. Переключите вид графа и проговорите, что изменилось в модели.", "steps": ["Список рёбер отвечает на вопрос «какие связи существуют?».", "Список смежности отвечает на вопрос «куда можно перейти из этой вершины?».", "ID ребра сохраняет связь между исходной строкой входа и результатом алгоритма."], "transfer": "В программе навигации из комнаты нужно быстро получить соседние комнаты, поэтому удобен список смежности. В задании сохраняйте номер исходной строки edges[i], даже если позже сортируете рёбра. Работу со списками можно проследить в отдельном BFS-примере в конце урока.", "theory": "<p>Здесь n — число вершин, m — число входных рёбер.<\/p>\n<p class=\"lead\">Сначала определите направление рёбер, смысл веса и состав ответа. Эти решения должны быть видны в структурах данных.<\/p>\n<p>Вершины задания имеют номера от 0 до n−1. Строка <code>edges[i]<\/code> задаёт ребро с исходным ID i. Этот ID не меняется при сортировке, помещении в очередь или построении обратного графа. Для взвешенного ребра храните <code>from<\/code>, <code>to<\/code>, <code>weight<\/code> и <code>id<\/code>.<\/p>\n<h2>Список смежности<\/h2><p>Для каждого v храните исходящие рёбра. В ориентированном графе добавляется одна запись. В неориентированном графе добавляются две ориентированные записи с одним ID: u→v и v→u. Это две записи одного ребра, а не два выбранных ребра леса. Петля не может попасть в остов. Параллельные рёбра сохраняйте отдельно.<\/p>\n<p>Список смежности занимает O(n+m) памяти. Матрица смежности занимает O(n²): для 100000 вершин она не подходит. Обход соседей в списках даёт O(n+m), если каждое ребро просматривается ограниченное число раз.<\/p>\n<h2>Ограничения задания<\/h2><p>0 ≤ n ≤ 100000; для dag требуется n ≥ 1. Число рёбер или операций DSU не превышает 250000. Вес: от −1000000000 до 1000000000. Концы рёбер и source корректны; для n=0 рёбра и операции пусты. Обрабатывать повреждённый JSON в алгоритмах не требуется.<\/p><h2>Типы и сравнения<\/h2><p>Номер вершины и отдельный вес в пределах задания помещаются в int, а сумма весов может выйти за его пределы. Например, три ребра по 1000000000 дают 3000000000. В Java используйте long для стоимости и Long[] для расстояний с null. Сравнивайте веса через Long.compare, а не вычитанием. Для воспроизводимости можно сравнивать равные по весу рёбра по ID. Задание допускает и другие корректные оптимумы.<\/p>\n<p>При чтении строки i сохраните id=i в своей записи ребра. Сортируйте копию списка, чтобы исходный массив оставался доступен по ID. При построении обратного графа поменяйте направление, сохранив ID исходного ребра.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.List и java.util.ArrayList. Вершины имеют номера 0, 1, 2.", "bridge": "Представьте два рейса между одними остановками. У них одинаковые концы, но разные цены и ID. Одной записи «сосед 2» уже мало: сохраните также вес и исходный номер ребра. Так выбранный переход можно будет проверить по входным данным."}, "EN": {"title": "Reading a graph and storing it in a program", "story": "Rooms are numbered on the diagram. A line represents an available link, an arrow makes it one-way, and a number gives its cost. Switch the graph model and describe what changed.", "steps": ["An edge list answers “which links exist?”.", "An adjacency list answers “where can I go from this vertex?”.", "An edge ID connects an original input row to the algorithm’s result."], "transfer": "Navigation software needs quick access to neighbouring rooms, so an adjacency list is useful. Preserve the original row index edges[i] even when sorting edges. The separate BFS example at the end of the lesson demonstrates these lists in use.", "theory": "<p>Here n is the number of vertices and m the number of input edges.<\/p>\n<p class=\"lead\">Decide the edge direction, the meaning of the weight and the required output before choosing data structures.<\/p>\n<p>Assignment vertices are 0..n−1. The row <code>edges[i]<\/code> has original edge ID i. Sorting, queue insertion and transposition must not change it. A weighted edge stores <code>from<\/code>, <code>to<\/code>, <code>weight<\/code> and <code>id<\/code>.<\/p>\n<h2>Adjacency lists<\/h2><p>Store outgoing edges for each vertex. A directed edge contributes one entry. An undirected edge contributes entries u→v and v→u with the same original ID. These are two representations of one edge, not two selected forest edges. A self-loop cannot belong to a forest. Keep parallel edges as separate candidates.<\/p>\n<p>Adjacency lists use O(n+m) memory. An adjacency matrix uses O(n²), which is unsuitable for 100000 vertices. Traversal is O(n+m) when each stored edge is examined a bounded number of times.<\/p>\n<h2>Assignment limits<\/h2><p>0 ≤ n ≤ 100000; dag requires n ≥ 1. There are at most 250000 edges or DSU operations. Weights range from −1000000000 to 1000000000. Endpoints and source are valid; edges and operations are empty for n=0. Algorithm implementations need not handle malformed JSON.<\/p><h2>Numeric types and comparisons<\/h2><p>A vertex index and a single permitted weight fit int; a total may not. Three edges of weight 1000000000 sum to 3000000000. Use long for Java totals and Long[] for nullable distances. Compare weights using Long.compare rather than subtraction. You may break weight ties by ID for reproducibility; the assignment also accepts other valid optima.<\/p>\n<p>When reading row i, retain id=i in your edge record. Sort a copy of the list so that the original array remains available for ID lookup. When building the transpose, reverse the direction while retaining the original edge ID.<\/p>\n", "code_context": "Method-body fragment; import java.util.List and java.util.ArrayList. The vertices are 0, 1, 2.", "bridge": "Think of two services between the same stops. Their endpoints match, but prices and IDs differ. A neighbour value alone is insufficient: retain the weight and original edge ID so the chosen transition can be checked against the input."}, "lab": "model", "quiz": {"RU": {"question": "Ребро было третьим во входе, а после сортировки стало первым. Какой у него ID?", "options": ["Его нужно создать заново", "2", "0"], "feedback": "Нумерация начинается с нуля. ID относится к исходной строке, а не к позиции после сортировки."}, "EN": {"question": "An edge was third in the input and first after sorting. What is its ID?", "options": ["Assign a new one", "2", "0"], "feedback": "IDs are zero-based original row numbers, not sorted positions."}, "answer": 1}, "code": "int n = 3;\nList<List<Integer>> neighbours = new ArrayList<>();\nfor (int v = 0; v < n; v++) neighbours.add(new ArrayList<>());\nneighbours.get(0).add(2);\nneighbours.get(2).add(0);\nSystem.out.println(neighbours.get(0));\nSystem.out.println(neighbours.get(2));", "book": ["20.1", 549, 571, "40graphs"], "videos": [{"id": "7fujbpJ0LB4", "title": "Depth First Search Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/7fujbpJ0LB4/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Создайте список смежности для трёх вершин. Добавьте неориентированное ребро 0–2 и выведите соседей вершин 0 и 2. Какие две записи нужны для одного ребра?", "explanation": ["Для каждой вершины создаём отдельный пустой список.", "Записи 0→2 и 2→0 позволяют пройти по неориентированному ребру в обе стороны.", "Вершина 1 остаётся с пустым списком. Добавьте второе ребро 1–2 и проверьте новые списки."]}, "EN": {"task": "Create adjacency lists for three vertices. Add the undirected edge 0–2 and print the neighbours of 0 and 2. Which two entries represent this one edge?", "explanation": ["Create a separate empty list for each vertex.", "Entries 0→2 and 2→0 allow traversal in both directions along the undirected edge.", "Vertex 1 keeps an empty list. Add edge 1–2 and check the updated lists."]}, "output": "[2]\n[0]"}}, {"id": "dsu", "RU": {"title": "DSU: какие группы уже связаны?", "story": "В учебной группе создаются команды. Сначала каждый работает отдельно. Затем две команды объединяются для совместного проекта. Важно быстро узнать, находятся ли два человека уже в одной команде. Выберите две вершины и объедините их; затем повторите ту же связь.", "steps": ["При объединении разных групп их число уменьшается на один.", "Повторная связь внутри одной группы ничего не меняет.", "DSU хранит представителя группы; сжатие пути ускоряет последующие поиски."], "transfer": "В сеть по одному добавляют соединения между компьютерами. Компьютеры — вершины, новые соединения — операции union. После каждого добавления DSU отвечает, сколько отдельных групп осталось и как велика крупнейшая. Это и есть два числа состояния в задании. Удаления связей здесь не рассматриваются.", "theory": "\n<p class=\"lead\">DSU поддерживает разбиение вершин на непересекающиеся множества. find(v) возвращает представителя множества; union(a,b) объединяет два множества.<\/p>\n<p>В начале каждая вершина является своим корнем: parent[v]=v, size[v]=1. Количество компонент равно n; наибольшая имеет размер 1, а при n=0 - 0. Размер имеет смысл у корня. Вызов union сначала находит оба корня. Если они совпадают, ничего менять не нужно: это относится и к повторной связи, и к объединению вершины с собой.<\/p>\n<h2>Сжатие пути и объединение по размеру<\/h2><p>В двухпроходном варианте find сначала доходит до корня, затем повторно проходит тот же путь и перенаправляет посещённые вершины прямо к корню. Переменная next сохраняет старого родителя до изменения parent[v]. При объединении подвесьте меньший корень к большему, прибавьте размер меньшей компоненты и уменьшите счётчик ровно на один. Не считайте rank размером, если выберете объединение по рангу.<\/p>\n\n<h2>Почему это корректно<\/h2><p>Инвариант: деревья parent задают текущее разбиение на компоненты; size[root] равен числу вершин компоненты. Сжатие меняет форму дерева, но не его корень и не состав множества. Объединение разных корней соединяет ровно две компоненты и не затрагивает остальные. Поэтому после каждой операции сохранённые components и largest описывают текущий граф.<\/p>\n<p><strong>Сложность:<\/strong> O(n+q α(n)) амортизированного времени со сжатием пути и балансировкой. Память DSU O(n), а вместе с массивом всех q ответов - O(n+q). Это не обещание константного времени для каждого отдельного find. Обычный DSU не поддерживает удаление произвольного ребра: для такой задачи нужна другая организация вычислений.<\/p>\n<p>В задании верните массив состояний после операций, без начального состояния. Сохраняйте два числа в каждой строке ответа, а не ссылку на один постоянно изменяемый массив.<\/p>\n<p>В оценке q — число объединений, α(n) — очень медленно растущая обратная функция Аккермана.<\/p>", "code_context": "Фрагмент внутри метода; импортируйте java.util.Arrays для вывода массива. Корень уже известен, выполняется только один шаг второго прохода.", "bridge": "Если 0 связан с 1, а 1 с 2, то все трое находятся в одной группе, даже без прямой связи 0–2. DSU хранит именно это разбиение. Родительские ссылки нужны для поиска представителя; они не обязаны совпадать с реальными кабелями."}, "EN": {"title": "DSU: which groups are already connected?", "story": "Students form project teams. Initially everyone works alone; later, two teams merge. You need to tell whether two people already belong to the same team. Select two vertices and merge their teams, then repeat the same link.", "steps": ["Merging two different groups reduces their count by one.", "A repeated link within one group changes nothing.", "DSU stores a representative; path compression speeds up later searches."], "transfer": "A network receives new computer-to-computer links. Computers are vertices; each added link is a union operation. After each addition, DSU reports the number of groups and the largest group size: the two state values required by the assignment. Link deletion is outside this model.", "theory": "\n<p class=\"lead\">DSU maintains a partition of vertices into disjoint sets. find(v) returns the representative of a set; union(a,b) merges two sets.<\/p>\n<p>Initially each vertex is its own root: parent[v]=v and size[v]=1. There are n components; largest is 1, or 0 when n=0. Component size is meaningful at a root. Union first finds both roots. If they coincide, nothing changes; this covers repeated links and self-unions.<\/p>\n<h2>Path compression and union by size<\/h2><p>A two-pass find walks to the root, then follows the original path again from the starting vertex and points each visited vertex directly at the root. The variable next saves the old parent before overwriting parent[v]. Union attaches the smaller root to the larger one, adds the smaller size and reduces the component count exactly once. If you use rank instead, maintain sizes separately.<\/p>\n\n<h2>Correctness<\/h2><p>Invariant: parent trees represent the current components and size[root] counts their vertices. Compression changes the tree shape without changing its root or membership. Merging different roots joins exactly two components and leaves every other component unchanged. Thus components and largest describe the graph after each operation.<\/p>\n<p><strong>Complexity:<\/strong> O(n+q α(n)) amortised time with compression and balancing. DSU storage is O(n); including q returned states it is O(n+q). This does not claim constant worst-case time for every individual find. Ordinary DSU does not support arbitrary edge deletion.<\/p>\n<p>For the assignment, return a state after each operation, without an initial state. Store a new pair of numbers for each answer, rather than repeatedly storing a reference to one mutable array.<\/p>\n<p>In this bound, q counts union operations and α(n) is the very slowly growing inverse Ackermann function.<\/p>", "code_context": "Method-body fragment; import java.util.Arrays to print the array. The root is already known; this is one step of the second pass.", "bridge": "If 0 is connected to 1 and 1 to 2, all three belong to one group even without a direct 0–2 link. DSU maintains this partition. Parent links help find representatives; they do not have to be actual cables."}, "lab": "dsu", "quiz": {"RU": {"question": "После связей 0–1 и 1–2 добавляем 0–2. Число групп уменьшится?", "options": ["Да, каждое добавленное ребро уменьшает счётчик", "Число групп то же, но размер группы станет 4", "Нет, обе вершины уже в одной группе"], "feedback": "0 и 2 уже связаны через 1. Новое ребро не объединяет разные компоненты."}, "EN": {"question": "After links 0–1 and 1–2, does adding 0–2 reduce the group count?", "options": ["Yes; every added edge reduces the count", "The count stays, but the group size becomes 4", "No; both vertices already share a group"], "feedback": "0 and 2 are already connected through 1, so no distinct components merge."}, "answer": 2}, "code": "int[] parent = {0, 0, 1, 2};\nint v = 3, root = 0;\nint next = parent[v];\nparent[v] = root;\nv = next;\nSystem.out.println(Arrays.toString(parent));\nSystem.out.println(v);", "book": ["19.3–19.4", 527, 549, "15uf"], "videos": [{"id": "ibjEGG7ylHk", "title": "Union Find Introduction", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/ibjEGG7ylHk/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "0jNmHPfA_yE", "title": "Union Find - Union and Find Operations", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/0jNmHPfA_yE/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "VHRhJWacxis", "title": "Union Find Path Compression", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/VHRhJWacxis/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Даны parent=[0,0,1,2], текущая вершина v=3 и уже найденный корень root=0. Напишите один шаг сжатия пути: перенаправьте v к корню, затем перейдите к её прежнему родителю. Не пишите весь find.", "explanation": ["next сохраняет 2 до изменения массива.", "parent[3]=0 сокращает путь для вершины 3; остальные ссылки пока не меняются.", "v=next продолжает проход по прежнему пути. Если сначала перезаписать parent[v], старую ссылку можно потерять."]}, "EN": {"task": "Given parent=[0,0,1,2], current vertex v=3 and an already known root=0, write one compression step: point v to the root, then move to its former parent. Do not write the entire find operation.", "explanation": ["next retains 2 before the array is changed.", "parent[3]=0 shortens the path from vertex 3; the other links remain unchanged for now.", "v=next continues along the original path. Overwriting parent[v] first could lose that link."]}, "output": "[0, 0, 1, 0]\n2"}}, {"id": "mst", "RU": {"title": "Остов или маршрут: какую стоимость уменьшаем?", "story": "Нужно соединить пять комнат кабелем. За каждое проложенное ребро вы платите один раз. Другая задача — пройти из комнаты 0 в комнату 4 с наименьшей стоимостью. Сравните выделенные связи: одинаковые веса не означают одинаковую задачу.", "steps": ["Остов соединяет все вершины компоненты без циклов.", "Маршрут соединяет выбранные начало и конец.", "Краскал и Прим решают первую задачу; кратчайшие пути — вторую."], "transfer": "Нужно проложить кабели между зданиями. Вершины — здания, рёбра — разрешённые трассы, веса — стоимость прокладки. Остов выбирает самый дешёвый набор, соединяющий здания. При этом дерево не имеет резервных связей: требования отказоустойчивости потребуют более сложной модели. В задании верните стоимость, ID выбранных рёбер и число компонент.", "theory": "\n<p class=\"lead\">Выберите рёбра минимальной суммарной стоимости так, чтобы внутри каждой компоненты исходного неориентированного графа все вершины были соединены без циклов.<\/p>\n<p>Для связного графа результат является деревом. Для несвязного - лесом, включая изолированные вершины. При c компонентах лес содержит n−c рёбер. Для n=0 стоимость и число компонент равны нулю. Отрицательный вес допустим: он означает снижение общей стоимости. Даже петлю с отрицательным весом нельзя включать в остов, поскольку она не соединяет разные вершины и образует цикл.<\/p>\n<h2>Свойство разреза<\/h2><p>Разрез делит вершины на две части. Если он не пересекает уже выбранные рёбра, одно из самых лёгких рёбер через этот разрез можно безопасно добавить к некоторому оптимальному остову, содержащему текущие выбранные рёбра. При равных весах безопасное ребро не обязано входить во все оптимальные остовы.<\/p>\n<p>Обоснование заменой: возьмите оптимальный остов без выбранного лёгкого ребра e. Добавление e создаёт цикл. В этом цикле есть другое ребро f через тот же разрез; его вес не меньше веса e. Замените f на e: связность сохранится, стоимость не вырастет. Для леса рассуждение применяется отдельно к каждой исходной компоненте.<\/p>\n<h2>Почему нужны два алгоритма<\/h2><p>Краскал выбирает рёбра глобально по весу и отсеивает циклы через DSU. Прим расширяет одно построенное дерево через минимальное ребро его границы. Они могут выбрать разные ID, но должны вернуть одинаковую оптимальную стоимость и одинаковое количество компонент.<\/p>\n<p>Не путайте стоимость сети со стоимостью пути. Остов может вынуждать длинный обход между двумя вершинами, хотя в исходном графе есть более короткая прямая связь. В задаче маршрутов нужен алгоритм кратчайшего пути.<\/p>\n"}, "EN": {"title": "Spanning tree or route: which cost are we minimising?", "story": "You must connect five rooms with cables and pay for each installed link once. A different task is to travel from room 0 to room 4 as cheaply as possible. Compare the highlighted links: the same weights do not imply the same objective.", "steps": ["A spanning tree connects every vertex of a component without cycles.", "A route connects a chosen source and target.", "Kruskal and Prim solve the first problem; shortest-path algorithms solve the second."], "transfer": "Suppose buildings need cable connections. Vertices are buildings, edges are permitted cable routes, and weights are installation costs. An MST chooses the cheapest set connecting them. A tree provides no redundant links; reliability requirements need a richer model. Return cost, selected edge IDs and component count in the assignment.", "theory": "\n<p class=\"lead\">Select edges of minimum total cost so that every original connected component remains connected without cycles.<\/p>\n<p>A connected graph produces a tree; a disconnected graph produces a forest, including isolated vertices. With c components the forest has n−c edges. For n=0, both cost and component count are zero. Negative weights are valid discounts. Even a negative self-loop cannot be selected: it connects no distinct vertices and forms a cycle.<\/p>\n<h2>The cut property<\/h2><p>A cut partitions the vertices into two sets. If the cut respects the selected edges, a lightest edge crossing it is safe for some optimum containing those selected edges. When weights tie, a safe edge need not belong to every optimum.<\/p>\n<p>Exchange argument: take an optimum without the light edge e. Adding e creates a cycle. That cycle contains another edge f crossing the same cut, with weight at least that of e. Replace f by e; connectivity remains and cost does not increase. For a forest, apply the argument within each original connected component.<\/p>\n<h2>Why implement both methods?<\/h2><p>Kruskal examines globally sorted edges and uses DSU to reject cycles. Prim grows one tree using its cheapest boundary edge. Selected IDs may differ, but optimum costs and component counts must agree.<\/p>\n<p>Network cost is not path cost. A spanning tree may force a long detour between two vertices even when the original graph has a shorter direct connection. Routing requires a shortest-path objective.<\/p>\n"}, "lab": "overview", "quiz": {"RU": {"question": "Почему нельзя использовать сумму весов остова как расстояние от 0 до 4?", "options": ["Остов оплачивает связи всей компоненты", "Остов обязан содержать кратчайший путь между каждой парой", "Нужно просто разделить вес остова на число рёбер"], "feedback": "У этих задач разные объекты оптимизации: вся сеть и один путь."}, "EN": {"question": "Why is a forest’s total weight not the distance from 0 to 4?", "options": ["It pays for links spanning the entire component", "An MST must preserve a shortest path for every pair", "Divide the tree weight by its edge count"], "feedback": "The optimised objects differ: the entire network versus one route."}, "answer": 0}, "code": "", "book": ["21.1", 586, 608, "43mst"], "videos": []}, {"id": "kruskal", "RU": {"title": "Краскал: покупаем дешёвые связи без циклов", "story": "Для пяти комнат подготовили несколько вариантов кабеля. Рассматривайте предложения от дешёвых к дорогим. Перед покупкой ответьте: это ребро действительно соединит две разные части сети или только замкнёт уже существующий путь?", "steps": ["Упорядочьте кандидаты по весу.", "Если концы в разных компонентах, связь полезна: примите её и объедините компоненты.", "Если концы уже связаны, ребро создаст цикл: пропустите его."], "transfer": "В задаче проектирования сети это последовательный выбор наиболее выгодных допустимых соединений. В задании для проверки компонент используйте собственный DSU и сохраните исходные ID. Попробуйте специально неверное решение на схеме: обратная связь объяснит причину.", "theory": "\n<p class=\"lead\">Рассматривайте рёбра в неубывающем порядке веса. Принимайте ребро только тогда, когда его концы принадлежат разным деревьям текущего леса.<\/p>\n<p>Создайте отдельный DSU для этого вызова и пустой список выбранных ID. После сортировки исходные ID должны остаться у рёбер. Успешный union означает, что ребро соединяет разные компоненты и не создаёт цикл. При неуспешном union ребро пропускается. Не останавливайтесь после n−1 попыток: часть рёбер будет отвергнута, а исходный граф может быть несвязным.<\/p>\n\n<h2>Разбор примера<\/h2><p>На схеме пять вершин. При равных весах рассматриваем меньший ID первым. Порядок рёбер: 2, 1, 6, 0, 3, 5, 4. Принимаем ID 2, 1, 6; ID 0 пропускаем, потому что 0 и 1 уже связаны через 2. Затем принимаем ID 3. Рёбра 5 и 4 уже замыкают циклы. Итог: 1+2+2+5=10, четыре ребра и одна компонента: 5−1=4.<\/p>\n<h2>Инвариант и сложность<\/h2><p>Выбранные рёбра образуют лес, расширяемый до оптимального остовного леса. Перед добавлением ребра компонента DSU задаёт допустимый разрез, а рассматриваемое ребро имеет минимальный доступный вес через него. Свойство разреза сохраняет оптимальность. После обработки всех рёбер вершины каждой исходной компоненты соединены.<\/p>\n<p>Сортировка O(m log(m+1)), инициализация O(n), операции DSU амортизированно O(m α(n)). Итоговая граница задания O(n+m log(m+1)); память O(n+m). Возвращайте cost как long, edge_ids как исходные ID, components как число исходных компонент, совпадающее с конечным счётчиком DSU.<\/p>\n", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Рассматривается непустой массив рёбер.", "bridge": "Дешёвое ребро не всегда нужно покупать. Если его концы уже связаны выбранными кабелями, новая покупка добавит цикл. Поэтому решение состоит из двух вопросов: какое ребро следующее по цене и соединяет ли оно разные компоненты?"}, "EN": {"title": "Kruskal: buy cheap links without forming cycles", "story": "Several cable links are available for five rooms. Examine offers from cheapest to most expensive. Before buying one, decide whether it joins two separate network parts or merely closes an existing path.", "steps": ["Order candidate edges by weight.", "If endpoints belong to different components, accept the link and merge the components.", "If the endpoints are already connected, skip the cycle-forming edge."], "transfer": "In network design, this selects the cheapest admissible connections. In the assignment, use your own DSU for component checks and preserve original IDs. Try an incorrect decision in the diagram: feedback explains why it fails.", "theory": "\n<p class=\"lead\">Examine edges in nondecreasing weight order. Accept an edge only if its endpoints belong to different trees of the current forest.<\/p>\n<p>Create a fresh DSU and an empty selected-ID list. Sorting must preserve the IDs stored in edge objects. A successful union means the edge connects distinct components without creating a cycle. A failed union rejects the edge. Do not stop after n−1 examined candidates: some are rejected and the graph may be disconnected.<\/p>\n\n<h2>Worked example<\/h2><p>The diagram has five vertices. Break weight ties by smaller ID in this example. The examination order is 2, 1, 6, 0, 3, 5, 4. Accept IDs 2, 1, 6; skip ID 0 because 0 and 1 are already connected through 2. Then accept ID 3. Edges 5 and 4 close cycles. The result costs 1+2+2+5=10, with four edges and one component: 5−1=4.<\/p>\n<h2>Invariant and complexity<\/h2><p>The selected forest can be extended to an optimum. Before an accepted edge is added, a DSU component defines a cut respected by the forest; the examined edge is a lightest available crossing edge. The cut property preserves optimality. After all edges have been examined, every original component is spanned.<\/p>\n<p>Sorting costs O(m log(m+1)), initialisation O(n), and DSU operations O(m α(n)) amortised. The assignment bound is O(n+m log(m+1)) time and O(n+m) memory. Return long cost, original edge_ids and components, which equals the final DSU count.<\/p>\n", "code_context": "Method-body fragment with no additional imports. The edge array is nonempty.", "bridge": "A cheap edge need not be purchased. If selected cables already connect its endpoints, buying it adds a cycle. Ask two questions: which edge comes next by weight, and does it join distinct components?"}, "lab": "kruskal", "quiz": {"RU": {"question": "Самое дешёвое оставшееся ребро замыкает цикл. Что делать?", "options": ["Начать сортировку заново", "Пропустить", "Взять, потому что оно дешёвое"], "feedback": "Дешевизна не отменяет условие леса. Уже связанные вершины не нужно соединять повторно."}, "EN": {"question": "The cheapest remaining edge closes a cycle. What should happen?", "options": ["Restart sorting", "Skip it", "Take it because it is cheap"], "feedback": "Low cost does not override the forest constraint; connected vertices need no additional link."}, "answer": 1}, "code": "int[][] edges = {{0, 1, 4}, {0, 2, 2}, {1, 2, 1}};\nint bestId = 0;\nfor (int id = 1; id < edges.length; id++) {\n    if (edges[id][2] < edges[bestId][2]) bestId = id;\n}\nSystem.out.println(bestId);", "book": ["21.2", 591, 613, "43mst"], "videos": [{"id": "JZBQLXgSGfs", "title": "Union Find Kruskal's Algorithm", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/JZBQLXgSGfs/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Строки edges имеют вид [u,v,weight]. Найдите ID самого дешёвого ребра, не переставляя строки. При равных весах оставьте меньший ID. Это упражнение на исходные ID, а не на построение остова.", "explanation": ["Здесь ID — номер строки; edges[id][2] — вес. Массив непустой, поэтому можно начать с ID 0.", "Строгое сравнение < сохраняет более ранний ID при равенстве весов.", "Минимальное ребро имеет ID 2 и вес 1. В Краскале одного минимума недостаточно: нужны порядок всех кандидатов и проверка компонент."]}, "EN": {"task": "Each edges row is [u,v,weight]. Find the cheapest edge ID without rearranging rows. Keep the smaller ID on a weight tie. Practise original IDs here, rather than constructing an MST.", "explanation": ["Here the row index is the ID, and edges[id][2] is the weight. The array is nonempty, so ID 0 is a valid initial choice.", "Strict comparison < retains the earlier ID on equal weights.", "The minimum edge has ID 2 and weight 1. Kruskal needs more than one minimum: all candidates in order and connectivity checks."]}, "output": "2"}}, {"id": "prim", "RU": {"title": "Прим: расширяем уже подключённую часть", "story": "Представьте, что электричество уже подведено к комнате 0. Теперь нужно постепенно подключить остальные комнаты. Смотреть на все рёбра сразу не обязательно: интересуют связи от уже подключённой части к новым вершинам. Выберите следующую связь.", "steps": ["Отметьте уже подключённые вершины.", "Найдите самое дешёвое ребро их границы.", "Подключите новую вершину и обновите список кандидатов."], "transfer": "При подключении зданий удобно следить за границей уже соединённой части сети: какой допустимый кабель подключит новое здание дешевле всего? Очередь с приоритетом хранит кандидатов. В задании после завершения одной компоненты начните со следующей непосещённой вершины.", "theory": "\n<p class=\"lead\">Начните с одной вершины и каждый раз присоединяйте новую вершину через самое дешёвое ребро границы уже построенного дерева.<\/p>\n<p>Для каждой исходной компоненты нужен новый старт. Отметьте стартовую вершину, увеличьте components и добавьте её исходящие рёбра в очередь с приоритетом. Извлекая ребро, проверьте его конечную вершину: если она уже посещена, кандидат устарел. Иначе примите ребро, отметьте новую вершину и добавьте её исходящие рёбра к непосещённым вершинам.<\/p>\n\n<h2>Почему нужна проверка после извлечения<\/h2><p>Одну вершину могут предлагать несколько рёбер. После принятия лучшего остальные записи остаются в очереди. Удалять их заранее необязательно: достаточно пропускать записи с уже посещённым концом. Поэтому эта версия называется ленивой. Посещённость нужно проверять при извлечении, а не только при добавлении.<\/p>\n<p>На схеме стартуем из 0 и принимаем ID 1, 2, 3, 6. Общая стоимость после каждого шага: 2, 3, 8, 10. Результат совпадает с
