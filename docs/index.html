 Краскалом по стоимости, хотя порядок выбора иной. Отдельно проверьте в своих тестах изолированную вершину: она добавляет одну компоненту и ни одного ребра. В исходном графе схемы таких вершин нет.<\/p>\n<h2>Корректность и сложность<\/h2><p>Инвариант: принятые рёбра образуют дерево посещённых вершин текущей компоненты и расширяемы до оптимума. После удаления устаревших записей минимальный кандидат является лёгким ребром разреза «посещённые / непосещённые» этой компоненты. Свойство разреза обосновывает выбор.<\/p>\n<p>Ленивая очередь может хранить O(m) записей, поэтому время O(n+m log(m+1)), память O(n+m). Граница O((n+m) log(n+1)) относится к варианту с индексируемой очередью и одной актуальной записью на вершину; для этого варианта используйте границу ленивой версии. Прим должен иметь свою реализацию, а не вызывать Краскала.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.PriorityQueue. Буква L задаёт значения типа long.", "bridge": "Представьте подключённую часть кампуса. Выбирать можно только связь из неё к новой вершине. Старое предложение в очереди могло устареть: пока оно ожидало, его конечная вершина уже подключилась другим ребром. Поэтому проверка нужна при извлечении."}, "EN": {"title": "Prim: extend the connected part", "story": "Room 0 already has power. Extend the connected area to the remaining rooms. You need not inspect every edge equally: consider links from the connected part to new vertices. Choose the next link.", "steps": ["Mark the connected vertices.", "Choose the cheapest edge on their boundary.", "Connect its new endpoint and update the candidates."], "transfer": "When connecting buildings, track the boundary of the connected part: which permitted cable adds a new building at the lowest cost? A priority queue stores candidates. In the assignment, restart from an unvisited vertex after completing each component.", "theory": "\n<p class=\"lead\">Start from one vertex and repeatedly attach an unvisited vertex through the cheapest edge leaving the current tree.<\/p>\n<p>Restart for every original connected component. Mark the start, increment components and add its outgoing edges to a priority queue. When removing an edge, inspect its destination: if already visited, the candidate is stale. Otherwise accept the edge, mark the new vertex and enqueue its edges to unvisited destinations.<\/p>\n\n<h2>Why check again on removal?<\/h2><p>Several edges may offer the same vertex. After its best candidate is accepted, other entries remain in the heap. You need not remove them immediately: skip entries whose destination is already visited. This is the lazy version. Checking only when inserting an edge is insufficient.<\/p>\n<p>Start at 0 in the diagram and accept IDs 1, 2, 3, 6. Running totals are 2, 3, 8, 10. The optimum cost agrees with Kruskal, although the selection order differs. Separately test an isolated vertex: it adds one component and no edge. The displayed graph contains no isolated vertices.<\/p>\n<h2>Correctness and complexity<\/h2><p>Invariant: accepted edges form a tree spanning the currently visited portion of this component and extend to an optimum. After stale entries are removed, the minimum candidate is a light edge of the visited/unvisited cut. The cut property justifies accepting it.<\/p>\n<p>A lazy heap may hold O(m) entries: time is O(n+m log(m+1)) and memory O(n+m). The O((n+m) log(n+1)) bound describes an indexed heap with one active entry per vertex. Use the lazy bound for this variant. Prim must have a separate implementation rather than calling Kruskal.<\/p>\n", "code_context": "Method-body fragment; import java.util.PriorityQueue. The L suffix creates long values.", "bridge": "Picture the connected part of a campus. An eligible edge leaves it for a new vertex. An offer waiting in the queue may become stale because another edge connected its destination. Check again when removing the offer."}, "lab": "prim", "quiz": {"RU": {"question": "Ребро дешёвое, но оба конца уже подключены. Нужно ли его добавлять?", "options": ["Да, если это минимум оставшейся очереди", "Да, если это ребро ещё не добавляли в дерево", "Нет, новая вершина не появится"], "feedback": "Такой кандидат устарел. Прим расширяет дерево, а не накапливает все дешёвые рёбра."}, "EN": {"question": "An edge is cheap, but both endpoints are already connected. Add it?", "options": ["Yes, if it is the remaining queue minimum", "Yes, if this edge has not been selected before", "No; it adds no new vertex"], "feedback": "That candidate is stale. Prim grows a tree rather than accumulating every cheap edge."}, "answer": 2}, "code": "PriorityQueue<Long> offers = new PriorityQueue<>();\noffers.add(9L);\noffers.add(3L);\noffers.add(7L);\nSystem.out.println(offers.remove());\nSystem.out.println(offers.peek());", "book": ["21.2", 591, 613, "43mst"], "videos": [{"id": "jsmMtJpPnhU", "title": "Prim's Minimum Spanning Tree Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/jsmMtJpPnhU/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Добавьте предложения стоимости 9, 3 и 7 в очередь с приоритетом. Извлеките минимум, затем посмотрите следующий минимум, не удаляя его. Предскажите оба числа до запуска.", "explanation": ["Очередь с естественным порядком Long возвращает наименьшее число.", "remove() возвращает и удаляет 3; peek() показывает 7, оставляя его в очереди.", "Для Прима кандидат должен также хранить концы и ID ребра. Одного веса недостаточно, чтобы проверить новую вершину."]}, "EN": {"task": "Insert offers costing 9, 3 and 7 into a priority queue. Remove the minimum, then inspect the next minimum without removing it. Predict both values before running.", "explanation": ["A queue using the natural Long order returns the smallest value.", "remove() returns and removes 3; peek() reports 7 while retaining it.", "A Prim candidate also needs endpoints and an edge ID. A weight alone cannot identify the new vertex."]}, "output": "3\n7"}}, {"id": "dfs", "RU": {"title": "DFS: пройти ветку и вернуться к незавершённому", "story": "Вы проверяете зависимости программы. Дойдите по одной цепочке до конца, затем вернитесь к месту, где остались непроверенные связи. Смотрите на стек: он показывает, какую работу обход ещё не закончил.", "steps": ["Обнаружить вершину — ещё не значит завершить её.", "Завершение наступает после обработки всех её исходящих связей.", "Для глубокого графа храните вершину и позицию следующего соседа в явном стеке."], "transfer": "Так обходят структуры каталогов и графы зависимостей; похожий порядок нужен для SCC и топологической сортировки. В задании важно не перепутать порядок обнаружения с порядком завершения. В отдельном учебном BFS-примере очередь устроена иначе — сравните поведение двух структур.", "theory": "\n<p class=\"lead\">Для Косарайю и топологической сортировки важен момент завершения вершины. Стек должен сохранять незаконченный обход, а не только список найденных вершин.<\/p>\n<p>Рекурсивный DFS запоминает в стеке вызовов вершину и позицию следующего соседа. На цепочке из 100000 вершин это может переполнить стек. В явной реализации вершины находятся в ArrayDeque, а cursor[v] хранит номер следующего ещё не просмотренного соседа. У вершины три состояния: 0 - не посещена; 1 - активна и находится в текущем стеке; 2 - завершена.<\/p>\n<h2>Одна итерация<\/h2><ol><li>Посмотрите на верхний элемент стека, не удаляя его.<\/li><li>Если все соседи обработаны, удалите вершину, пометьте её завершённой и добавьте в finish.<\/li><li>Иначе получите следующего соседа и сразу увеличьте cursor.<\/li><li>Соседа в состоянии 0 активируйте и положите в стек. Ребро в состояние 1 отмечает цикл. Состояние 2 не требует повторного обхода.<\/li><\/ol>\n<p>Без cursor повторное начало списка соседей может увеличить время до квадратичного. Если помечать вершину завершённой сразу после добавления соседей в стек, активный путь будет потерян: такой код не имитирует нужный DFS.<\/p>\n<h2>Смысл finish<\/h2><p>На цепочке 0→1→2 сначала завершается 2, затем 1, затем 0. finish=[2,1,0]. Порядок обнаружения [0,1,2] и порядок завершения - разные последовательности. В Косарайю нужен именно второй. В топологической сортировке при отсутствии циклов нужен его разворот.<\/p>\n<p>Внешний цикл запускает обход из каждой ещё не посещённой вершины. Поэтому изолированные вершины и компоненты, недостижимые из первой вершины, не теряются. Время O(n+m), память O(n+m) вместе со списками смежности; дополнительное состояние обхода O(n). Проверка циклов не мешает использовать finish в первом проходе Косарайю: исходный граф там вправе иметь циклы.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.ArrayDeque. Он показывает порядок извлечения из стека, а не моменты завершения DFS.", "bridge": "Когда обход уходит от 0 к 1, работа вершины 0 ещё не закончена: у неё может остаться другой сосед. Запись стека сохраняет место продолжения. В finish вершина попадает после последнего соседа, а не при первом посещении."}, "EN": {"title": "DFS: follow a branch and return to unfinished work", "story": "You are inspecting program dependencies. Follow one chain to its end, then return to where unexplored links remain. Watch the stack: it records traversal work that is still unfinished.", "steps": ["Discovering a vertex does not finish it.", "It finishes after all outgoing links have been processed.", "On deep graphs, explicitly store both the vertex and its next-neighbour position."], "transfer": "This pattern appears in directory traversal and dependency analysis, and supports SCC and topological ordering. Do not confuse discovery and finish order. The separate BFS example uses a queue instead; compare how the two structures behave.", "theory": "\n<p class=\"lead\">Kosaraju and topological ordering need finish events. An explicit stack must preserve suspended traversal progress, not merely discovered vertices.<\/p>\n<p>Recursive DFS remembers a vertex and the position of its next neighbour in the call stack. A chain of 100000 vertices may overflow that stack. Here ArrayDeque stores active vertices and cursor[v] stores the next adjacency-list position. States are 0 = unvisited, 1 = active on the current stack and 2 = finished.<\/p>\n<h2>One iteration<\/h2><ol><li>Inspect the stack top without removing it.<\/li><li>If all neighbours are processed, pop the vertex, mark it finished and append it to finish.<\/li><li>Otherwise read the next neighbour and advance cursor immediately.<\/li><li>Push a state-0 neighbour after activating it. An edge to state 1 marks a cycle. State 2 needs no further traversal.<\/li><\/ol>\n<p>Without cursor, restarting a neighbour scan can make the algorithm quadratic. Marking a vertex finished as soon as its neighbours are pushed loses the active path and does not simulate the required DFS.<\/p>\n<h2>What finish records<\/h2><p>On 0→1→2, vertex 2 finishes first, then 1, then 0: finish=[2,1,0]. Discovery order [0,1,2] is a different sequence. Kosaraju needs finish order; topological ordering reverses it when no cycle exists.<\/p>\n<p>The outer loop starts from every unvisited vertex, preserving isolates and components unreachable from the first start. Time is O(n+m); memory including adjacency lists is O(n+m), with O(n) additional traversal state. Recording a cycle does not prevent using finish in Kosaraju's first pass: its original graph may contain cycles.<\/p>\n", "code_context": "Method-body fragment; import java.util.ArrayDeque. It demonstrates stack removal order, not DFS finish events.", "bridge": "When DFS descends from 0 to 1, work at 0 is unfinished: another neighbour may remain. A stack frame remembers where to resume. Append a vertex to finish after its last neighbour, rather than on first discovery."}, "lab": "dfs", "quiz": {"RU": {"question": "На цепочке 0→1→2 какая вершина завершится первой?", "options": ["2", "0 — она обнаружена первой", "1 — она соединяет начало с концом"], "feedback": "У 2 нет следующего непроверенного соседа; только после неё могут завершиться 1 и 0."}, "EN": {"question": "On 0→1→2, which vertex finishes first?", "options": ["2", "0, because it was discovered first", "1, because it connects the ends"], "feedback": "Vertex 2 has no unexplored neighbour; only then can 1 and 0 finish."}, "answer": 0}, "code": "ArrayDeque<Integer> pending = new ArrayDeque<>();\npending.push(4);\npending.push(7);\nSystem.out.println(pending.pop());\nSystem.out.println(pending.peek());", "book": ["20.3", 563, 585, "42digraph"], "videos": [{"id": "7fujbpJ0LB4", "title": "Depth First Search Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/7fujbpJ0LB4/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Используйте ArrayDeque как стек. Положите 4, затем 7; извлеките верхний элемент и посмотрите, что осталось сверху. Объясните, почему порядок отличается от очереди.", "explanation": ["push добавляет на вершину стека. Последним добавили 7.", "pop удаляет 7, после чего peek показывает 4 без удаления.", "В DFS стек хранит активные вершины; для правильных завершений нужно также помнить прогресс просмотра соседей."]}, "EN": {"task": "Use ArrayDeque as a stack. Push 4, then 7; pop the top value and inspect the remaining top. Explain why this differs from a queue.", "explanation": ["push adds to the stack top. The last value pushed is 7.", "pop removes 7, after which peek reports 4 without removing it.", "DFS stores active vertices in a stack; correct finish events also require retaining neighbour traversal progress."]}, "output": "7\n4"}}, {"id": "scc", "RU": {"title": "SCC: можно ли вернуться обратно?", "story": "Между модулями программы есть направленные зависимости. Из A можно попасть в B, но есть ли путь назад? Выберите вершину: одним цветом выделятся только те вершины, между которыми есть пути в обе стороны. Затем сожмите каждую такую группу.", "steps": ["Проверьте достижимость в обе стороны.", "Объедините максимальные взаимно достижимые группы.", "Сохраните связи между группами, убрав внутренние рёбра и повторы."], "transfer": "В графе модулей ребро A→B может означать, что A зависит от B. Взаимно зависимые модули образуют SCC: их изменения приходится согласовывать. Конденсация показывает зависимости между такими группами, но не устраняет внутренний цикл. В задании найдите компоненты алгоритмом Косарайю.", "theory": "\n<p class=\"lead\">SCC - максимальное множество вершин, в котором из любой вершины можно попасть в любую другую по направленным путям.<\/p>\n<p>Обычная связность без учёта направления не подходит. Ребро A→B не доказывает возможность вернуться из B в A. Косарайю использует два полных прохода: сначала DFS исходного графа с записью завершений; затем обход транспонированного графа в порядке убывания времени завершения первого прохода. Можно поменять графы местами, но второй обязан быть транспонированным относительно первого.<\/p>\n<h2>Пример<\/h2><p>На схеме рёбра 0→1, 1→2, 2→0, 2→3, 3→4, 4→3; вершина 5 изолирована. Компоненты: A={0,1,2}, B={3,4}, C={5}. В конденсации остаётся A→B, а C изолирована. Если развернуть все стрелки, состав компонент сохранится, а связь между A и B станет B→A. Кнопка «Сжать группы» показывает конденсацию исходного графа.<\/p>\n<h2>Почему второй проход выделяет ровно одну SCC<\/h2><p>Сожмите SCC в вершины: получится DAG. Если в нём есть дуга A→B, максимальное время завершения в A больше максимального времени завершения в B. Во втором проходе по транспонированному графу компонента с наибольшим оставшимся завершением не имеет исходящего пути в другую ещё не отмеченную компоненту. Поэтому обход не выйдет из неё, но достигнет всех её вершин.<\/p>\n<h2>Конденсация в коде<\/h2><p>Метки можно выбрать компактными: 0..k−1. Сгруппируйте вершины по метке и просмотрите исходящие рёбра каждой группы. Инициализируйте seenFrom значением −1, которое не является меткой компоненты. Массив seenFrom[target] запоминает, из какой исходной компоненты уже добавлена пара в target. Проверка target!=from исключает внутренние рёбра. Это удаляет дубликаты за детерминированное O(n+m) без сортировки пар. Альтернатива - хеш-множество пар с ожидаемым O(n+m).<\/p>\n<p>Оба обхода, транспонирование и конденсация занимают O(n+m) времени и памяти. Для n=0 оба массива ответа пусты. В задании метки могут быть любыми неотрицательными числами, если они задают правильное разбиение. Не сравнивайте label-массивы двух решений буквально. В анализе зависимостей SCC обнаруживает взаимозависимую группу; сжатие группы не устраняет её внутренний конфликт расписания.<\/p>\n", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Метки уже даны; это проверка результата, а не реализация Косарайю.", "bridge": "Связь A→B сама по себе не делает две группы одной SCC. Нужен также путь из B обратно в A. Когда группы уже найдены, несколько исходных связей A→B превращаются в одну пару конденсации; внутренние связи в этот список не входят."}, "EN": {"title": "SCC: can you get back?", "story": "Program modules have directed dependencies. A path leads from A to B, but can you get back? Select a vertex to highlight exactly the vertices mutually reachable with it, then contract each group.", "steps": ["Check reachability in both directions.", "Identify maximal mutually reachable groups.", "Keep links between groups, removing internal edges and duplicate pairs."], "transfer": "In a module graph, A→B may mean that A depends on B. Mutually dependent modules form SCCs, whose changes need coordination. Condensation shows dependencies between these groups without resolving internal cycles. Use Kosaraju to find components in the assignment.", "theory": "\n<p class=\"lead\">An SCC is a maximal set in which every vertex can reach every other vertex using directed paths.<\/p>\n<p>Undirected connectivity is insufficient: A→B does not imply a return path. Kosaraju first runs DFS on the original graph and records finish events. It then traverses the transpose in decreasing first-pass finish order. Starting on the transpose is also valid if the second pass uses the original graph.<\/p>\n<h2>Example<\/h2><p>The diagram contains 0→1, 1→2, 2→0, 2→3, 3→4, 4→3; vertex 5 is isolated. Its SCCs are A={0,1,2}, B={3,4}, C={5}. Condensation retains A→B, with C isolated. Transposing all edges preserves membership and changes A→B to B→A. “Contract the groups” displays condensation of the original graph.<\/p>\n<h2>Why the second pass isolates one SCC<\/h2><p>Contract the SCCs into a DAG. For a condensation edge A→B, the largest finish time in A exceeds the largest finish time in B. In the transpose, the remaining component with largest finish time has no outgoing path into another unassigned component. The next traversal therefore stays inside it and reaches all of its vertices.<\/p>\n<h2>Building condensation<\/h2><p>A possible implementation uses compact labels 0..k−1. Group vertices by label and scan outgoing edges for each group. Initialise seenFrom to −1, which is not a component label. The array seenFrom[target] records which source component has already emitted a pair to target. The condition target!=from excludes internal edges. This removes duplicates in deterministic O(n+m) time without sorting pairs. A hash set of pairs is an alternative with expected O(n+m) time.<\/p>\n<p>The traversals, transpose and condensation use O(n+m) time and memory. For n=0 both output arrays are empty. Assignment labels may be any nonnegative integers defining the correct partition; do not compare two label arrays literally. In dependency analysis, an SCC identifies a mutually dependent group; contracting it does not resolve its internal scheduling conflict.<\/p>\n", "code_context": "Method-body fragment with no additional imports. Labels are given; this checks a result rather than implementing Kosaraju.", "bridge": "A link A→B alone does not merge two groups into one SCC. A return path from B to A is also required. Once groups are known, multiple original A→B links become one condensation pair; internal links are omitted."}, "lab": "scc", "quiz": {"RU": {"question": "Есть путь A→B, но нет пути B→A. Это одна SCC?", "options": ["Да, если убрать направления, они связаны", "Нет: нужен и обратный путь", "Да: достаточно пути хотя бы в одну сторону"], "feedback": "Внутри SCC достижимость должна быть взаимной, а не только односторонней."}, "EN": {"question": "A reaches B, but B cannot reach A. Are they in one SCC?", "options": ["Yes; they connect when directions are ignored", "No; a return path is also required", "Yes; a path in either direction suffices"], "feedback": "SCC membership requires mutual, not one-way, reachability."}, "answer": 1}, "code": "int[] component = {0, 0, 0, 1, 1, 2};\nSystem.out.println(component[0] == component[2]);\nSystem.out.println(component[2] == component[3]);", "book": ["20.5", 576, 598, "42digraph"], "videos": [{"id": "RpgcYiky7uw", "title": "Strongly Connected Components Kosaraju's Algorithm Graph Algorithm", "author": "Tushar Roy - Coding Made Simple", "thumbnail": "https://i.ytimg.com/vi/RpgcYiky7uw/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Метки компонент уже вычислены: [0,0,0,1,1,2]. Напишите проверку: находятся ли вершины 0 и 2 в одной компоненте? А 2 и 3? Здесь не нужно вычислять сами SCC.", "explanation": ["Индекс массива — вершина, значение — метка её компоненты.", "У 0 и 2 одна метка 0; у 2 и 3 метки различаются.", "Сравнивайте равенство меток, а не их величину. Номера компонент не являются расстояниями или порядком вершин."]}, "EN": {"task": "Component labels are already given: [0,0,0,1,1,2]. Check whether vertices 0 and 2 share a component, then check 2 and 3. Do not compute the SCCs in this exercise.", "explanation": ["The array index identifies a vertex; its value labels that vertex’s component.", "Vertices 0 and 2 both have label 0; vertices 2 and 3 have different labels.", "Compare label equality, not magnitude. Component numbers are neither distances nor vertex positions."]}, "output": "true\nfalse"}}, {"id": "topo", "RU": {"title": "Зависимости: что можно сделать следующим?", "story": "Чтобы выпустить приложение, сначала подготовьте данные, затем API и интерфейс, после них тесты и релиз. Выберите следующую работу так, чтобы все её предпосылки уже были выполнены. Потом добавьте циклическую зависимость и попробуйте построить порядок снова.", "steps": ["Ребро u→v означает: u должно быть раньше v.", "Допустимых порядков может быть несколько: независимые работы иногда можно переставлять.", "Цикл делает полный порядок невозможным; DFS обнаруживает его через активную вершину."], "transfer": "При сборке проекта библиотеку-предпосылку нужно собрать раньше зависящего от неё модуля: направьте ребро от предпосылки к потребителю. Топологический порядок даёт допустимую последовательность. Независимые задачи иногда можно выполнять параллельно, но сам порядок не рассчитывает сроки и загрузку исполнителей. В задании используйте DFS с тремя состояниями.", "theory": "\n<p class=\"lead\">Для каждого ребра u→v вершина u должна стоять раньше v. Такой порядок существует тогда и только тогда, когда направленный граф ацикличен.<\/p>\n<p>Если DFS видит ребро v→u в активную вершину u, в текущем стеке уже есть путь u→…→v. Новое ребро замыкает направленный цикл. Напротив, ребро в завершённую вершину само по себе цикла не доказывает. Например, для рёбер 0→1, 0→2, 2→1 вершина 1 может быть завершена к моменту просмотра 2→1; граф остаётся DAG.<\/p>\n<h2>Разворот завершений<\/h2><p>При отсутствии циклов для каждого ребра u→v вершина v завершится раньше u: либо DFS обойдёт её из u, либо она уже была завершена. Поэтому в развёрнутом finish вершина u стоит раньше v. Добавляйте каждую вершину ровно один раз, включая изолированные вершины.<\/p>\n<p>Для цепочки 0→1→2 finish=[2,1,0], ответ [0,1,2]. Для 0→1, 1→0 результат acyclic=false и order=[]. Петля тоже цикл. Для пустого графа верните acyclic=true и пустой order. Используйте явный DFS с сохранением позиции следующего соседа.<\/p>\n<h2>Применение и границы модели<\/h2><p>В системе сборки u→v означает, что v зависит от u. Топологический порядок задаёт допустимую последовательность сборки. Он не определяет оптимальное расписание нескольких исполнителей и не учитывает длительности задач. Для этого потребуются дополнительные данные и алгоритмы.<\/p>\n<p>Время O(n+m), память O(n+m). Проверяйте все компоненты: цикл в отдельной части графа делает невозможным порядок всего графа. В задании требуется DFS с тремя состояниями. Алгоритм Кана полезен как независимая проверка в тестах, но не заменяет требуемую реализацию.<\/p>\n", "code_context": "Фрагмент внутри метода; импортируйте java.util.Arrays. В этом упражнении order уже является перестановкой 0..4.", "bridge": "Порядок — список вершин в порядке выполнения. position — ответ на обратный вопрос: на каком месте стоит конкретная вершина? Для зависимости u→v сравнивайте position[u] и position[v], а не сами номера u и v."}, "EN": {"title": "Dependencies: what can happen next?", "story": "To release an application, prepare data, then API and interface, followed by tests and release. Choose the next task only after its prerequisites are done. Then introduce a circular dependency and try again.", "steps": ["An edge u→v requires u before v.", "Independent tasks may be reordered, so valid orders need not be unique.", "A cycle prevents a full order; DFS detects it through an active vertex."], "transfer": "A build system must compile a prerequisite library before a dependent module: direct each edge from prerequisite to consumer. A topological order gives a valid sequence. Independent tasks may run in parallel, but the order alone does not optimise durations or worker allocation. The assignment requires three-state DFS.", "theory": "\n<p class=\"lead\">For each edge u→v, u must precede v. Such an ordering exists exactly when the directed graph is acyclic.<\/p>\n<p>An edge v→u to an active vertex u closes a cycle because the current DFS stack already contains a path u→…→v. An edge to a finished vertex alone proves no cycle. In the graph 0→1, 0→2, 2→1, vertex 1 may already be finished when 2→1 is examined; the graph is still acyclic.<\/p>\n<h2>Reverse finish order<\/h2><p>Without cycles, every edge u→v has v finishing before u: DFS either explores v from u, or v has already finished. Reversing finish therefore places u before v. Include each vertex once, including isolates.<\/p>\n<p>For 0→1→2, finish=[2,1,0] and the order is [0,1,2]. For 0→1 and 1→0, return acyclic=false and order=[]. A self-loop is also a cycle. The empty graph returns acyclic=true and an empty order. Use explicit DFS with a saved next-neighbour position.<\/p>\n<h2>Applications and model limits<\/h2><p>In a build system, u→v means that v depends on u. A topological order is a valid build sequence. It does not optimise a schedule for several workers or account for task durations; those require additional data and algorithms.<\/p>\n<p>Time and memory are O(n+m). Check every component: a cycle in a separate part still prevents an order for the whole graph. The assignment requires three-state DFS. Kahn's algorithm is useful as an independent test oracle, but does not replace the required implementation.<\/p>\n", "code_context": "Method-body fragment; import java.util.Arrays. In this exercise, order is already a permutation of 0..4.", "bridge": "An order lists vertices in execution sequence. position answers the reverse question: where does a particular vertex appear? For dependency u→v, compare position[u] and position[v], rather than the vertex numbers."}, "lab": "topo", "quiz": {"RU": {"question": "Две работы не зависят друг от друга. Можно ли поменять их местами?", "options": ["Да, отсутствие прямого ребра всегда разрешает перестановку", "Нет, допустимый порядок всегда единственный", "Да, если остальные зависимости соблюдены"], "feedback": "Топологический порядок может быть неоднозначным. Проверяйте все рёбра, а не совпадение с образцом."}, "EN": {"question": "Two tasks are independent. May their order be swapped?", "options": ["Yes; no direct edge always permits a swap", "No; a valid order is always unique", "Yes, if other dependencies remain satisfied"], "feedback": "Topological orders may be non-unique. Check every edge rather than matching a reference sequence."}, "answer": 2}, "code": "int[] order = {2, 0, 1, 3, 4};\nint[] position = new int[order.length];\nfor (int i = 0; i < order.length; i++) position[order[i]] = i;\nSystem.out.println(Arrays.toString(position));\nSystem.out.println(position[1] < position[3]);", "book": ["20.4", 573, 595, "42digraph"], "videos": [{"id": "eL-KzMXSXXI", "title": "Topological Sort Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/eL-KzMXSXXI/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Для отдельного графа с единственным ребром 1→3 предложен порядок [2,0,1,3,4]. Постройте position[v] — позицию каждой вершины — и проверьте это ребро. Не путайте порядок и массив позиций.", "explanation": ["order[i] отвечает, какая вершина стоит на месте i. position[v] отвечает, где стоит вершина v.", "Вершина 1 находится на позиции 2, вершина 3 — на позиции 3: зависимость соблюдена.", "Для проверки целого графа нужно проверить все рёбра и убедиться, что order является перестановкой вершин."]}, "EN": {"task": "For a separate graph containing only edge 1→3, consider order [2,0,1,3,4]. Build position[v], the position of each vertex, and check the edge. Distinguish the order from its inverse position array.", "explanation": ["order[i] tells which vertex occupies position i; position[v] tells where vertex v occurs.", "Vertex 1 is at position 2 and vertex 3 at position 3, so this dependency is satisfied.", "Checking a whole graph requires checking every edge and verifying that order is a vertex permutation."]}, "output": "[1, 2, 0, 3, 4]\ntrue"}}, {"id": "dag", "RU": {"title": "DAG: выбираем выгодный маршрут по этапам", "story": "Заказ проходит несколько этапов обработки. Каждый переход имеет стоимость; возвратов к пройденным этапам нет. Пройдите расчёт по шагам. Затем включите скидку на одном переходе: посмотрите, почему маршрут с более дорогим первым шагом может стать выгоднее.", "steps": ["Начальная стоимость источника — 0; неизвестные расстояния обозначайте null.", "В топологическом порядке сравнивайте стоимость уже известного пути с новым кандидатом.", "При улучшении запоминайте ребро, чтобы затем восстановить маршрут."], "transfer": "Деталь можно обработать несколькими способами. Вершина — состояние детали после этапа, ребро — допустимый следующий переход, вес — его стоимость. Среди альтернатив нужен самый дешёвый полный маршрут. Модель подходит, если переходы не возвращают к прежним состояниям. В задании проверьте весь граф на циклы, включая недостижимую часть.", "theory": "\n<p class=\"lead\">Найдите минимальную стоимость пути из source до каждой вершины. Обработка в топологическом порядке позволяет учесть и отрицательные веса.<\/p>\n<p>Сначала проверьте весь граф на циклы. В задании даже цикл, недостижимый из source, требует acyclic=false и пустых distance/parent_edge. Если граф ацикличен, задайте distance[source]=0; остальные расстояния - null, родители - −1. Просматривайте вершины в топологическом порядке и пропускайте недостижимые.<\/p>\n<h2>Релаксация<\/h2><p>Для ребра u→v веса w посчитайте candidate=distance[u]+w. Если v ещё недостижима или candidate меньше текущего расстояния, обновите distance[v] и parent_edge[v]. В parent_edge храните исходный ID ребра, не номер u. При равенстве можно оставить прежнее ребро: обе кратчайшие пути допустимы.<\/p>\n\n<p>В исходном режиме веса: 0→1:5, 0→2:2, 1→3:2, 2→3:4, 3→4:3, 2→4:9. После пяти этапов distance=[0,5,2,6,9], путь к 4 — 0→2→3→4. Нажмите «Включить скидку −4»: изменится только вес 1→3, а расчёт начнётся заново. Теперь distance=[0,5,2,1,4], путь — 0→1→3→4. Кнопка «Изолированная вершина» добавляет вершину 5 и null в конец массива. «Только путь до 4» выделяет рёбра одного маршрута вместо всего дерева родителей.<\/p>\n<h2>Почему одного прохода достаточно<\/h2><p>Перед обработкой v уже обработаны все возможные предшественники v в топологическом порядке. Следовательно, все пути из источника в v уже рассмотрены через последние рёбра. Минимальное значение distance[v] окончательно. Знак веса на это рассуждение не влияет, а отсутствие циклов не даёт вернуться к уже обработанному предшественнику.<\/p>\n<p>Время O(n+m), память O(n+m). Не используйте Дейкстру при разрешённых отрицательных весах. Число −1 может быть правильным расстоянием; недостижимость обозначается только null. Для конечных сумм используйте long; при данных ограничениях полный простой путь помещается в 64 бита. В приложениях с поэтапными состояниями такой проход является динамическим программированием по графу зависимостей.<\/p>\n", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Long допускает null; long хранит конечную сумму.", "bridge": "Сравнивайте стоимость всего маршрута до цели, а не только вес последнего ребра. Скидка −4 после уже потраченных 5 даёт 1. Если лучшая стоимость меняется, сохраните вместе с ней ID перехода: по нему потом проверяется выбранный маршрут."}, "EN": {"title": "DAG: choose a low-cost route through stages", "story": "An order passes through processing stages. Each transition costs something, and transitions cannot return to earlier stages. Step through the calculation, then enable a discount and see why a more expensive first step can lead to a cheaper route.", "steps": ["The source distance is 0; use null for unreachable vertices.", "In topological order, compare the current distance with each new candidate.", "When improving a distance, retain its edge for route reconstruction."], "transfer": "A workpiece can follow alternative processing routes. A vertex is its state after a stage, an edge is a permitted next transition, and its weight is the transition cost. Choose the cheapest complete route. This model applies when transitions cannot return to earlier states. In the assignment, check the whole graph for cycles, including unreachable parts.", "theory": "\n<p class=\"lead\">Find a minimum-cost path from source to every vertex. Topological processing supports negative edge weights.<\/p>\n<p>Check the entire graph for cycles first. Even a cycle unreachable from source requires acyclic=false and empty distance/parent_edge arrays in this assignment. Otherwise set distance[source]=0; all other distances are null and parents are −1. Process vertices in topological order, skipping unreachable ones.<\/p>\n<h2>Relaxation<\/h2><p>For edge u→v of weight w, compute candidate=distance[u]+w. If v is unreachable or candidate is smaller, update distance[v] and parent_edge[v]. Store the original edge ID, not vertex u. On a tie you may retain the previous parent: both shortest witnesses are acceptable.<\/p>\n\n<p>Default weights are 0→1:5, 0→2:2, 1→3:2, 2→3:4, 3→4:3, 2→4:9. After five stages, distance=[0,5,2,6,9], with route 0→2→3→4 to vertex 4. “Enable discount −4” changes only weight 1→3 and restarts the calculation. Now distance=[0,5,2,1,4], with route 0→1→3→4. “Isolated vertex” adds vertex 5 and a final null entry. “Only the route to 4” highlights one route instead of the entire parent tree.<\/p>\n<h2>Why one pass is sufficient<\/h2><p>Before v is processed, all its possible predecessors have already been processed. Every source-to-v path has therefore been considered through its final edge. The minimum distance[v] is final. Weight signs do not affect this argument; acyclicity prevents returning to an already processed predecessor.<\/p>\n<p>Time and memory are O(n+m). Do not use Dijkstra when negative weights are permitted. −1 may be a valid distance; only null represents unreachable. Use long for finite sums; the published bounds keep a simple path's total within 64 bits. In applications with staged states, this is dynamic programming over a dependency graph.<\/p>\n", "code_context": "Method-body fragment with no additional imports. Long permits null; long holds a finite sum.", "bridge": "Compare the full route cost to a destination, rather than only its last edge weight. A discount of −4 after a cost of 5 gives 1. When the best cost changes, save its edge ID too so the selected route can later be checked."}, "lab": "dag", "quiz": {"RU": {"question": "Текущее расстояние 6, новый кандидат 5+(−4)=1. Какое оставить?", "options": ["1", "6", "null"], "feedback": "Сравнивайте полную стоимость пути. Отрицательные веса допустимы в DAG."}, "EN": {"question": "The current distance is 6; a new candidate is 5+(−4)=1. Which should remain?", "options": ["1", "6", "null"], "feedback": "Compare total path costs. Negative weights are valid in a DAG."}, "answer": 0}, "code": "Long current = 6L;\nlong candidate = 5L + (-4L);\nif (current == null || candidate < current) current = candidate;\nSystem.out.println(current);", "book": ["22.2", 616, 638, "44sp"], "videos": [{"id": "TXkDpqjDMHA", "title": "Shortest/Longest path on a Directed Acyclic Graph (DAG)  | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/TXkDpqjDMHA/hqdefault.jpg", "verified": "2026-10-19"}], "practice": {"RU": {"task": "Текущая лучшая стоимость — 6. Новый путь приходит из вершины со стоимостью 5 по ребру веса −4. Напишите одно обновление минимума и выведите результат. Затем проверьте тот же код с current=null.", "explanation": ["candidate — полная стоимость нового пути: 5−4=1.", "Если стоимости ещё нет или кандидат меньше, сохраняем кандидата. || проверяет правую часть только когда current не равен null.", "При current=null результат тоже 1. В полном алгоритме такую проверку выполняют для рёбер из достижимых вершин в топологическом порядке."]}, "EN": {"task": "The current best cost is 6. A new route arrives from a vertex costing 5 along an edge of weight −4. Write one minimum update and print the result. Then test the same code with current=null.", "explanation": ["candidate is the entire new route cost: 5−4=1.", "Store the candidate if no cost is known or the candidate is smaller. With ||, the right-hand comparison is evaluated only when current is non-null.", "Starting with current=null also gives 1. The full algorithm applies this update to edges from reachable vertices in topological order."]}, "output": "1"}}, {"id": "route", "RU": {"title": "От стоимости к самому маршруту", "story": "Стоимость пути сама по себе не объясняет, какие переходы выбрать. Нужна последовательность вершин и рёбер. Пройдите расчёт ниже до конца, нажмите «Только путь до 4» и сравните результат со скидкой и без неё.", "steps": ["Вспомните последнее ребро пути к цели.", "Перейдите к его началу и повторяйте, пока не дойдёте до источника.", "Разверните собранную последовательность: вы шли от цели назад."], "transfer": "В навигации результат должен быть объяснимым: путь, направление и сумма весов. Для параллельных рёбер нужен ID конкретного ребра. В задании вы сами реализуете функцию восстановления и проверите источник, достижимую и недостижимую цели.", "theory": "<h3>Что проверить в своей функции<\/h3><p>Родительское ребро должно заканчиваться в текущей вершине, а цепочка вести к source. Проверьте границы ID, направление, отсутствие зацикливания и совпадение суммы весов с distance. Для source маршрут [source]; для недостижимой цели выберите и опишите результат, например []. Не используйте −1 как недостижимое расстояние: это допустимая стоимость.<\/p><p>Восстановление пути из L вершин занимает O(L), если ребро находится по исходному ID за O(1). Проверьте достижимую цель, источник, недостижимую цель и равные/параллельные рёбра. Код этой функции вы пишете самостоятельно.<\/p>", "code_context": "Фрагмент внутри метода, дополнительные импорты не нужны. Исходные ID совпадают с номерами строк links.", "bridge": "ID 4 означает пятую строку edges, а не вершину 4 и не стоимость 4. Для направленного ребра строка [from,to,weight] указывает, откуда пришли в to. В проверке уже заданной последовательности переходов, наоборот, идите от source вперёд."}, "EN": {"title": "From a cost to the actual route", "story": "A route cost does not tell you which transitions to take. You also need its vertices and edges. Complete the calculation below, select “Only the route to 4”, and compare the routes with and without the discount.", "steps": ["Read the final edge of the route to the target.", "Move to its origin and repeat until the source.", "Reverse the collected sequence, because the walk went backwards."], "transfer": "Navigation needs an explainable result: route, direction and total cost. Parallel links require the specific edge ID. Implement your own route helper and test the source, a reachable target and an unreachable target.", "theory": "<h3>Check your helper<\/h3><p>Each parent edge must end at the current vertex and the chain must lead to source. Check ID bounds, direction, termination and agreement between the weight sum and distance. The source route is [source]. Choose and document a no-route result such as [] for an unreachable target. Do not use −1 for unreachable distance; it may be a valid cost.<\/p><p>A route containing L vertices takes O(L) to reconstruct with O(1) original-ID edge lookup. Test a reachable target, the source, an unreachable target and tied/parallel edges. Write the route helper yourself.<\/p>", "code_context": "Method-body fragment with no additional imports. Original edge IDs are row indices in links.", "bridge": "ID 4 means the fifth input row, rather than vertex 4 or cost 4. A directed row [from,to,weight] identifies the predecessor of to. When validating an already supplied edge sequence, instead follow it forward from source."}, "lab": "dag", "quiz": {"RU": {"question": "parent_edge[v] хранит число 2. Что это означает?", "options": ["Расстояние 2", "ID исходного входящего ребра", "Всегда вершину 2"], "feedback": "По ID нужно найти исходное ребро и перейти к его началу."}, "EN": {"question": "parent_edge[v] is 2. What does it mean?", "options": ["Distance 2", "The original incoming edge ID", "Always vertex 2"], "feedback": "Look up the original edge by ID and move to its origin."}, "answer": 1}, "code": "int[][] links = {{0, 1, 3}, {1, 2, 4}};\nint selectedEdgeId = 1;\nint previousVertex = links[selectedEdgeId][0];\nlong lastWeight = links[selectedEdgeId][2];\nSystem.out.println(previousVertex);\nSystem.out.println(lastWeight);", "book": ["22.2", 616, 638, "44sp"], "videos": [], "practice": {"RU": {"task": "Даны рёбра [[0,1,3],[1,2,4]], где строка содержит [from,to,weight]. Для вершины 2 выбрано родительское ребро с ID 1. Найдите предыдущую вершину и вес этого последнего перехода.", "explanation": ["ID 1 выбирает вторую строку массива, то есть ребро 1→2 веса 4.", "Столбец 0 даёт предыдущую вершину 1; столбец 2 — вес перехода.", "Вес 4 относится только к последнему ребру, а не ко всему пути 0→1→2. Для полного пути нужны остальные родительские рёбра."]}, "EN": {"task": "Given edges [[0,1,3],[1,2,4]], with rows [from,to,weight], vertex 2 uses parent edge ID 1. Find the previous vertex and the weight of this final transition.", "explanation": ["ID 1 selects the second row: edge 1→2 of weight 4.", "Column 0 gives the previous vertex, 1; column 2 gives this transition’s weight.", "The value 4 is only the last edge weight, not the total for 0→1→2. A complete route requires following the other parent edges."]}, "output": "1\n4"}}, {"id": "challenges", "lab": null, "quiz": null, "code": "", "book": null, "videos": [], "RU": {"title": "Практикум: решите небольшую задачу", "story": "Вы уже проследили работу алгоритмов. Теперь решите отдельную задачу: прочитайте контракт, проверьте пример вручную, затем напишите функцию и запустите тесты. Начните с разминки 01–04 или переходите к задачам 05–08.", "steps": ["Уточните смысл результата: ID, позиция, стоимость или логическое значение.", "Проверьте обычный и граничный вход. При нескольких допустимых ответах сверяйте смысл, а не порядок записи.", "Напишите solve. Python запускается на странице; Java-файл с тестами можно скачать и выполнить с JDK 17."], "transfer": "Каждая задача разбирает одну технику, полезную при реализации и проверке графов. В основной работе шесть алгоритмов и восстановление пути вы пишете самостоятельно. Успех на этих небольших тестах не заменяет проверку всех требований задания.", "theory": "<p>Здесь нет скрытого оценивания и передачи баллов в Moodle. Все учебные тесты доступны под задачей. Добавляйте собственные случаи и объясняйте, почему ожидаемый ответ верен.<\/p>"}, "EN": {"title": "Practice: solve a small problem", "story": "You have traced the algorithms. Now solve a focused problem: read its contract, check an example by hand, then write a function and run the cases. Start with warm-ups 01–04 or continue to problems 05–08.", "steps": ["Identify what the result means: an ID, a position, a cost or a Boolean.", "Check an ordinary input and a boundary case. When answers are non-unique, compare meaning rather than presentation order.", "Write solve. Run Python on the page, or download a Java file with cases and run it using JDK 17."], "transfer": "Each problem develops one technique for implementing or checking graph programs. Implement the six main assignment algorithms and route reconstruction independently. Passing these small practice cases does not replace the full assignment requirements.", "theory": "<p>There is no hidden grading or mark transfer to Moodle here. Every practice case is available below its problem. Add your own cases and justify the expected results.<\/p>"}}, {"id": "assignment", "RU": {"title": "Переходим от примера к заданию", "story": "Теперь схема должна превратиться в вашу программу. Готовый шаблон уже читает JSON и получает числа и массивы. Ваша часть — структуры данных, алгоритм, проверка его результата и объяснение. Начните с одного метода и одного маленького теста.", "steps": ["Прочитайте поля входа и сохраните исходные ID.", "Напишите свой алгоритм и проверьте его отдельно.", "Оформите только требуемые поля ответа и запустите смешанные запросы."], "transfer": "Откройте src/Java/Algorithms.java в шаблоне graphs. Input.java уже переводит вход в числа и массивы; это вспомогательный класс шаблона, а не часть стандартной Java. Ниже — каркас метода для задачи с рёбрами. Для DSU используйте Input.operations(input), для DAG дополнительно Input.source(input).", "theory": "<h3>Поля результата<\/h3><p>dsu: states. kruskal/prim: cost, edge_ids, components. scc: component, condensation. topo: acyclic, order. dag: acyclic, distance, parent_edge.<\/p><p>Состояние принадлежит одному запросу: не сохраняйте visited, DSU, очереди и расстояния между строками. В stdout должен быть только JSON-ответ. Сохраняйте свои тестовые материалы в tests/. Для старой копии festival пути отличаются: Java/source/Algorithms.java и tests/student/. Проверьте README своей копии.<\/p><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Последняя команда показывает фактический ответ, но сама не сравнивает его с ожидаемым.<\/p>", "code_context": "Вставляйте каркас в соответствующий метод Algorithms.java, где input уже является параметром. Input предоставлен шаблоном graphs; Map импортирован в Algorithms.java. Заполните поля result согласно условию выбранной задачи."}, "EN": {"title": "From the example to your assignment", "story": "Now turn the diagram into your program. The template already parses JSON into numbers and arrays. Your work is the data structures, algorithm, verification and explanation. Start with one method and one small test.", "steps": ["Read the inputs and preserve original edge IDs.", "Implement and test your algorithm separately.", "Return the required fields and test mixed requests."], "transfer": "Open src/Java/Algorithms.java in the graphs template. Its supplied Input.java converts input into numbers and arrays; Input is a template helper, not a standard Java class. The scaffold below is for an edge-based task. DSU uses Input.operations(input); DAG additionally uses Input.source(input).", "theory": "<h3>Result fields<\/h3><p>dsu: states. kruskal/prim: cost, edge_ids, components. scc: component, condensation. topo: acyclic, order. dag: acyclic, distance, parent_edge.<\/p><p>State belongs to one request: do not retain visited flags, a DSU, queues or distances between lines. Standard output contains JSON results only. Keep test materials under tests/. An older festival copy uses Java/source/Algorithms.java and tests/student/ instead. Check your copy’s README.<\/p><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>The last command prints actual output but does not compare it against expected results.<\/p>", "code_context": "Use this scaffold inside the corresponding Algorithms.java method, where input is already a parameter. Input is supplied by the graphs template; Algorithms.java imports Map. Populate result according to the selected task contract."}, "lab": null, "quiz": null, "code": "int n = Input.vertexCount(input);\nint[][] edges = Input.edges(input);\n\n// TODO: your data structures, algorithm and result validation.\n\nMap<String, Object> result = new java.util.LinkedHashMap<>();\n// TODO: add exactly the output fields required for this task.\nreturn result;", "book": null, "videos": []}, {"id": "tests", "RU": {"title": "Как убедиться, что решение работает?", "story": "Один удачный пример легко скрывает ошибку. Представьте, что решение принимает красивый, но неправильный маршрут: расстояние верное, а выбранное ребро ведёт не в ту вершину. Проверьте не только число, но и то, чем оно подтверждается.", "steps": ["Сначала проверьте небольшой пример с объяснимым ответом.", "Затем добавьте границы: петлю, изолят, повтор, равные веса и недостижимость.", "После этого проверьте большие входы, глубокую цепочку и повторные запросы."], "transfer": "Для неоднозначного ответа важна допустимость, а не буквальное совпадение. Сохраните вход, ожидаемый смысл ответа, фактический вывод и команду. Публичные тесты помогают находить ошибки, но не доказывают выполнение всех требований.", "theory": "\n<p class=\"lead\">Успешный запуск не доказывает правильность алгоритма. Проверяйте численный результат, допустимость возвращённых объектов и поведение на границах.<\/p>\n<h2>Проверки по задачам<\/h2><ul><li><strong>DSU:<\/strong> для малого графа пересчитайте компоненты обходом после каждого добавления. Сравните число компонент и максимальный размер.<\/li><li><strong>MST:<\/strong> проверьте уникальность и границы ID, отсутствие петель и циклов, n−c рёбер, связность каждой исходной компоненты и сумму весов. Для малого m переберите все подмножества и найдите истинный минимум. Одного совпадения Краскала и Прима недостаточно: ошибки могут быть общими.<\/li><li><strong>SCC:<\/strong> на малом графе вычислите достижимость между всеми парами. Метки совпадают тогда и только тогда, когда достижимость взаимная. Затем независимо постройте множество межкомпонентных пар.<\/li><li><strong>Topo:<\/strong> проверьте перестановку вершин и position[u]&lt;position[v] для всех рёбер. Наличие цикла можно независимо проверить алгоритмом Кана.<\/li><li><strong>DAG:<\/strong> сравните расстояния с независимой релаксацией на малых графах. Проверьте все родительские пути, направление и стоимость. Отдельно добавьте цикл, недостижимый из source.<\/li><\/ul>\n<h2>Граничные случаи<\/h2><p>Пустые графы там, где разрешены; одна вершина; изолированные вершины; несвязность; повторные объединения; петли; дубликаты и параллельные рёбра; равные оптимумы; отрицательные веса; суммы за пределами int. Для DAG используйте source, отличный от 0, и недостижимые вершины. Для DFS - цепочку из 100000 вершин. Для сброса состояния - смешанные запросы в одном процессе.<\/p>\n<h2>Команды<\/h2><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Установите Python и среду выбранного языка. Создайте my_cases.jsonl сами. Последняя команда только печатает фактические ответы: она не сравнивает их с ожидаемыми. Публичные тесты охватывают лишь часть допустимых входов. Сохраните входы, ожидаемые и фактические ответы и команды в tests/.<\/p>\n\n"}, "EN": {"title": "How do you know the solution works?", "story": "One successful example can hide a bug. Imagine a correct distance paired with an edge that points to the wrong vertex. Check both the value and the witness supporting it.", "steps": ["Start with a small example whose answer you can justify.", "Add boundaries: loops, isolates, repeats, ties and unreachable vertices.", "Then test large inputs, deep chains and repeated requests."], "transfer": "Non-unique outputs need validity checks rather than literal matching. Preserve inputs, justified expectations, actual outputs and commands. Public checks help detect errors, but do not establish every requirement.", "theory": "\n<p class=\"lead\">A successful launch does not prove algorithm correctness. Check numerical results, returned witnesses and boundary behaviour.<\/p>\n<h2>Checks by task<\/h2><ul><li><strong>DSU:<\/strong> on small graphs, recompute components by traversal after each insertion and compare counts and largest sizes.<\/li><li><strong>MST:<\/strong> check unique valid IDs, no loops or cycles, n−c selected edges, original-component connectivity and the weight sum. For small m, enumerate subsets to obtain the actual optimum. Agreement between Kruskal and Prim alone is insufficient: they may share a defect.<\/li><li><strong>SCC:<\/strong> compute all-pairs reachability on small graphs. Labels coincide exactly when reachability is mutual. Independently construct the set of cross-component pairs.<\/li><li><strong>Topo:<\/strong> check a vertex permutation and position[u]&lt;position[v] for every edge. Kahn's algorithm independently checks cycle existence.<\/li><li><strong>DAG:<\/strong> compare distances with independent relaxation on small graphs. Check every parent route, its direction and cost. Add a cycle unreachable from source.<\/li><\/ul>\n<h2>Boundary cases<\/h2><p>Include empty graphs where allowed, one vertex, isolates, disconnected graphs, repeated unions, loops, duplicates, parallel edges, ties, negative weights and totals beyond int. Use a nonzero source and unreachable vertices. Test a 100000-vertex DFS chain and mixed requests in one process to check state reset.<\/p>\n<h2>Commands<\/h2><pre>python tools/run.py --setup\npython tools/run.py --check\npython tools/run.py --input tests/my_cases.jsonl<\/pre><p>Install Python and the chosen language runtime. Create my_cases.jsonl yourself. The final command prints actual answers without comparing expected results. Public checks cover published cases, not all limits. Preserve inputs, justified expected answers, actual outputs and commands under tests/.<\/p>\n\n"}, "lab": null, "quiz": {"RU": {"question": "Два решения вернули разные ID рёбер, но оба леса допустимы и оптимальны. Это ошибка?", "options": ["Нет", "Да, ID обязаны совпасть", "Да, если порядок рёбер другой"], "feedback": "При равных оптимумах принимаются разные корректные свидетельства."}, "EN": {"question": "Two solutions return different edge IDs, but both forests are feasible and optimal. Is that an error?", "options": ["No", "Yes; IDs must match", "Yes, if the order differs"], "feedback": "Different valid witnesses are accepted when optima tie."}, "answer": 0}, "code": "", "book": null, "videos": []}, {"id": "analysis", "RU": {"title": "Объяснить решение и честно измерить время", "story": "Два алгоритма дают одинаковую стоимость, но один оказался быстрее на вашем графе. Что именно вы измерили: алгоритм, чтение JSON, построение списков или запуск JVM? Сравнение имеет смысл только при одинаковых условиях.", "steps": ["Сначала объясните, почему результат корректен.", "Отдельно оцените зависимость времени и памяти от n и m.", "Затем измерьте обе реализации на одинаковых графах и обсудите ограничения эксперимента."], "transfer": "В ANALYSIS.md нужны ваши инварианты, граничные случаи и реальные результаты. Для Краскала и Прима сравните три размера графов, минимум три замера каждого метода и медианы. Не превращайте одну таблицу времени в доказательство асимптотики.", "theory": "\n<p class=\"lead\">В ANALYSIS.md объясните, почему решение правильно и какие ресурсы оно требует. Измерения времени отвечают на другой вопрос: как ведёт себя ваша реализация на выбранных данных.<\/p>\n<h2>Структура объяснения<\/h2><p>Для каждого метода запишите цель, структуры данных, инвариант, инициализацию, сохранение инварианта и вывод при завершении. Затем разберите границы и время/память, включая возвращаемый результат. Сошлитесь на конкретные строки или функции своего кода. Для DFS объясните cursor и отсутствие зависимости от глубины стека вызовов; для DAG - проверку всех компонент и запрет релаксации из null.<\/p>\n<p><strong>Обозначения:<\/strong> n — число вершин, m — число входных рёбер, q — число операций DSU, L — число вершин восстановленного пути. α(n) — обратная функция Аккермана; она растёт очень медленно. Оценка с ней амортизированная: относится к суммарной работе последовательности операций.<\/p><table><tr><th>Метод<\/th><th>Время<\/th><th>Память с результатом<\/th><\/tr><tr><td>DSU<\/td><td>O(n+q α(n)), амортизированно<\/td><td>O(n+q)<\/td><\/tr><tr><td>Краскал<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Прим, ленивый<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Косарайю<\/td><td>O(n+m); для удаления повторов через хеш-множество - ожидаемо<\/td><td>O(n+m)<\/td><\/tr><tr><td>Topo / DAG<\/td><td>O(n+m)<\/td><td>O(n+m)<\/td><\/tr><tr><td>Восстановление пути<\/td><td>O(L)<\/td><td>O(L), результат<\/td><\/tr><\/table>\n<h2>Сравнение Краскала и Прима<\/h2><p>Возьмите три размера графа. Для каждого используйте одни и те же рёбра, веса и среду для обоих методов; сначала подтвердите оптимальные стоимости и допустимость лесов. Проведите минимум три замера каждого метода и вычислите медиану. Укажите n, m, генератор/seed либо сохранённые входы, команды, версию среды, оборудование, таймер и прогрев.<\/p>\n<p>Исключите компиляцию. Заранее определите границы: например, от готового int[][] до готового результата, включая создание списков и очереди. Если включаете разбор JSON или вывод, включайте одинаково у обоих методов и сообщите об этом. Не сравнивайте прогретый метод с единственным первым запуском другого. В Java пригоден System.nanoTime; в Python - time.perf_counter.<\/p>\n<p>Одна серия на трёх размерах не доказывает асимптотику. На результат влияют плотность графа, порядок рёбер, структура компонент, выделение памяти и прогрев JVM. Отделите наблюдения от доказанной оценки сложности. Приводите только реальные измерения. Отчёт напишите на английском, укажите источники, помощь инструментов и собственную проверку по силлабусу.<\/p>\n"}, "EN": {"title": "Explain the solution and measure it fairly", "story": "Two algorithms produce the same cost, but one is faster on your graph. Did you measure the algorithm, JSON parsing, adjacency construction or JVM startup? A comparison needs matching conditions.", "steps": ["Explain correctness first.", "Analyse how time and memory depend on n and m.", "Then measure both implementations on identical graphs and discuss experimental limits."], "transfer": "ANALYSIS.md needs your invariants, boundary cases and actual results. Compare Kruskal and Prim at three sizes, with at least three timings per method and medians. A timing table is not a proof of asymptotic complexity.", "theory": "\n<p class=\"lead\">ANALYSIS.md explains why the solution is correct and what resources it requires. Timings answer a separate question: how your implementation behaves on selected inputs.<\/p>\n<h2>Structure of the argument<\/h2><p>For each method, state the objective, data structures, invariant, initialisation, preservation and termination argument. Then discuss boundaries and time/memory, including returned output. Refer to your own functions or lines. For DFS, explain cursor and independence from call-stack depth; for DAG, explain whole-graph cycle detection and skipping null distances.<\/p>\n<p><strong>Notation:<\/strong> n is the vertex count, m the input edge count, q the DSU operation count, and L the reconstructed route length in vertices. α(n) is the inverse Ackermann function, which grows very slowly. The amortised bound describes total work over a sequence of operations.<\/p><table><tr><th>Method<\/th><th>Time<\/th><th>Memory including output<\/th><\/tr><tr><td>DSU<\/td><td>O(n+q α(n)), amortised<\/td><td>O(n+q)<\/td><\/tr><tr><td>Kruskal<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Lazy Prim<\/td><td>O(n+m log(m+1))<\/td><td>O(n+m)<\/td><\/tr><tr><td>Kosaraju<\/td><td>O(n+m); expected with hash deduplication<\/td><td>O(n+m)<\/td><\/tr><tr><td>Topo / DAG<\/td><td>O(n+m)<\/td><td>O(n+m)<\/td><\/tr><tr><td>Route reconstruction<\/td><td>O(L)<\/td><td>O(L) output<\/td><\/tr><\/table>\n<h2>Kruskal–Prim benchmark<\/h2><p>Use three graph sizes. For each size, supply identical edges, weights and environment to both algorithms. Verify optimum costs and forest feasibility before measuring. Record at least three timings per method and their median. State n, m, the generator/seed or saved inputs, commands, runtime version, hardware, timer and warm-up.<\/p>\n<p>Exclude compilation. Define a timing boundary beforehand: for example, from a ready int[][] to the returned result, including adjacency-list and heap construction. If JSON parsing or output is included, include it equally and say so. Do not compare a warmed method against only the first invocation of the other. System.nanoTime is suitable in Java; time.perf_counter in Python.<\/p>\n<p>One experiment at three sizes does not prove asymptotic complexity. Density, edge order, component structure, allocation and JVM warm-up affect timings. Separate observations from the proven complexity bound. Report actual measurements only. Write the analysis in English and acknowledge sources, tool assistance and your verification according to the syllabus.<\/p>\n"}, "lab": null, "quiz": null, "code": "", "book": null, "videos": []}, {"id": "reading", "RU": {"title": "Книги курса: открыть нужный раздел", "story": "К учебнику стоит обращаться с конкретным вопросом: почему выбор безопасен, что означает завершение DFS, откуда берётся оценка времени? Ниже можно сразу открыть PDF из материалов курса на нужной странице.", "steps": ["Выберите тему, которую сейчас разбираете.", "Откройте нужную страницу и сопоставьте обозначения со схемой.", "После чтения объясните один ключевой шаг своими словами."], "transfer": "По силлабусу основные книги — CLRS, 4-е издание (2022), и Sedgewick & Wayne, 4-е издание (2011). Skiena, 3-е издание (2020), — дополнительная. Ниже доступны PDF этих изданий и переходы к разделам, связанным с темой урока.", "theory": ""}, "EN": {"title": "Course books: open the relevant section", "story": "Go to the textbook with a specific question: why is a choice safe, what does DFS finishing mean, or where does a complexity bound come from? Open the supplied course PDF directly at the relevant page below.", "steps": ["Choose the topic you are studying.", "Open its page and connect the notation to the diagram.", "After reading, explain one important step in your own words."], "transfer": "The syllabus lists CLRS, fourth edition (2022), and Sedgewick & Wayne, fourth edition (2011), as main textbooks; Skiena, third edition (2020), is additional. Open these editions below at the sections related to the lesson.", "theory": ""}, "lab": null, "quiz": null, "code": "", "book": null, "videos": []}, {"id": "video", "RU": {"title": "Смотреть по теме: видео и учебный пример", "story": "Выберите одно видео по текущему вопросу, а не длинный курс целиком. Перед просмотром решите, что хотите увидеть: изменение групп, выбор ребра, завершение DFS или обновление стоимости. После видео вернитесь к схеме и повторите пример без подсказки.", "steps": ["Для введения начните с DSU или DFS.", "Для конкретного алгоритма выберите тематическую карточку.", "Для общего повторения оставлен наш видеоурок на 20 минут."], "transfer": "Внешние видео объясняют алгоритмы, но не определяют JSON-контракт или правила сдачи. В DAG-видео часть о longest path дополнительная. Для SCC нужен Косарайю, для topo — DFS: Tarjan, Kahn и Dijkstra не заменяют требуемые методы. Учебный Java-файл ниже решает другую задачу — достижимость через BFS.", "theory": "<div class=\"lessonVideo\"><\/div><h3>Запустите похожий учебный пример<\/h3><p>ReachabilityDemo.java использует список смежности, очередь и visited, чтобы найти достижимые комнаты. Он не содержит DSU, Краскала, Прима, Косарайю, топологической сортировки или кратчайших путей DAG. Сравните очередь BFS с активным стеком DFS; не подставляйте BFS вместо требуемого алгоритма.<\/p><p><a href=\"code/ReachabilityDemo.java\" download>Скачать ReachabilityDemo.java<\/a><\/p><pre>javac --release 17 -encoding UTF-8 ReachabilityDemo.java\njava ReachabilityDemo<\/pre><p>Ожидаемый вывод: Reachable from 0: [0, 1, 2, 3]; vertex 4 reachable: false.<\/p>"}, "EN": {"title": "Watch by topic: videos and a learning example", "story": "Choose one video for your current question rather than an entire course. Decide what to watch for: changing groups, edge choices, DFS finishing or distance updates. Then return to the diagram and repeat the example without hints.", "steps": ["Start with DSU or DFS for foundations.", "Choose a topic card for a particular algorithm.", "Use the 20-minute course video for a full review."], "transfer": "External videos explain algorithms rather than defining JSON contracts or submission rules. The DAG video’s longest-path part is optional. SCC requires Kosaraju and topo requires DFS; Tarjan, Kahn and Dijkstra are not substitutes. The Java file below solves a different problem: reachability using BFS.", "theory": "<div class=\"lessonVideo\"><\/div><h3>Run a related learning example<\/h3><p>ReachabilityDemo.java uses adjacency lists, a queue and visited flags to find reachable rooms. It contains none of the six assignment algorithms. Compare its BFS queue with an active DFS stack; do not substitute BFS for a required method.<\/p><p><a href=\"code/ReachabilityDemo.java\" download>Download ReachabilityDemo.java<\/a><\/p><pre>javac --release 17 -encoding UTF-8 ReachabilityDemo.java\njava ReachabilityDemo<\/pre><p>Expected output: Reachable from 0: [0, 1, 2, 3]; vertex 4 reachable: false.<\/p>"}, "lab": null, "quiz": null, "code": "", "book": null, "videos": [{"id": "ibjEGG7ylHk", "title": "Union Find Introduction", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/ibjEGG7ylHk/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "0jNmHPfA_yE", "title": "Union Find - Union and Find Operations", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/0jNmHPfA_yE/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "VHRhJWacxis", "title": "Union Find Path Compression", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/VHRhJWacxis/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "JZBQLXgSGfs", "title": "Union Find Kruskal's Algorithm", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/JZBQLXgSGfs/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "jsmMtJpPnhU", "title": "Prim's Minimum Spanning Tree Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/jsmMtJpPnhU/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "RpgcYiky7uw", "title": "Strongly Connected Components Kosaraju's Algorithm Graph Algorithm", "author": "Tushar Roy - Coding Made Simple", "thumbnail": "https://i.ytimg.com/vi/RpgcYiky7uw/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "eL-KzMXSXXI", "title": "Topological Sort Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/eL-KzMXSXXI/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "TXkDpqjDMHA", "title": "Shortest/Longest path on a Directed Acyclic Graph (DAG)  | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/TXkDpqjDMHA/hqdefault.jpg", "verified": "2026-10-19"}, {"id": "7fujbpJ0LB4", "title": "Depth First Search Algorithm | Graph Theory", "author": "WilliamFiset", "thumbnail": "https://i.ytimg.com/vi/7fujbpJ0LB4/hqdefault.jpg", "verified": "2026-10-19"}]}]</script><script>const PRACTICE_WORKER_URL='practice-worker.js?v=300d61a0eb',PRACTICE_ASSET_VERSION='f3552da642';
'use strict';
const practiceProblems = JSON.parse(document.getElementById('practice-data').textContent);
const practiceDrafts = new Map(), predictionDrafts = new Map(), caseDrafts = new Map();
let selectedProblem = 'outgoing', practiceLanguage = 'Python', activePracticeRun = null;
const practiceProblemFor = {model:'outgoing',dsu:'sizes',dfs:'positions',dag:'relax',prim:'boundary',kruskal:'boundary',topo:'order',scc:'pairs',route:'walk'};
function practiceSame(id, actual, expected) {
  if (id !== 'pairs') return JSON.stringify(actual) === JSON.stringify(expected);
  if (!Array.isArray(actual) || actual.some(p => !Array.isArray(p) || p.length!==2 || p.some(x=>!Number.isSafeInteger(x)))) return false;
  const keys = actual.map(p=>JSON.stringify(p));
  return new Set(keys).size===keys.length && keys.sort().join('|')===expected.map(p=>JSON.stringify(p)).sort().join('|');
}
function problemInput(p, test) { return Object.fromEntries(p.args.map((name,i)=>[name,test.args[i]])); }
function problemLink(id) { return '#'+new URLSearchParams({topic:'challenges',lang:language,problem:id}); }
function stopPracticeRun(message) {
  if (!activePracticeRun) return;
  const run=activePracticeRun;activePracticeRun=null;
  clearTimeout(run.timer);run.worker.terminate();run.runButton.disabled=false;run.stopButton.disabled=true;
  if (message) run.status.textContent=message;
}
function attachPrediction(c) {
  if (!c.practice) return;
  const root=document.createElement('div');root.className='prediction';
  const state=predictionDrafts.get(c.id)||{answer:''};predictionDrafts.set(c.id,state);
  root.innerHTML='<label for="predictionAnswer">'+tr('Предскажите вывод: каждая println — в отдельной строке','Predict the output: one println per line')+'</label><textarea id="predictionAnswer" rows="3" spellcheck="false"></textarea><div class="controls"><button data-check-prediction>'+tr('Проверить предсказание','Check prediction')+'</button><button data-clear-prediction>'+tr('Очистить','Clear')+'</button></div><p class="live small" role="status" aria-live="polite"></p>';
  const field=root.querySelector('textarea'), status=root.querySelector('[role=status]');field.value=state.answer;field.oninput=()=>state.answer=field.value;
  root.querySelector('[data-check-prediction]').onclick=()=>{
    try {
      const parse=text=>text.split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x));
      const actual=parse(field.value), expected=parse(c.practice.output);
      if (!actual.length) throw new Error('empty');
      const ok=JSON.stringify(actual)===JSON.stringify(expected);
      status.textContent=ok?tr('Верно. Теперь сопоставьте каждую строку с действием кода.','Correct. Now connect each line with its code operation.'):tr('Результат отличается. Проследите изменения по строкам; при необходимости откройте разбор.','The result differs. Trace each change; open the walkthrough if needed.');
    } catch {
      status.textContent=tr('Введите числа, true/false или массивы, например [2, 0], по одной строке вывода. Пробелы внутри массивов допустимы.','Enter numbers, true/false or arrays such as [2, 0], one output line at a time. Spaces inside arrays are accepted.');
    }
  };
  root.querySelector('[data-clear-prediction]').onclick=()=>{field.value='';state.answer='';status.textContent='';};
  document.getElementById('practice').querySelector('.practice > details').before(root);
}
function paintExtensions(c) {
  const box=document.getElementById('extension');box.replaceChildren();
  if(c.id==='challenges') {document.getElementById('steps').replaceChildren();document.getElementById('transfer').replaceChildren();paintChallengeHub(box);return; }
  const id=practiceProblemFor[c.id];
  if(id) box.innerHTML='<p class="practiceLink"><a href="'+problemLink(id)+'">'+tr('Следующий шаг: самостоятельная задача с тестами','Next: an independent problem with test cases')+' → '+esc(practiceProblems.find(p=>p.id===id)[language].title)+'</a></p>';
  if(['dag','route'].includes(c.id)) paintRelaxationCases(box,c.id);
  if(['prim','kruskal','mst'].includes(c.id)) paintBoundaryCases(box,c.id);
}
function paintChallengeHub(box) {
  const requested=new URLSearchParams(location.hash.slice(1)).get('problem');
  if(practiceProblems.some(p=>p.id===requested)) selectedProblem=requested;
  const p=practiceProblems.find(p=>p.id===selectedProblem),t=p[language];
  box.innerHTML='<section class="challenge"><label for="problemChoice">'+tr('Выберите задачу','Choose a problem')+'</label><select id="problemChoice">'+practiceProblems.map(q=>'<option value="'+q.id+'"'+(q.id===p.id?' selected':'')+'>'+esc(q[language].title)+'</option>').join('')+'</select><p class="small">'+tr('01–04: разминка после примера. 05–08: самостоятельная проверка и выбор. Все тесты учебные; результат не является оценкой за задание.','01–04: warm-ups after a worked example. 05–08: independent validation and selection. These public practice cases do not award assignment marks.')+'</p><h2>'+esc(t.title)+'</h2><p>'+esc(t.task)+'</p><p class="small"><b>'+tr('Ограничения: ','Constraints: ')+'</b>'+esc(t.limits)+'</p><p class="small"><b>'+tr('Применение: ','Application: ')+'</b>'+esc(t.use)+'</p><div class="problemExamples"></div><details class="deep"><summary>'+tr('Подсказка','Hint')+'</summary><div class="deepbody"><p>'+esc(t.hint)+'</p></div></details><div class="answerTry"></div><div class="languageChoice controls" role="group" aria-label="'+tr('Язык решения','Solution language')+'"><button data-language="Python" aria-pressed="'+(practiceLanguage==='Python')+'">Python · '+tr('на странице','in the browser')+'</button><button data-language="Java" aria-pressed="'+(practiceLanguage==='Java')+'">Java 17 · '+tr('локально','locally')+'</button></div><div class="codeWorkspace"></div><details class="deep solutionReveal"><summary>'+tr('Показать один вариант решения и разбор','Show one solution and walkthrough')+'</summary><div class="deepbody"><pre><code></code></pre><ol>'+t.explain.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p><b>'+tr('Ресурсы: ','Resources: ')+'</b>'+esc(t.complexity)+'</p></div></details><details class="deep publicCases"><summary>'+tr('Все учебные тесты','All practice cases')+' · '+p.tests.length+'</summary><div class="deepbody"></div></details></section>';
  box.querySelector('#problemChoice').onchange=e=>{stopPracticeRun();selectedProblem=e.target.value;location.hash=new URLSearchParams({topic:'challenges',lang:language,problem:selectedProblem});};
  const topic=chapters.find(c=>c.id===p.topic);
  box.querySelector('h2').insertAdjacentHTML('afterend','<p class="small"><a href="#'+new URLSearchParams({topic:p.topic,lang:language})+'">'+tr('Повторить тему: ','Review the topic: ')+esc(topic[language].title)+'</a></p>');
  const examples=box.querySelector('.problemExamples');
  p.tests.slice(0,2).forEach((test,i)=>{const div=document.createElement('div');div.className='example';div.innerHTML='<h3>'+tr('Пример ','Example ')+(i+1)+'</h3><pre>'+esc(JSON.stringify(problemInput(p,test)))+'</pre><p>'+tr('Результат: ','Result: ')+'<code>'+esc(JSON.stringify(test.expected))+'</code></p><p>'+esc(p.notes[i][language==='RU'?0:1])+'</p>';examples.append(div);});
  paintAnswerTry(box.querySelector('.answerTry'),p);
  box.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>{stopPracticeRun();practiceLanguage=b.dataset.language;paintChallengeHub(box);});
  const solution=box.querySelector('.solutionReveal code');solution.textContent=practiceLanguage==='Python'?p.python:p.java;
  box.querySelector('.publicCases .deepbody').innerHTML=p.tests.map((test,i)=>'<p><b>'+tr('Тест ','Case ')+(i+1)+'</b></p><pre>'+esc(JSON.stringify(problemInput(p,test)))+'\n'+tr('Ожидается: ','Expected: ')+esc(JSON.stringify(test.expected))+'</pre>').join('');
  paintCodeWorkspace(box.querySelector('.codeWorkspace'),p);
}
function paintAnswerTry(box,p) {
  const state=caseDrafts.get('answer-'+p.id)||{index:0,answer:''};caseDrafts.set('answer-'+p.id,state);
  const test=p.tests[state.index];
  box.innerHTML='<h3>'+tr('Сначала проверьте ответ без кода','First, predict a result without code')+'</h3><label for="answerCase">'+tr('Входные данные','Input case')+'</label><select id="answerCase">'+p.tests.map((_,i)=>'<option value="'+i+'"'+(state.index===i?' selected':'')+'>'+tr('Тест ','Case ')+(i+1)+'</option>').join('')+'</select><pre>'+esc(JSON.stringify(problemInput(p,test)))+'</pre><label for="problemAnswer">'+tr('Ваш результат в JSON','Your result as JSON')+'</label><textarea id="problemAnswer" rows="2" spellcheck="false"></textarea><div class="controls"><button data-check-answer>'+tr('Проверить ответ','Check answer')+'</button></div><p class="live" role="status" aria-live="polite"></p>';
  const input=box.querySelector('textarea'),status=box.querySelector('[role=status]');input.value=state.answer;input.oninput=()=>state.answer=input.value;
  box.querySelector('select').onchange=e=>{state.index=Number(e.target.value);state.answer='';paintAnswerTry(box,p);};
  box.querySelector('[data-check-answer]').onclick=()=>{try{const actual=JSON.parse(input.value);status.textContent=practiceSame(p.id,actual,test.expected)?tr('Верно для этого входа. Теперь проверьте свою функцию на остальных случаях.','Correct for this input. Now check your function on the other cases.'):tr('Ответ отличается. Проверьте контракт, направление рёбер и граничный случай. Подсказка и разбор доступны отдельно.','The answer differs. Check the contract, edge directions and boundary case. The hint and solution are available separately.');}catch{status.textContent=tr('Нужен JSON: число, true/false, null или массив. Например: [0,2] либо [[5,9],[9,3]].','Enter JSON: a number, true/false, null or an array. For example: [0,2] or [[5,9],[9,3]].');}};
}
function paintCodeWorkspace(box,p) {
  const isPython=practiceLanguage==='Python',key=p.id+'-'+practiceLanguage;
  const starter=isPython?p.starter_python:p.starter_java;
